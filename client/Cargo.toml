# MyDevEnv2 native desktop client.
#
# Its own Cargo workspace (root MyDevEnv2 excludes `client`) so the heavy
# fluent-gpui dependency graph never slows the server build/CI.
#
# GUI stack: AusAgentSmith-org/fluent-gpui (a vendored GPUI fork plus Fluent 2
# design/layout crates). Built/tested on Linux; Windows is the primary
# deployment target.
[workspace]

[package]
name = "mydevenv2-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native desktop client for MyDevEnv2 (fluent-gpui)"
repository = "https://repo.indexarr.net/indexarr/MyDevEnv2"
rust-version = "1.80"

[[bin]]
name = "mydevenv2-client"
path = "src/main.rs"

[features]
# The GUI is the real product; core networking/terminal logic builds without it
# so `cargo test --no-default-features` exercises the protocol/terminal/client
# layer without compiling the heavy GPUI graph.
default = ["gui"]
# Keep the Windows console subsystem (stdout/stderr) for debugging. Off by
# default so the shipped app launches without a console window.
console = []
gui = [
    "dep:gpui",
    "dep:fluent-core",
    "dep:fluent-app",
    "dep:fluent-layout",
    "dep:fluent-ribbon",
    "dep:fluent-primitives",
]

[dependencies]
# ── GUI: pinned AusAgentSmith-org/fluent-gpui framework ──────────────────────
gpui = { git = "https://github.com/AusAgentSmith-org/fluent-gpui.git", rev = "f601e54b4e58e416bc7495a75468b82af9a10545", package = "gpui", optional = true }
fluent-core = { git = "https://github.com/AusAgentSmith-org/fluent-gpui.git", rev = "f601e54b4e58e416bc7495a75468b82af9a10545", package = "fluent-core", optional = true }
fluent-app = { git = "https://github.com/AusAgentSmith-org/fluent-gpui.git", rev = "f601e54b4e58e416bc7495a75468b82af9a10545", package = "fluent-app", optional = true }
fluent-layout = { git = "https://github.com/AusAgentSmith-org/fluent-gpui.git", rev = "f601e54b4e58e416bc7495a75468b82af9a10545", package = "fluent-layout", optional = true }
fluent-ribbon = { git = "https://github.com/AusAgentSmith-org/fluent-gpui.git", rev = "f601e54b4e58e416bc7495a75468b82af9a10545", package = "fluent-ribbon", optional = true }
fluent-primitives = { git = "https://github.com/AusAgentSmith-org/fluent-gpui.git", rev = "f601e54b4e58e416bc7495a75468b82af9a10545", package = "fluent-primitives", optional = true }

# ── Async runtime: server attach/SSE/HTTP run on a background tokio runtime ────
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-stream = "0.3"

# ── Networking: REST + SSE over HTTPS, PTY attach over WSS. rustls everywhere ──
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
url = "2"

# ── Terminal: VT100 parser + monospace glyph rasterizer (ported from rdpapp) ──
vte = "0.13"
unicode-width = "0.2"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }

# ── Serde / data ──────────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

# ── Misc ──────────────────────────────────────────────────────────────────────
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
dirs-next = "2"

# Pure-Rust Windows manifest embedding (build.rs). Unconditional so it's present
# on a Linux host cross-compiling to Windows; build.rs gates on the *target* OS.
[build-dependencies]
embed-manifest = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# DEV-ONLY Windows cross-build profile. Lets a Linux dev type-check/link the
# Windows target without a Windows host, by flipping gpui to its debug
# runtime-shader path (avoids the fxc-only release precompile that can't run on
# Linux). The resulting binary is NOT distributable: gpui's debug path compiles
# HLSL from source files at a build-machine path that doesn't exist on a user's
# PC, so it fails at launch. Real Windows builds are native — see
# `.woodpecker/client-windows.yml`.
[profile.win-dist]
inherits = "release"
debug-assertions = true
lto = false
strip = true
