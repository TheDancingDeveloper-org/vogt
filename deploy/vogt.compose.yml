# The core alone — the base of the *contributor* stack.
#
# Not the way to deploy Vogt. That is `stack.compose.yml` beside this file,
# which runs the published all-in-one image (DEPLOYMENT.md §1.1). This file
# runs the Python core by itself, and exists so that a core or an engine you
# are changing can be run from a checkout: `vogt.build.yml` swaps the image
# for a build of this tree, and `engine.overlay.yml` builds the engine and
# puts it in front. CI's end-to-end suite drives the same three files.
#
# It knows nothing about any particular estate: no Komodo, Tailscale,
# Infisical, Cadastre or MCP client, and `tests/test_public_delivery.py` keeps
# it that way.
#
# Run the core alone:
#
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/vogt.compose.yml up -d
#
# Build it from the checkout instead of pulling the published core image:
#
#   docker compose -f deploy/vogt.compose.yml -f deploy/vogt.build.yml up --build -d
#
# Nothing below needs editing to layer onto; that is the point of it being a
# base.

services:
  vogt:
    # Pinned by tag here so the example reads. A real deployment pins the
    # digest — publishing an image and moving a deployment are separate acts
    # (NFR-D10), and a digest is the only form of "which image is this" a
    # rebuild cannot silently change.
    image: ${VOGT_IMAGE:-ghcr.io/thedancingdeveloper-org/vogt:0.5.3}
    restart: unless-stopped

    # The image runs as any uid so long as the gid is 0: `/var/lib/vogt` is
    # owned by group 0 and group-writable precisely so this is a deploy-time
    # choice rather than a rebuild. Set VOGT_UID to the uid that owns the
    # files this instance observes.
    user: "${VOGT_UID:-1000}:0"

    # `vogt init` is required, not decoration: `serve` on an empty data
    # directory answers /health/ready with 503 and "run `vogt init` first".
    # It is idempotent — it creates the instance on a new volume, migrates an
    # existing one, and leaves the audit history alone on every restart after
    # that.
    #
    # One list element, deliberately. Compose applies shell-style word
    # splitting to a *string* command and truncates it at the `>` redirect,
    # so the folded-scalar form of this silently becomes `["vogt", "init"]`
    # and the server never starts. A single-element list is passed through
    # verbatim to `sh -c`.
    entrypoint: ["/usr/local/bin/vogt-lifecycle"]
    command:
      - /bin/sh
      - -c
      - vogt init && exec vogt serve --host 0.0.0.0 --port 8000

    # `0.0.0.0` above is the *container's* namespace. Host exposure is
    # decided here, and defaults to loopback: the example will not put an
    # instance on a network interface because nobody said otherwise. Set
    # VOGT_BIND_IP to publish it somewhere real.
    ports:
      - "${VOGT_BIND_IP:-127.0.0.1}:${VOGT_PORT:-8080}:8000"

    environment:
      VOGT_DATA_DIR: /var/lib/vogt
      # An exposure value: the process cannot know the address clients reach
      # it at, so it is asked for rather than guessed (NFR-D2, FR-A8).
      VOGT_PUBLIC_URL: "${VOGT_PUBLIC_URL:?Set VOGT_PUBLIC_URL in .env}"
      VOGT_LOG_LEVEL: "${VOGT_LOG_LEVEL:-info}"
      VOGT_LIFECYCLE_STATE_DIR: /var/lib/vogt/.lifecycle
      VOGT_LIFECYCLE_WORKDIR: /var/lib/vogt
      VOGT_LIFECYCLE_HEALTHCHECK_URL: http://127.0.0.1:8000/health/ready

    # `import_root` is deliberately left at its default of
    # `<data_dir>/repos`, which lives on this volume and is writable by the
    # uid above. Pointing it at a mounted estate is a customisation, and one
    # with an ownership requirement — see `docs/CUSTOMISATION.md`.
    volumes:
      - vogt-data:/var/lib/vogt

    # The image is unprivileged by construction. Keeping these here makes the
    # hardening visible, and survivable: the only writable paths are the
    # volume and the tmpfs below.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    # Plain HTTP against the readiness endpoint. No MCP handshake, no bearer
    # token: a health check that needs a credential is a health check that
    # fails for the wrong reason.
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/vogt-lifecycle
        - health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vogt-data:
