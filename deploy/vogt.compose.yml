# Generic, Python-core Compose example.
#
# This file is the public self-hosting path. It deliberately does not know
# about the private estate, the Rust session engine, Komodo, Tailscale,
# Infisical, Cadastre, or an MCP client. Copy deploy/.env.example to .env,
# adjust the values for the host, and run `docker compose -f
# deploy/vogt.compose.yml up --build -d`.

services:
  vogt:
    build:
      context: ..
      dockerfile: Dockerfile
    image: vogt:local
    restart: unless-stopped
    # Bootstrap is idempotent: it creates the first local actor on a new
    # volume and migrates an existing instance before opening the listener.
    # Subsequent restarts leave the instance and its audit history intact.
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      vogt init >/dev/null &&
      exec vogt serve --host 0.0.0.0 --port 8000

    # The host-side port is an allocation and has a safe local default. The
    # public URL is an exposure decision and is supplied explicitly in .env.
    ports:
      - "${VOGT_PORT:-8080}:8000"

    environment:
      VOGT_DATA_DIR: /var/lib/vogt
      VOGT_IMPORT_ROOT: /workspace/repos
      VOGT_PUBLIC_URL: "${VOGT_PUBLIC_URL:?Set VOGT_PUBLIC_URL in .env}"
      VOGT_LOG_LEVEL: "${VOGT_LOG_LEVEL:-info}"

    volumes:
      - vogt-data:/var/lib/vogt
      - vogt-workspace:/workspace

    # The image is unprivileged by default. Keeping these settings in the
    # example makes the hardening visible and prevents an operator from
    # accidentally weakening it while adapting the file.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vogt-data:
  vogt-workspace:
