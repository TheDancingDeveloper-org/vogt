# Self-hosted voice (STT + TTS) — an optional overlay.
#
#   docker compose \
#     -f deploy/stack.compose.yml \
#     -f deploy/voice.overlay.yml \
#     up -d
#
# Keyed on the published stack's one service, `vogt`, which is the engine's
# container there. On the two-container contributor stack the engine is the
# `engine` service instead; point it at these containers by setting the
# `ENGINE_ASSISTANT_*_BASE_URLS` values in deploy/.env rather than layering
# this file.
#
# The engine already speaks the standard OpenAI audio interface for speech —
# `POST /v1/audio/transcriptions` (STT) and `POST /v1/audio/speech` (TTS) — and
# on the public stack both point at nothing, so a fresh install has the voice
# controls present but inert. This overlay fills that gap without a paid
# account and without locking you to any provider: it runs two small,
# OpenAI-compatible, CPU-only services locally and points the engine at them.
#
#   - `whisper` — STT via speaches (faster-whisper under the OpenAI audio API)
#   - `tts`     — TTS via openedai-speech (Piper voices under the OpenAI audio API)
#
# Both are pinned only by tag here so the example reads; pin a digest for
# anything you would call a deployment. Both listen on port 8000 inside the
# container and are reached by the engine over the Compose network by service
# name — `http://whisper:8000/v1`, `http://tts:8000/v1`. Neither is published
# to the host: the engine is the only front door.
#
# The escape hatch is preserved. Every value the engine reads stays a
# `${VAR:-default}`, so setting `ENGINE_ASSISTANT_STT_BASE_URLS` /
# `ENGINE_ASSISTANT_TTS_BASE_URLS` (and the matching model/voice) in deploy/.env
# points the engine at OpenAI, Groq, or any other OpenAI-compatible provider
# instead — you are never bound to the two containers below.

services:
  # ── the engine, pointed at the two local speech services ──────────────────
  # An overlay states differences only: this block just overrides the speech
  # wiring the engine overlay left empty. The models below are the ids these
  # two images actually serve (a faster-whisper repo id for speaches, the
  # OpenAI-compatible `tts-1` + `nova` for openedai-speech) — kept overridable
  # so pointing at a real provider is a one-line change in deploy/.env.
  vogt:
    environment:
      ENGINE_ASSISTANT_STT_BASE_URLS: "${ENGINE_ASSISTANT_STT_BASE_URLS:-http://whisper:8000/v1}"
      ENGINE_ASSISTANT_STT_MODEL: "${ENGINE_ASSISTANT_STT_MODEL:-Systran/faster-whisper-small}"
      ENGINE_ASSISTANT_TTS_BASE_URLS: "${ENGINE_ASSISTANT_TTS_BASE_URLS:-http://tts:8000/v1}"
      ENGINE_ASSISTANT_TTS_MODEL: "${ENGINE_ASSISTANT_TTS_MODEL:-tts-1}"
      ENGINE_ASSISTANT_TTS_VOICE: "${ENGINE_ASSISTANT_TTS_VOICE:-nova}"
    depends_on:
      - whisper
      - tts

  # ── whisper: speech-to-text (speaches / faster-whisper, CPU) ──────────────
  whisper:
    image: "${VOGT_STT_IMAGE:-ghcr.io/speaches-ai/speaches:latest-cpu}"
    restart: unless-stopped
    environment:
      # Keep the model cache on the named volume below so a restart does not
      # re-download the faster-whisper weights.
      HF_HOME: /home/ubuntu/.cache/huggingface
    # speaches does not fetch a model until one is asked for, and then answers
    # the first request with "not installed" rather than downloading inline.
    # Pre-fetch the weights into the cache volume before serving, so a fresh
    # install has working STT on the first utterance with no manual step — the
    # model here is the same `${ENGINE_ASSISTANT_STT_MODEL}` the engine asks
    # for above, so the two never drift. The snapshot is idempotent: on every
    # restart after the first it is a cache hit. This overrides the default
    # CMD's `uvicorn --factory speaches.main:create_app`.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        python3 -c "from huggingface_hub import snapshot_download;
        snapshot_download('${ENGINE_ASSISTANT_STT_MODEL:-Systran/faster-whisper-small}')"
        && exec uvicorn --factory speaches.main:create_app
    volumes:
      - whisper-cache:/home/ubuntu/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── tts: text-to-speech (openedai-speech / Piper voices, CPU) ─────────────
  tts:
    image: "${VOGT_TTS_IMAGE:-ghcr.io/matatonic/openedai-speech:latest}"
    restart: unless-stopped
    volumes:
      # Piper voice files land here on first use; persist them across restarts.
      - tts-voices:/app/voices
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  whisper-cache:
  tts-voices:
