# Put the Rust core in both places the contributor stack runs one.
#
#   docker build -t vogt-core:rust -f deploy/rust-core.Dockerfile .
#   docker compose -f deploy/vogt.compose.yml -f deploy/engine.overlay.yml \
#     -f deploy/rust-core.overlay.yml up --build -d
#
# The `vogt` service is the core the engine fronts. The engine image also
# carries its own core (CORE_IMAGE), and a stack whose two halves are
# different binaries is not the thing under test. The build arg makes the
# engine image lift the same Rust image.

services:
  vogt:
    image: ${VOGT_IMAGE:-vogt-core:rust}
  engine:
    build:
      args:
        CORE_IMAGE: ${VOGT_IMAGE:-vogt-core:rust}
