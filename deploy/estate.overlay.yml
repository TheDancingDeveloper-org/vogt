# The estate deployment, as an overlay on the public base.
#
#   docker compose -f deploy/vogt.compose.yml -f deploy/estate.overlay.yml up -d
#
# This is the reference customisation `docs/CUSTOMISATION.md` points at, and
# the thing that makes its claim checkable: the private deployment is the
# published public image plus configuration, not a second build of the same
# source. Every difference from the generic install is stated here and
# nowhere else.
#
# **Deployed.** `vogt-dev` has run this overlay as two containers since
# 2026-08-20, and `vogt-prod` runs it from the day it is stood up; confirm
# with Komodo `GetStack` rather than with this comment, which said "not yet
# deployed" for a while after it was. `deploy/vogt-stack.compose.yml` is the
# older merged single-container shape and is not what either stack runs.
#
# Two stacks now layer onto it, so a change here reaches production. Every
# instance-scoped value is supplied by the Komodo stack environment, not by
# this file — which is what lets one reviewed source serve both.
#
# The optional third file is `deploy/estate.docker-socket.yml`: listing it
# mounts the host Docker socket into the engine, and omitting it makes
# `docker` inside a session fail closed. Both stacks currently list it.
#
# ## What was proven, and how
#
# Engine and core were run as separate containers on one network, the core
# from the published `ghcr.io/thedancingdeveloper-org/vogt:dev` image:
#
#   * the engine detected a non-loopback `VOGT_CORE_URL` and declined to start
#     a core of its own — "proxying to a core this container does not run",
#     the branch `entrypoint.sh` already carried;
#   * `/readyz` reported `vogt_core ready (schema 3 of 11)` across the network;
#   * an authenticated call through `/api/vogt` failed with exactly the right
#     error — `front-door token "primary" has no paired vogt-core token` —
#     which is the `vogt_core_token` secret below;
#   * with no `VOGT_ENGINE_STATE_DIR` on the core, `backup_agreement`
#     degraded to "not set here", which is the coupling the mounts below fix.
#
# ## The two things a naive split gets wrong
#
# 1. **The core reads the estate, not the engine.** Collection runs in the
#    core, so the workspace has to reach *both* containers.
# 2. **The core reads engine state off the filesystem** for backup and restore
#    (`lifecycle.py`), and in the merged image that worked by accident of
#    co-location. Split them and `backup` does not fail — it writes
#    `engine_state: "not configured"` and silently becomes core-only, which is
#    the failure NFR-I6 exists to prevent. The narrow bind below keeps the
#    path meaning what it means today without handing the core the whole pod
#    home.

services:
  # ── the core: the public image, unmodified ──────────────────────────────
  vogt:
    # No port. In the estate the engine is the only published surface
    # (NFR-D11); the core is reachable on the compose network alone. `!reset`
    # rather than an override because Compose concatenates `ports` across
    # files — an override would publish both.
    ports: !reset []

    environment:
      # It is fronted, so `connect` and `/connection-info` render against the
      # identity the engine states per request rather than this address.
      VOGT_FRONTED: "true"
      VOGT_IMPORT_ROOT: "${VOGT_IMPORT_ROOT:-/home/sprooty/Working/Active}"
      # Read by `backup`/`restore`. Must be the same path the engine writes.
      VOGT_ENGINE_STATE_DIR: /home/sprooty/.local/share/mydevenv2
      # The core reaches the engine here to open a work item's coding session
      # (FR-E1). The engine is the sibling container, on the compose network by
      # service name. Note the /etc/hosts landmine runs *one way only*: the
      # engine breaks its own resolv.conf (it runs Tailscale, hence the `vogt`
      # pin over there), but this core runs the vanilla public image with
      # Docker's embedded resolver intact, so `engine` resolves here without a
      # pin. Do not add one on a false symmetry with the engine's `extra_hosts`.
      # Unset — as it was in every stack until #157 — `session.*` reports "no
      # engine configured" and a work item cannot open a session (FR-E9).
      VOGT_ENGINE_URL: "http://engine:8910"
      # Brokered as a file (FR-S7), carrying only the engine's `sessions`
      # capability. Its value is the `["sessions"]` entry the engine declares in
      # MYDEVENV2_EXTRA_TOKENS_JSON below.
      VOGT_ENGINE_TOKEN_FILE: /run/secrets/vogt_engine_token
      VOGT_GITHUB_TOKEN_FILE: /run/secrets/github_token
      # The other direction of the same pairing, and the reason a first deploy
      # is now a *single* deploy (#199). The engine presents this token on
      # /api/vogt; the core adopts it here at `init` if it does not already
      # hold it. Before this, only a running core could mint it — so the first
      # boot answered 401, somebody exec'd in, minted one, edited the stack
      # environment and deployed again, tearing down every PTY in the pod to
      # do it.
      #
      # The same file the engine reads, mounted into both: one value, declared
      # once, exactly as VOGT_ENGINE_TOKEN already worked. Idempotent — a
      # restart that finds the secret already present writes nothing. Leave
      # VOGT_CORE_TOKEN empty and this is inert, which is the old behaviour.
      VOGT_BOOTSTRAP_CORE_TOKEN_FILE: /run/secrets/vogt_core_token
      # Who the adopted token acts as, and how much it may do. Everything in
      # the pod runs as one uid and can read the file, so this scope *is* the
      # pod's blast radius.
      VOGT_BOOTSTRAP_CORE_TOKEN_ACTOR: "${VOGT_BOOTSTRAP_CORE_TOKEN_ACTOR:-agent:vogt-engine}"
      VOGT_BOOTSTRAP_CORE_TOKEN_SCOPES: "${VOGT_BOOTSTRAP_CORE_TOKEN_SCOPES:-read,work.write,project.write}"

    volumes:
      # The estate. Read-*write*, not read-only: collection only reads, but
      # `VOGT_IMPORT_ROOT` points inside this tree and `project import` clones
      # into it (FR-P6). Mounted `:ro` the core comes up perfectly healthy and
      # import fails at the first clone.
      - "${VOGT_WORKSPACE_DIR:-/mnt/2tnvme/docker/volumes/mydevenv2/workspace}:/home/sprooty/Working"
      # Engine state, narrowly. Read-write because `restore` writes it.
      - "${VOGT_HOME_DIR:-/mnt/2tnvme/docker/volumes/mydevenv2/home}/.local/share/mydevenv2:/home/sprooty/.local/share/mydevenv2"

    secrets:
      - github_token
      - vogt_engine_token
      # Read-only here and adopted at init; the engine *presents* the same
      # value. Both halves knowing one operator-chosen secret is the whole
      # mechanism (#199).
      - vogt_core_token

    # Fixed, because the engine reaches it through an /etc/hosts pin and a
    # pin cannot follow a dynamic address. Inside this stack's own network,
    # so it collides with nothing.
    networks:
      default:
        ipv4_address: "${VOGT_CORE_IP:-10.59.0.10}"

  # ── the engine: the private image, front door, no core inside it ────────
  engine:
    image: "${VOGT_STACK_IMAGE:?pin the vogt-stack digest}"
    container_name: "${VOGT_CONTAINER_NAME:-vogt-engine}"
    hostname: "${VOGT_CONTAINER_NAME:-vogt-engine}"
    restart: unless-stopped
    init: true
    depends_on:
      - vogt

    # The only published surface. Tailnet address only, never 0.0.0.0.
    ports:
      - "${VOGT_BIND_IP:?the address the front door is published on}:${VOGT_PORT:-18097}:8910"

    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

    volumes:
      - "${VOGT_WORKSPACE_DIR:-/mnt/2tnvme/docker/volumes/mydevenv2/workspace}:/home/sprooty/Working"
      - "${VOGT_HOME_DIR:-/mnt/2tnvme/docker/volumes/mydevenv2/home}:/home/sprooty"
      - "${VOGT_TAILSCALE_DIR:-/mnt/2tnvme/docker/volumes/mydevenv2/tailscale}:/var/lib/tailscale"

    # Not optional plumbing — the same landmine the retired ContextKeeper
    # entry existed for. This container runs Tailscale, which overwrites
    # /etc/resolv.conf and breaks Docker's embedded service-name resolution,
    # so `vogt` does not resolve here however correct the compose file looks.
    # `extra_hosts` writes to /etc/hosts, which is consulted *before* DNS, so
    # the pin survives. Verified: with resolv.conf deliberately broken, a
    # pinned name resolves and an unpinned one times out.
    #
    # This is why the core takes a fixed address below rather than whatever
    # the pool hands it.
    extra_hosts:
      - "vogt:${VOGT_CORE_IP:-10.59.0.10}"

    environment:
      # The core lives in the sibling container, not on loopback. This is what
      # tells the engine not to start one.
      VOGT_CORE_URL: "http://vogt:8000"
      VOGT_CORE_TOKEN_FILE: /run/secrets/vogt_core_token

      MYDEVENV2_TOKEN: "${MYDEVENV2_TOKEN:?the front door's primary bearer token}"
      # Scoped front-door tokens, and where the core's session token is
      # declared: one entry with capabilities ["sessions"], whose value the
      # core presents via VOGT_ENGINE_TOKEN_FILE. Without it the core's
      # work-item sessions are refused (#157).
      MYDEVENV2_EXTRA_TOKENS_JSON: "${MYDEVENV2_EXTRA_TOKENS_JSON:-}"
      MYDEVENV2_MUTATING_REQUEST_LIMIT_PER_MINUTE: "${MYDEVENV2_MUTATING_REQUEST_LIMIT_PER_MINUTE:-600}"
      MYDEVENV2_BIND: 0.0.0.0:8910
      MYDEVENV2_SCROLLBACK_BYTES: "${MYDEVENV2_SCROLLBACK_BYTES:-4194304}"
      MYDEVENV2_PUBLIC_URL: "${VOGT_PUBLIC_URL:?the URL clients reach the front door at}"
      # The engine's CORS allow-list. The clean-clone default is local dev only
      # (estate-neutral, so a public build ships no maintainer hostname), so the
      # estate names its own PWA origin here. The old host stays through the
      # transition — an origin removed too early is a CORS failure in a live
      # browser, and the cost of one extra entry is nothing.
      ENGINE_ALLOWED_ORIGINS: "${ENGINE_ALLOWED_ORIGINS:-https://vogt.sprooty.com,https://mydevenv2.sprooty.com}"
      RUST_LOG: "${RUST_LOG:-info}"

      # Agent auth and its optional integrations.
      INFISICAL_API_URL: "${INFISICAL_API_URL:-http://100.92.54.45:8400}"
      INFISICAL_CLIENT_ID: "${HOMELAB_MYDEVENV2_INFISICAL_CLIENT_ID:?required for agent auth}"
      INFISICAL_CLIENT_SECRET: "${HOMELAB_MYDEVENV2_INFISICAL_CLIENT_SECRET:?required for agent auth}"
      MYDEVENV2_AGENT_AUTH_REQUIRED: "1"
      MYDEVENV2_AUTO_AGENT_AUTH: "1"
      MYDEVENV2_VOGT_SECRET_NAME: "${MYDEVENV2_VOGT_SECRET_NAME:-HOMELAB_VOGT_AGENT_TOKEN}"
      # The estate's own secret map for the reference Infisical agent-auth
      # helper. `agent-auth.sh` bakes in none of this now — the manifest is what
      # tells it which Infisical secrets to load, from which project, and under
      # which environment variable. One entry per line: VAR PROJECT_ID
      # SECRET_NAME [optional]. (Project ids: CICD, INFRASTRUCTURE, APPS.)
      ENGINE_AGENT_AUTH_SECRETS: |
        GIT_AUTH_TOKEN 6d6caff5-7aaf-42f8-a135-2455d7629af8 GIT_AUTH_TOKEN
        FORGEJO_TOKEN 6d6caff5-7aaf-42f8-a135-2455d7629af8 FORGEJO_TOKEN
        WOODPECKER_TOKEN 5b7e75de-e874-484d-9595-873acd6bfd07 WOODPECKER_TOKEN
        GITHUB_DANCINGDEVELOPER_PAT 6d6caff5-7aaf-42f8-a135-2455d7629af8 GITHUB_DANCINGDEVELOPER_PAT
        GITHUB_AUSAGENTSMITH_PAT 6d6caff5-7aaf-42f8-a135-2455d7629af8 GITHUB_AUSAGENTSMITH_PAT
        HOMELAB_KOMODO_API_KEY 76b1ebe1-3656-4cef-952c-30d5d489c6e7 HOMELAB_KOMODO_API_KEY
        HOMELAB_KOMODO_API_SECRET 76b1ebe1-3656-4cef-952c-30d5d489c6e7 HOMELAB_KOMODO_API_SECRET
      # The destination-org PAT is also the default `gh`/git identity.
      ENGINE_AGENT_AUTH_GH_TOKEN_FROM: GITHUB_DANCINGDEVELOPER_PAT
      # Where the Vogt and Cadastre token secrets live (the APPS project).
      ENGINE_AGENT_AUTH_TOKEN_PROJECT_ID: 76b1ebe1-3656-4cef-952c-30d5d489c6e7
      # Cadastre is a separate product and an explicit opt-in (NFR-O5). The
      # endpoint and its token secret used to be baked into agent-auth.sh /
      # mcp-bootstrap.sh; they are the estate's values, so they live here now.
      CADASTRE_MCP_ENABLED: "1"
      CADASTRE_MCP_URL: "${CADASTRE_MCP_URL:-https://winrarhost.tailc7d3c.ts.net:18092/mcp}"
      MYDEVENV2_CADASTRE_SECRET_NAME: "${MYDEVENV2_CADASTRE_SECRET_NAME:-HOMELAB_CADASTRE_HTTP_TOKEN}"

      # Tailnet.
      TAILSCALE_AUTH_KEY: "${HOMELAB_MYDEVENV2_TAILSCALE_AUTH_KEY:-}"
      TAILSCALE_HOSTNAME: "${TAILSCALE_HOSTNAME:-vogt}"
      MYDEVENV2_TAILSCALE_ACCEPT_DNS: "${MYDEVENV2_TAILSCALE_ACCEPT_DNS:-1}"
      TAILSCALE_EXIT_NODE: "${MYDEVENV2_TAILSCALE_EXIT_NODE:-}"

      # Optional surfaces, each of which degrades rather than fails.
      MYDEVENV2_FCM_SERVICE_ACCOUNT_JSON: "${MYDEVENV2_FCM_SERVICE_ACCOUNT_JSON:-}"
      MYDEVENV2_ASSISTANT_API_KEY: "${MYDEVENV2_ASSISTANT_API_KEY:-}"
      MYDEVENV2_ASSISTANT_MODEL: "${MYDEVENV2_ASSISTANT_MODEL:-gpt-5.4-mini}"
      # Empty when unset, *not* `${X:?}`. The engine already enforces r20's
      # rule — a key with no stated destination is a startup error — so
      # gating it here as well would fail the deploy of a stack that simply
      # has no assistant key, which is the common case.
      MYDEVENV2_ASSISTANT_BASE_URL: "${MYDEVENV2_ASSISTANT_BASE_URL:-}"
      # Server-side speech (FR-T12), configured independently of the chat
      # profile: an ordered fallback list of OpenAI-compatible audio endpoints
      # (voicemode's VOICEMODE_*_BASE_URLS semantics, local first then cloud).
      # Defaults are voicemode's exact stack; with no key and no local server
      # the routes 404 and clients fall back (FR-T6), which is the honest
      # absence for this estate's OpenRouter chat stack that fronts no audio.
      MYDEVENV2_ASSISTANT_STT_BASE_URLS: "${MYDEVENV2_ASSISTANT_STT_BASE_URLS:-http://127.0.0.1:2022/v1,https://api.openai.com/v1}"
      MYDEVENV2_ASSISTANT_STT_MODEL: "${MYDEVENV2_ASSISTANT_STT_MODEL:-whisper-1}"
      MYDEVENV2_ASSISTANT_STT_API_KEY: "${MYDEVENV2_ASSISTANT_STT_API_KEY:-}"
      MYDEVENV2_ASSISTANT_TTS_BASE_URLS: "${MYDEVENV2_ASSISTANT_TTS_BASE_URLS:-http://127.0.0.1:8880/v1,https://api.openai.com/v1}"
      MYDEVENV2_ASSISTANT_TTS_MODEL: "${MYDEVENV2_ASSISTANT_TTS_MODEL:-tts-1-hd}"
      MYDEVENV2_ASSISTANT_TTS_VOICE: "${MYDEVENV2_ASSISTANT_TTS_VOICE:-nova}"
      MYDEVENV2_ASSISTANT_TTS_API_KEY: "${MYDEVENV2_ASSISTANT_TTS_API_KEY:-}"
      MYDEVENV2_ASSISTANT_SPEECH_TIMEOUT_MS: "${MYDEVENV2_ASSISTANT_SPEECH_TIMEOUT_MS:-30000}"
      START_SWAY: "${START_SWAY:-0}"
      GUI_STREAM_URL: "${GUI_STREAM_URL:-}"
      # Estate default: a shared Redis a public operator cannot reach. Change or
      # unset it — an absent/unreachable sccache costs build speed, nothing else.
      SCCACHE_REDIS: "${SCCACHE_REDIS:-redis://100.92.54.45:6380}"

    secrets:
      - vogt_core_token

    # If this deployment also mounts the host Docker socket, it attaches
    # *here*. The estate's `docker-compose.docker-socket.yml` names the
    # service `vogt`, which in this topology is the **core** — applying it
    # unchanged would hand the host daemon to the core, which has no use for
    # it, and leave the engine (whose sessions run `docker`) without. That
    # file needs its service renamed to `engine` before it is used alongside
    # this overlay.

    # `/readyz` is the aggregate, and it deliberately does not fail on an
    # absent core — restarting the engine would not revive one and would kill
    # every live PTY (FR-E9). Do not "fix" this to gate on the core.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8910/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Declared so the core's address is stable across recreates. This is the
  # subnet Docker had already assigned this stack, so nothing moves.
  default:
    ipam:
      config:
        - subnet: "${VOGT_STACK_SUBNET:-10.59.0.0/16}"

volumes:
  # The base declares `vogt-data`; this estate's core already lives in
  # `vogt-core-data` and has since the stack was created. Map the name rather
  # than migrate the data — without this the core comes up against an empty
  # volume, which is not a failure but a *new instance*: new instance_id, no
  # projects, no audit history, and the real database still sitting in the
  # volume nobody is now reading.
  vogt-data:
    name: "${VOGT_CORE_VOLUME:-vogt-core-data}"

secrets:
  github_token:
    file: ./github-token
  vogt_core_token:
    file: ./vogt-core-token
  # The core's engine token — the mirror of vogt_core_token, the other
  # direction. Legitimately empty until the scoped token is minted.
  vogt_engine_token:
    file: ./vogt-engine-token
