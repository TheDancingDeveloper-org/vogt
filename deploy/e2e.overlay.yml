# The end-to-end stack smoke overlay (#295).
#
# Layers onto the two-container stack (vogt.compose.yml + engine.overlay.yml).
# Designed for CI where the runner's filesystem is NOT the docker daemon's, so
# it uses NO host bind-mounts and NO Compose file-secrets — both fail there
# ("bind source path does not exist"), and this Compose also rejects
# `environment:` secrets ("file is the sole supported option"). Two
# topology-independent mechanisms replace them:
#
#   * The synthetic agent CLI (#296) and the engine.toml preset are BAKED into a
#     dedicated e2e engine image (deploy/e2e.engine.Dockerfile), not mounted.
#   * The run-generated tokens are delivered through a NAMED VOLUME that a
#     one-shot `token-init` service populates from environment variables; the
#     core and engine then read them as ordinary files. A named volume lives on
#     the daemon, so nothing depends on a host path.
#
# The workflow builds vogt-core:local, vogt-engine:local, then
# vogt-engine-e2e:local FROM the latter, and runs `up` WITHOUT `--build`.

services:
  # One-shot: write the run's tokens into the shared named volume, then exit 0.
  # Reuses the already-built core image (it has /bin/sh); no external pull. The
  # core and engine wait for it via `service_completed_successfully`.
  token-init:
    image: ${VOGT_IMAGE:-vogt-core:local}
    # As root: a fresh named volume is root-owned, and the core image runs as a
    # non-root user that otherwise cannot write to /tokens. The files are made
    # world-readable so the (non-root) core and engine can read them back — they
    # are per-run test tokens in a throwaway stack, not production secrets.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 022
        printf '%s' "${VOGT_CORE_TOKEN_VALUE:-}" > /tokens/vogt_core_token
        printf '%s' "${VOGT_FIXTURE_PAT:-}" > /tokens/github_token
        chmod 0644 /tokens/vogt_core_token /tokens/github_token
    environment:
      VOGT_CORE_TOKEN_VALUE: "${VOGT_CORE_TOKEN_VALUE:-}"
      VOGT_FIXTURE_PAT: "${VOGT_FIXTURE_PAT:-}"
    volumes:
      - e2e_tokens:/tokens
    restart: "no"

  # vogt-core: reads its bootstrap + github.com tokens from the shared volume.
  # `secrets: !override []` clears the file-secret the base engine.overlay wires
  # in (it would bind-mount a host path the daemon can't see).
  vogt:
    depends_on:
      token-init:
        condition: service_completed_successfully
    secrets: !override []
    environment:
      # Read from the shared named volume, not /run/secrets. Empty github token
      # ⇒ no github.com provider ⇒ the forge half skips (credential-free run).
      VOGT_BOOTSTRAP_CORE_TOKEN_FILE: /run/e2e-tokens/vogt_core_token
      VOGT_GITHUB_TOKEN_FILE: /run/e2e-tokens/github_token
      # `writeback` is added to the base default because the forge half links a
      # project upstream (forge.link); still no `admin`.
      VOGT_BOOTSTRAP_CORE_TOKEN_SCOPES: "read,work.write,project.write,writeback"
    volumes:
      - e2e_tokens:/run/e2e-tokens:ro

  # the engine: the baked fake-agent + preset, core token from the shared volume.
  engine:
    image: vogt-engine-e2e:local
    depends_on:
      token-init:
        condition: service_completed_successfully
    secrets: !override []
    environment:
      ENGINE_CONFIG: /opt/vogt-e2e/engine.toml
      VOGT_CORE_TOKEN_FILE: /run/e2e-tokens/vogt_core_token
    volumes:
      - e2e_tokens:/run/e2e-tokens:ro

  # Live Playwright (#295, item 3): the SAME web/tests/browser/gui.spec.ts specs
  # against the running stack — real API, no `installFixtures` — so mock/truth
  # drift fails a test. It reaches the engine by service DNS on the compose
  # network (http://engine:8910), because the runner cannot reach the stack over
  # host loopback. Under the `live` profile so `up -d` never starts it; the
  # workflow runs it explicitly with `docker compose run --profile live`. The
  # image (deploy/e2e.playwright.Dockerfile) bakes web/ + browsers in.
  playwright:
    profiles: ["live"]
    image: vogt-e2e-playwright:local
    environment:
      # The front door on the compose network. The `live` project registers
      # only when this is set (web/playwright.config.ts).
      PLAYWRIGHT_LIVE_BASE_URL: "http://engine:8910"
      # The engine bearer, seeded into localStorage to pass the sign-in gate
      # (gui.spec.ts). Supplied by the workflow run step.
      PLAYWRIGHT_LIVE_TOKEN: "${ENGINE_TOKEN:-}"
      CI: "1"
    depends_on:
      - engine
    restart: "no"

volumes:
  e2e_tokens:
