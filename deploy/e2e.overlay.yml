# The end-to-end stack smoke overlay (#295).
#
# Layers onto the two-container stack:
#
#   docker compose \
#     -f deploy/vogt.compose.yml \
#     -f deploy/engine.overlay.yml \
#     -f deploy/e2e.overlay.yml up --build -d
#
# It knows nothing about any estate — it is the generic engine overlay plus the
# one thing the agent-task step of `scripts/e2e_stack_smoke.sh` needs and the
# published image deliberately does not carry: the synthetic agent CLI (#296).
#
# Two read-only mounts and one env var, all test-only:
#
#   * `scripts/` → `/opt/vogt-e2e/scripts` so the engine can spawn
#     `scripts/fake-agent` the way it would a real `claude`/`codex`. It is
#     mounted rather than baked in because it is a test artifact; the engine
#     image keeps it out of `default_templates()` for the same reason.
#   * `deploy/e2e.engine.toml` → `/opt/vogt-e2e/engine.toml`, named by
#     `ENGINE_CONFIG`, which registers that CLI as the `Fake Agent (test)`
#     session preset. Config precedence (CLI > env > file) leaves every other
#     engine setting owned by the environment the base overlay sets.
#
# The forge half of the smoke reads and writes the fixture repository. It does
# so with the FR-S7 *instance file token*, not a per-actor linked PAT: the core
# reads `github.com`'s token from a file (`VOGT_GITHUB_TOKEN_FILE`), so import,
# sweep, link and the upstream work-create all use it with no `forge_account_*`
# key to configure. The token is a Compose secret whose file the CI job writes
# from the `VOGT_FIXTURE_PAT` secret before `up`; left empty, the core simply
# has no github.com provider and the smoke skips its forge steps (which it
# already does whenever `VOGT_FIXTURE_PAT` is unset).
#
# Nothing here publishes a port, mounts an estate, or names a host: the smoke
# runs entirely against the front door the base overlay already exposes.

services:
  # ── vogt-core: given the fixture token as its github.com file token ───────
  vogt:
    environment:
      # The general FR-S7 file token for github.com. Read from a file so it
      # never appears in `docker inspect`. Empty file ⇒ no provider ⇒ the
      # forge steps skip, matching the credential-free half.
      VOGT_GITHUB_TOKEN_FILE: /run/secrets/github_token
      # The bootstrap-adopted core token acts with these scopes, so it is the
      # smoke's blast radius. `writeback` is added to the base overlay's default
      # because the forge half links a project upstream (`forge.link`, scope
      # `writeback`); without it the core refuses that step. Still no `admin`.
      VOGT_BOOTSTRAP_CORE_TOKEN_SCOPES: "read,work.write,project.write,writeback"
    secrets:
      - github_token

  # ── the engine: the fake-agent preset and its script ─────────────────────
  engine:
    environment:
      ENGINE_CONFIG: /opt/vogt-e2e/engine.toml
    volumes:
      # Read-only: the smoke never writes through these, and the fake-agent
      # writes only inside the run's working tree, never back into the repo.
      - ../scripts:/opt/vogt-e2e/scripts:ro
      - ./e2e.engine.toml:/opt/vogt-e2e/engine.toml:ro

secrets:
  # Injected from the ENVIRONMENT, not a host file: in CI the runner's
  # filesystem is not the docker daemon's, so a bind-mounted file secret's
  # source path does not exist for the daemon. `environment:` makes Compose read
  # the value from the named env var and mount it at /run/secrets/<name> with no
  # host path — topology-independent.
  #
  # github_token: empty VOGT_FIXTURE_PAT ⇒ no github.com provider ⇒ the forge
  # half skips (the credential-free posture). vogt_core_token overrides the
  # file-based definition in engine.overlay.yml for the same reason.
  github_token:
    environment: VOGT_FIXTURE_PAT
  vogt_core_token: !override
    environment: VOGT_CORE_TOKEN_VALUE
