# Host Docker socket access for the merged stack — an opt-in overlay.
#
# Add this file to the Komodo stack's `file_paths` alongside
# `vogt-stack.compose.yml` when sessions in the pod need DooD semantics
# (`docker`, `docker compose`, testcontainers). Kept out of the base stack on
# purpose: Docker access is a trust decision, and a decision made by adding a
# file is one somebody had to make.
#
# It carries over from `engine/deploy/docker-compose.docker-socket.yml`, which
# no longer applies: that file patches a service called `mydevenv2`, and the
# merged stack's service is `vogt`. Layering the old one over this stack fails
# loudly rather than silently — Compose treats the unmatched key as a *new*
# service and refuses it for having neither an image nor a build context —
# which is the good outcome, and the reason this file exists rather than a
# note asking someone to remember.

services:
  vogt:
    # The host's docker.sock is owned by a host-specific group. Add that gid so
    # `docker` works in an ordinary session without sudo; override if the host
    # changes.
    group_add:
      - "${DOCKER_SOCKET_GID:-984}"

    volumes:
      # DooD: containers launched from inside the pod hit the host daemon.
      # SECURITY: any shell or workflow with Docker access effectively has
      # host-level container control — including over this stack. Use only on
      # trusted personal deployments.
      - /var/run/docker.sock:/var/run/docker.sock
