# What two independent runs of the same script may differ on, and why.
# Applied to answers, audit trails and OpenAPI. MCP tools/list is not covered
# here: the parity script records no tools/list step, so a rule for it would
# normalise nothing. The tool list's inputSchema comes from the registry dump,
# which is compared against Python with no normaliser at all.

[volatile]
# A fresh instance mints nothing the hooks do not fix. Ids, timestamps and
# digests are deterministic, so a difference between two runs is a real
# divergence and must fail the check. What stays blanked is evidence the
# collectors observed, which names the machine the sweep ran on.
#
# Compared verbatim, and why each is safe to compare:
#   content_digest, payload_digest — pure functions of their input.
#   last_used_at, expires_at — written by the clock, which the step clock fixes.
#   instance_id — minted by the id factory, which sequential ids fixes.
#   path — tokenised to <root>/<data> by the path rule below, so the remainder
#     is comparable.
#   observed_at, last_swept_at, oldest_relevant_sweep, age_seconds — all read
#     from ctx.clock, which the step clock fixes.
#
# The HTTP run dumps the declared store. The background sweeps write
# `sweep.completed` rows into its `events` table, and `events.seq` is
# AUTOINCREMENT, so a sweep between two declared writes shifts every later seq
# (WI-1152). The dump query excludes those rows, which leaves the sequences the
# script itself produced. The rest of the declared tables — audit,
# auth_decisions, tokens, events, actors, labels — are fixed by the hooks and
# compare verbatim. The observed store is not dumped: it holds the sweeps
# themselves, which drift the same way.
why = "collector evidence names the machine; everything the hooks make deterministic compares verbatim"
keys = [
  "collectors", "suppression", "evidence_snapshot", "evidence_observation_id",
  "secret", "token_hash", "data_dir",
]

[paths]
# Absolute paths name the temporary root of that run.
why = "each run writes under its own temporary root"
tokens = [{ needle_kind = "root", token = "<root>" }, { needle_kind = "data", token = "<data>" }]

[version]
# The product version is stamped at build time, and only the answers that
# report the build itself carry it. The rule substitutes <version> only when
# the value is the release in pyproject.toml, which is what both sides report:
# Python reads vogt.__version__ and the Rust core falls back to the same pinned
# release. Anything else, including the old "local/dev" dev-build stamp, is left
# as it is, so a build that fell back to it stays visible and fails the
# comparison. The rule names the operations it applies to and only their
# their top-level `version`, so a key named `version` elsewhere is untouched.
why = "the build stamp names the build, not the behaviour, and only the version under test is substituted"
operations = ["http.health.live", "http.version", "http.connection_info"]
key = "version"

[schema]
# pydantic emits a `title` per model and orders `anyOf` by declaration. Those
# are properties of a schema document, not of an answer: dropping `title` from
# an answer deletes every work-item title. Apply both rules only inside a
# schema object, which is one that carries a `$schema` or `properties` key.
why = "pydantic titles and anyOf order are generator accidents, not contract"
drop_keys = ["title"]
sort_any_of = true
schema_markers = ["$schema", "properties"]
