# What two independent runs of the same script may differ on, and why.
# Applied to answers, audit trails, OpenAPI and MCP tools/list.

[volatile]
# A fresh instance mints timestamps and the ids of things the script did not
# name. The hooks make both deterministic, so an id or a timestamp that
# *differs* between two runs is a real divergence and must fail the check.
# What stays blanked is evidence the collectors observed, which names the
# machine the sweep ran on.
why = "collector evidence names the machine; ids and timestamps are deterministic under the hooks and must compare verbatim"
keys = [
  "content_digest", "observed_at", "last_swept_at", "age_seconds",
  "oldest_relevant_sweep", "collectors", "suppression", "evidence_snapshot",
  "evidence_observation_id", "path", "secret", "last_used_at", "expires_at",
  "instance_id", "payload_digest", "data_dir",
]

[paths]
# Absolute paths name the temporary root of that run.
why = "each run writes under its own temporary root"
tokens = [{ needle_kind = "root", token = "<root>" }, { needle_kind = "data", token = "<data>" }]

[schema]
# pydantic emits a `title` per model and orders `anyOf` by declaration. Those
# are properties of a schema document, not of an answer: dropping `title` from
# an answer deletes every work-item title. Apply both rules only inside a
# schema object, which is one that carries a `$schema` or `properties` key.
why = "pydantic titles and anyOf order are generator accidents, not contract"
drop_keys = ["title"]
sort_any_of = true
schema_markers = ["$schema", "properties"]
