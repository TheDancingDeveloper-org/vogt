# Read-only MCP tools the suite calls with the smallest plausible arguments.
#
# A 4xx (or a typed `isError` refusal) is an acceptable answer here: the check
# is that the surface does not 5xx or crash on ordinary use, not that this
# instance has data. A 5xx, a transport failure or an HTML body is a failure.
#
# `requirement` is the matrix row the call is evidence for.

[[call]]
tool = "project_list"
args = {}
requirement = "T1"

