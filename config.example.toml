# Generated by scripts/gen_config_docs.py from src/vogt/config.py.
# Do not edit by hand; CI fails on drift (NFR-Q4).
#
# Every setting is commented out and shows its default. Point Vogt at
# a copy of this file with VOGT_CONFIG_FILE=/path/to/vogt.toml.

# Directory holding declared.sqlite3, observed.sqlite3 and backups. One instance per directory.
# default policy: allocation
# data_dir = "/var/lib/vogt"

# Directory imported repositories are cloned into, one per project slug (FR-P6). An allocation value, so it has a default rather than a gate: unset means `<data_dir>/repos`, which keeps the clone with the instance that registered it. Deployments that observe an estate on a mounted host directory point this at that estate instead, so an imported project lands where the rest of the work already lives.
# default policy: allocation
# import_root = "/var/lib/vogt/repos"

# The URL clients reach this instance at, e.g. `https://vogt.example.com`. An exposure value, so it has no default and is never guessed: the process binds `0.0.0.0:8000` inside a container and is published somewhere else entirely, so the server cannot know its own address — only the operator does. Unset means `connect` reports that nobody has said, which is a different answer from reporting a URL that does not work (FR-A8).
# default policy: exposure
# public_url = "https://host.tailnet.ts.net:18094"

# Whether this instance runs behind an optional front door that publishes it at a different address and mount points. When true, `connect` and `/connection-info` render against the identity the door states per request (`X-Vogt-Public-Url`, `X-Vogt-Api-Path`, `X-Vogt-Mcp-Path`), because the door is the only thing that knows where clients arrive (FR-A8, FR-A9). Off by default and never inferred: an instance that has not been told it is fronted ignores those headers entirely, so nobody who can reach it can make `connect` render a client configuration — a document meant to be pasted next to a token — against an address they chose.
# default policy: behaviour
# fronted = false

# Verbosity of Vogt's own diagnostics — the `vogt.*` logger namespace, not its dependencies'.
# default policy: behaviour
# log_level = "info"

# How each line is rendered. `text` is for a person reading `docker logs`; `json` is one object per line for a log that is queried rather than read (Loki). The fields are the same either way, so a query written against one describes the other.
# default policy: behaviour
# log_format = "text"

# Whether every served request produces an access line carrying its duration (NFR-OB1). On by default: the 2026-08-19 incident was diagnosed by counting paths across three thousand stock uvicorn lines that had no timing on them at all, and a single slow endpoint would have left no trace. Turning this off still leaves correlation ids honoured and echoed (NFR-OB3).
# default policy: behaviour
# log_requests = true

# A request whose response takes longer than this to *start* is logged at WARNING rather than INFO (NFR-OB2). Judged on time to first byte, so a long-lived `/mcp` stream is not reported as a pathological request every time it ends.
# default policy: behaviour
# log_slow_request_ms = 1000

# Paths whose access lines drop to DEBUG (NFR-OB4). Probes, by default: an orchestrator calls them every few seconds forever, and a log that is 100% `/healthz` with no application output in it is not a log. Suppressed and not dropped — a probe that crosses `log_slow_request_ms` still warns, which is exactly what `/health/ready` did for 25 seconds on 2026-08-19.
# default policy: behaviour
# log_quiet_paths = ["/health/live", "/health/ready", "/version"]

# Files a compliant project must contain (FR-G1). The contract is a value you read, never a barrier you pass: changing this changes what `contract check` reports and gates nothing (FR-G13).
# default policy: behaviour
# contract_required_files = ["AGENTS.md", "README.md", "LICENSE"]

# Directories a compliant project must contain (FR-G1).
# default policy: behaviour
# contract_required_dirs = ["docs", "design", "src"]

# Metadata keys a compliant project must declare (FR-G1). Read from the project's own manifest, not from Vogt's registration.
# default policy: behaviour
# contract_required_meta = ["name", "lifecycle_state", "owner"]

# Names which contract a recorded compliance status was evaluated against (FR-G1, FR-G3). If the rules above differ from the built-in defaults and this is left at its own default, Vogt appends a short digest of the rules — a status must never claim to be the stock `v1` when it is not, and an operator who edits the rules should not have to remember to rename them.
# default policy: behaviour
# contract_version = "v1"

# Source markers containing one of these enter backlog and bug views (FR-W11). Every other marker is still observed, still queryable and still counted; it just does not claim to be work. Widening this is how you drown the ranked view.
# default policy: behaviour
# marker_promotion_patterns = ["TODO(vogt)", "FIXME(vogt)"]

# File types the marker collector reads. Configuration rather than a hard-coded list, because which extensions hold source is an estate's business, not Vogt's (FR-W11).
# default policy: behaviour
# marker_file_extensions = [".py", ".rs", ".ts", ".tsx", ".js", ".jsx", ".go", ".java", ".rb", ".sh", ".sql", ".toml", ".yaml", ".yml", ".md"]

# How long observation *history* is kept (NFR-I5). The newest observation per subject is kept indefinitely regardless, and so is anything a drift proposal references.
# default policy: behaviour
# retention_days = 180

# Path to a file containing a GitHub token. Its absence is what switches the optional forge adapter off, so there is no default: not configured is the ordinary case, and it means forge subjects are 'not collected' rather than absent. A file rather than an environment variable or an argument, so the token never appears in a process listing (FR-S7).
# default policy: behaviour
# github_token_file = null

# Path to a file holding a urlsafe-base64 Fernet key, used to encrypt per-actor forge Personal Access Tokens at rest (issue #179). A linked PAT must be *recoverable* to call the upstream API on the actor's behalf, which is the deliberate opposite of the vogt-issued tokens in `0005_tokens` — those store only a hash because they never need recovery. Its absence is what switches account linking off: with no key there is nowhere safe to keep a token, so the feature is disabled rather than insecure, and the file-token fallback (`github_token_file`) keeps working for sweeps and unlinked actors. A file rather than an environment variable, so the key never appears in a process listing (FR-S7).
# default policy: behaviour
# forge_account_key_file = null

# Per-host forge token files (D8), mapping a forge host to a file holding a token for it — a TOML table `[forge_token_files]` with, e.g., `"github.com" = "/run/secrets/github_token"`. This is the general form of `github_token_file`, which stays as the alias for github.com; a host set here wins over the alias. A host absent from this map has no provider registered, which is what keeps its subjects 'not collected' rather than reported as absent — the same honesty rule the single-token field has always followed. Files rather than environment variables or arguments, so a token never appears in a process listing (FR-S7).
# default policy: behaviour
# forge_token_files = { "github.com" = "/run/secrets/github_token" }

# Where the session engine listens, e.g. `http://127.0.0.1:8910`. The engine is the other half of the merged product: it owns the PTYs a work item's session runs in (FR-E1). Unset means the `session.*` operations report that no engine is configured — absence of the engine costs sessions and nothing else, which is FR-E9 read from this side. An exposure value, so it is never guessed: co-located today, its address is still the operator's to state.
# default policy: exposure
# engine_url = null

# The project slug a session with no work item and no project resolves to (FR-T11). It exists for the spoken request that has no subject — 'research the best risotto in Wollongong' — which still needs a registered working tree to open in. Unset means such a request is refused by name rather than opened somewhere guessed, which is FR-E3's whole point: the working directory comes from the registry, and a scratch project is a registered project like any other.
# default policy: behaviour
# session_scratch_project = null

# The session engine's state directory, when this process can read it — the merged deployment runs both halves in one container, so it usually can. `backup` copies it and `restore` puts it back, because half a restore is the failure NFR-I6 exists to prevent: the work items come back and the terminals' history, push subscriptions and agent tasks do not. Its absence is what makes a backup a core-only backup, so there is no default — the same reason `github_token_file` has none. Unset, the manifest says 'not configured' rather than quietly covering less than it appears to.
# default policy: behaviour
# engine_state_dir = null

# Path to a file containing the engine token Vogt calls it with. The token needs only the engine's `sessions` capability: Vogt starts and stops terminals, and has no business writing that pod's files. A file rather than an environment variable, for the same reason as `github_token_file` — a token in the environment is a token in every `docker inspect` (FR-S7).
# default policy: behaviour
# engine_token_file = null

# How hard SQLite works to survive a power cut. `normal` is the standard pairing for WAL and the default here; `full` fsyncs the write-ahead log on every commit, which on a contended disk costs tens of milliseconds per write. Under `normal` a power loss or OS crash can lose the last few committed transactions — the database is never corrupted, and an application crash loses nothing. Set `full` if you would rather pay that cost per write.
# default policy: behaviour
# sqlite_synchronous = "normal"

# How often `serve` runs collectors in the background (FR-L3). Zero disables the schedule, leaving sweeps on-demand only. A default rather than a required value because an instance that never looks is the failure this product exists to prevent: stale evidence and no evidence are indistinguishable from the outside, so the safe default is to keep looking.
# default policy: behaviour
# sweep_interval_seconds = 900

# How recently a subject must have been observed for a linked declared entity to count as `verified` rather than `stale` (FR-R4). Trust is computed from this, never hand-set.
# default policy: behaviour
# verify_horizon_hours = 24
