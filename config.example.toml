# Generated by scripts/gen_config_docs.py from src/vogt/config.py.
# Do not edit by hand; CI fails on drift (NFR-Q4).
#
# Every setting is commented out and shows its default. Point Vogt at
# a copy of this file with VOGT_CONFIG_FILE=/path/to/vogt.toml.

# Directory holding declared.sqlite3, observed.sqlite3 and backups. One instance per directory.
# default policy: allocation
# data_dir = "/var/lib/vogt"

# Directory imported repositories are cloned into, one per project slug (FR-P6). An allocation value, so it has a default rather than a gate: unset means `<data_dir>/repos`, which keeps the clone with the instance that registered it. Deployments that observe an estate on a mounted host directory point this at that estate instead, so an imported project lands where the rest of the work already lives.
# default policy: allocation
# import_root = "/var/lib/vogt/repos"

# The URL clients reach this instance at, e.g. `https://host.tailnet.ts.net:18094`. An exposure value, so it has no default and is never guessed: the process binds `0.0.0.0:8000` inside a container and is published somewhere else entirely, so the server cannot know its own address — only the operator does. Unset means `connect` reports that nobody has said, which is a different answer from reporting a URL that does not work (FR-A8).
# default policy: exposure
# public_url = "https://host.tailnet.ts.net:18094"

# Verbosity of Vogt's own diagnostics.
# default policy: behaviour
# log_level = "info"

# Source markers containing one of these enter backlog and bug views (FR-W11). Every other marker is still observed, still queryable and still counted; it just does not claim to be work. Widening this is how you drown the ranked view.
# default policy: behaviour
# marker_promotion_patterns = ["TODO(vogt)", "FIXME(vogt)"]

# File types the marker collector reads. Configuration rather than a hard-coded list, because which extensions hold source is an estate's business, not Vogt's (FR-W11).
# default policy: behaviour
# marker_file_extensions = [".py", ".rs", ".ts", ".tsx", ".js", ".jsx", ".go", ".java", ".rb", ".sh", ".sql", ".toml", ".yaml", ".yml", ".md"]

# How long observation *history* is kept (NFR-I5). The newest observation per subject is kept indefinitely regardless, and so is anything a drift proposal references.
# default policy: behaviour
# retention_days = 180

# Path to a file containing a GitHub token. Its absence is what switches the optional forge adapter off, so there is no default: not configured is the ordinary case, and it means forge subjects are 'not collected' rather than absent. A file rather than an environment variable or an argument, so the token never appears in a process listing (FR-S7).
# default policy: behaviour
# github_token_file = null

# How hard SQLite works to survive a power cut. `normal` is the standard pairing for WAL and the default here; `full` fsyncs the write-ahead log on every commit, which on a contended disk costs tens of milliseconds per write. Under `normal` a power loss or OS crash can lose the last few committed transactions — the database is never corrupted, and an application crash loses nothing. Set `full` if you would rather pay that cost per write.
# default policy: behaviour
# sqlite_synchronous = "normal"

# How often `serve` runs collectors in the background (FR-L3). Zero disables the schedule, leaving sweeps on-demand only. A default rather than a required value because an instance that never looks is the failure this product exists to prevent: stale evidence and no evidence are indistinguishable from the outside, so the safe default is to keep looking.
# default policy: behaviour
# sweep_interval_seconds = 900

# How recently a subject must have been observed for a linked declared entity to count as `verified` rather than `stale` (FR-R4). Trust is computed from this, never hand-set.
# default policy: behaviour
# verify_horizon_hours = 24
