name: android-instrumentation

# Voice foreground-service lifecycle instrumentation on an emulator (#626):
# service start/stop, the notification "End conversation" action signalling the
# PWA, a mic-less start degrading without a crash, and background/foreground
# survival — `VoiceServiceLifecycleTest`, run via connectedDebugAndroidTest.
#
# Manual (workflow_dispatch) only, deliberately. reactivecircus/android-emulator-runner
# boots a KVM emulator, so the self-hosted runner must expose /dev/kvm. The
# estate has an Android-emulator runner (Node B) but it is registered to another
# repository; once a KVM-capable runner is registered to THIS repo, add
# `push`/`pull_request` triggers path-filtered to `mobile/**` to make this a
# per-change gate. Until then it stays off the required `ci` set (it would hang
# a runner that has no emulator) and is validated by an operator run — the same
# four tests pass against the estate emulator (API 34, x86_64).
#
# NFR-C4: the job names a self-hosted runner and every action is pinned to a
# full commit SHA (the runner-policy gate checks both).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumentation:
    name: android voice-lifecycle instrumentation
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: install the shell's dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      # `cap sync` regenerates the uncommitted capacitor.settings.gradle (#623)
      # so Gradle can configure the plugin projects; VOGT_ANDROID_SERVER_URL has
      # no default (FR-M1), so it is named here as the assemble job does.
      - name: capacitor sync
        working-directory: mobile
        env:
          VOGT_ANDROID_SERVER_URL: ${{ vars.VOGT_ANDROID_SERVER_URL || 'http://127.0.0.1:8910' }}
          MYDEVENV2_ANDROID_APP_ID: "com.thedancingdeveloper.vogt.dev"
        run: npx cap sync android

      - name: connected instrumentation on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          MYDEVENV2_ANDROID_APP_ID: "com.thedancingdeveloper.vogt.dev"
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./gradlew -p mobile/android :app:connectedDebugAndroidTest --no-daemon
