name: promote

# Promotion is a verified fast-forward push, not a pull request. GitHub has
# no fast-forward merge method: every PR merge — rebase merge included —
# rewrites the promoted commits' SHAs, so a PR-based promotion makes the
# source branch a non-ancestor of the target the moment it lands, and the
# next stage's ancestry gate fails. That deadlock recurred on every release
# and was repaired by hand three times before promotion pushed directly.
#
# main and prod are governed by the `release-branch-promotion` ruleset:
# deletions and force pushes are blocked outright, and any update must
# carry green `ci` and `runner-policy` checks on the pushed commit. A
# fast-forward promotion pushes the exact SHA the source branch already
# validated, so this workflow's token passes on the commit's own merits —
# no bypass, no extra credential. A push of anything unvalidated is
# rejected (a fresh commit has no checks), and the push below carries no
# force flag, so even if every gate above regressed the server still
# rejects anything that is not a fast-forward.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Promotion stage to run
        required: true
        type: choice
        options:
          - dev-to-main
          - main-to-prod
      confirm:
        description: Type PROMOTE to fast-forward the target branch
        required: true
        type: string

permissions:
  contents: write
  checks: read
  actions: write

jobs:
  promote:
    name: fast-forward the ${{ inputs.stage }} promotion
    runs-on: [self-hosted]
    # These named environments are hooks for installations that can configure
    # environment reviewers. The repository's ruleset and this workflow's
    # gates remain the enforcement point on GitHub's current plan.
    environment: ${{ inputs.stage == 'dev-to-main' && 'promote-main' || 'promote-prod' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: validate the source and target
        id: refs
        env:
          STAGE: ${{ inputs.stage }}
          CONFIRM: ${{ inputs.confirm }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = PROMOTE ] || {
            echo "::error::Type PROMOTE to run a promotion."
            exit 1
          }

          case "$STAGE" in
            dev-to-main) SOURCE=dev; TARGET=main ;;
            main-to-prod) SOURCE=main; TARGET=prod ;;
            *) echo "::error::Unsupported promotion stage: $STAGE"; exit 1 ;;
          esac

          git fetch --no-tags origin "+refs/heads/$SOURCE:refs/remotes/origin/$SOURCE" \
            "+refs/heads/$TARGET:refs/remotes/origin/$TARGET"
          source_sha="$(git rev-parse "origin/$SOURCE")"
          target_sha="$(git rev-parse "origin/$TARGET")"

          if [ "$source_sha" = "$target_sha" ]; then
            echo "::error::$SOURCE and $TARGET already point at $source_sha; there is nothing to promote."
            exit 1
          fi
          git merge-base --is-ancestor "$target_sha" "$source_sha" || {
            echo "::error::$TARGET is not an ancestor of $SOURCE; promotion must be fast-forwardable."
            exit 1
          }

          # The self-hosted runner has curl and jq but not the gh CLI
          # (issue #460), so promotion queries the GitHub REST API directly.
          api() {
            curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          # A green source branch is the promotion gate: a fast-forward
          # promotes the exact commit the source branch validated, so the
          # checks below are the checks the target inherits. Select the
          # newest completed run for each check so an old green run cannot
          # satisfy this gate. Documentation-only commits intentionally have
          # no image build; a release tag builds the deployable artifact
          # later.
          for check in ci runner-policy; do
            conclusion="$(api \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$source_sha/check-runs?per_page=100" \
              | jq -r "[.check_runs[] | select(.name == \"$check\" and .status == \"completed\")] | sort_by(.completed_at) | last | .conclusion")"
            [ "$conclusion" = success ] || {
              echo "::error::$SOURCE@$source_sha does not have a successful $check check (got ${conclusion:-missing})."
              exit 1
            }
          done

          if [ "$SOURCE" = dev ]; then
            receipt_name="vogt-dev-deployment-receipt-${source_sha}"
            receipt_run="$(api \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-dev.yml/runs?per_page=50" \
              | jq -r ".workflow_runs[] | select(.head_sha == \"$source_sha\" and .status == \"completed\" and .conclusion == \"success\") | .id" | head -n 1)"
            [ -n "$receipt_run" ] || {
              echo "::error::dev@$source_sha has no successful verified dev deployment receipt ($receipt_name)."
              exit 1
            }
            artifact_id="$(api \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$receipt_run/artifacts" \
              | jq -r ".artifacts[] | select(.name == \"$receipt_name\") | .id" | head -n 1)"
            [ -n "$artifact_id" ] || {
              echo "::error::successful dev deployment has no matching receipt artifact."
              exit 1
            }
            echo "verified_dev_receipt_run=$receipt_run" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "source=$SOURCE"
            echo "target=$TARGET"
            echo "source_sha=$source_sha"
            echo "target_sha=$target_sha"
          } >> "$GITHUB_OUTPUT"

      - name: fast-forward the target branch
        env:
          SOURCE: ${{ steps.refs.outputs.source }}
          TARGET: ${{ steps.refs.outputs.target }}
          SOURCE_SHA: ${{ steps.refs.outputs.source_sha }}
          TARGET_SHA: ${{ steps.refs.outputs.target_sha }}
        run: |
          set -euo pipefail
          git push origin "$SOURCE_SHA:refs/heads/$TARGET"
          {
            echo "## Promotion: $SOURCE → $TARGET"
            echo
            echo "- promoted: \`$SOURCE_SHA\`"
            echo "- target before promotion: \`$TARGET_SHA\`"
            echo "- verified dev deployment receipt run: \`${{ steps.refs.outputs.verified_dev_receipt_run || 'not applicable' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: run the target ref's pipelines
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.refs.outputs.target }}
        run: |
          set -euo pipefail
          # A push made with the workflow token does not fire push-triggered
          # workflows. The promoted commit's `ci` and `runner-policy` checks
          # already exist — the fast-forward moved the ref to the exact SHA
          # the source branch validated — but two pipelines are ref-bound
          # rather than commit-bound and are dispatched explicitly:
          # `build.yml` publishes the branch-scoped sha image tags for both
          # release branches, and `ci.yml` on prod builds the production
          # Android APK, which may only come from a prod-ref run. REST, not
          # gh — the runner has no gh CLI (issue #460).
          api() {
            curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }
          printf '{"ref":"%s"}' "$TARGET" | api -X POST \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/dispatches" \
            --data @-
          if [ "$TARGET" = prod ]; then
            printf '{"ref":"%s"}' "$TARGET" | api -X POST \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
              --data @-
          fi
