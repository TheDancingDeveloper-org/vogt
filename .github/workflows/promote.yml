name: promote

# Promotion is a pull-request operation, not a branch push. The workflow
# opens the only two promotion PRs the branch model permits; branch protection
# then runs the target branch's checks and records the human merge. Keeping the
# write here to PR creation means a bad dispatch cannot rewrite main or prod.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Promotion stage to open
        required: true
        type: choice
        options:
          - dev-to-main
          - main-to-prod
      confirm:
        description: Type PROMOTE to open the promotion pull request
        required: true
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: write

jobs:
  promote:
    name: open the ${{ inputs.stage }} promotion PR
    runs-on: [self-hosted]
    # These named environments are hooks for installations that can configure
    # environment reviewers. The repository's branch-protection review and
    # required checks remain the enforcement point on GitHub's current plan.
    environment: ${{ inputs.stage == 'dev-to-main' && 'promote-main' || 'promote-prod' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: validate the source and target
        id: refs
        env:
          STAGE: ${{ inputs.stage }}
          CONFIRM: ${{ inputs.confirm }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = PROMOTE ] || {
            echo "::error::Type PROMOTE to open a promotion pull request."
            exit 1
          }

          case "$STAGE" in
            dev-to-main) SOURCE=dev; TARGET=main ;;
            main-to-prod) SOURCE=main; TARGET=prod ;;
            *) echo "::error::Unsupported promotion stage: $STAGE"; exit 1 ;;
          esac

          git fetch --no-tags origin "+refs/heads/$SOURCE:refs/remotes/origin/$SOURCE" \
            "+refs/heads/$TARGET:refs/remotes/origin/$TARGET"
          source_sha="$(git rev-parse "origin/$SOURCE")"
          target_sha="$(git rev-parse "origin/$TARGET")"

          if [ "$source_sha" = "$target_sha" ]; then
            echo "::error::$SOURCE and $TARGET already point at $source_sha; there is nothing to promote."
            exit 1
          fi
          git merge-base --is-ancestor "$target_sha" "$source_sha" || {
            echo "::error::$TARGET is not an ancestor of $SOURCE; promotion must be fast-forwardable."
            exit 1
          }

          # A green source branch is a prerequisite, not a substitute for the
          # target PR checks. Select the newest completed run for each check so
          # an old green run cannot satisfy this gate. Documentation-only
          # commits intentionally have no image build; a release tag builds
          # the deployable artifact later.
          for check in ci runner-policy; do
            conclusion="$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$source_sha/check-runs" \
              --jq "[.check_runs[] | select(.name == \"$check\" and .status == \"completed\")] | sort_by(.completed_at) | last | .conclusion")"
            [ "$conclusion" = success ] || {
              echo "::error::$SOURCE@$source_sha does not have a successful $check check (got ${conclusion:-missing})."
              exit 1
            }
          done

          if [ "$SOURCE" = dev ]; then
            receipt_name="vogt-dev-deployment-receipt-${source_sha}"
            receipt_run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-dev.yml --json databaseId,headSha,status,conclusion --limit 50 \
              --jq ".[] | select(.headSha == \"$source_sha\" and .status == \"completed\" and .conclusion == \"success\") | .databaseId" | head -n 1)"
            [ -n "$receipt_run" ] || {
              echo "::error::dev@$source_sha has no successful verified dev deployment receipt ($receipt_name)."
              exit 1
            }
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$receipt_run/artifacts" --jq ".artifacts[] | select(.name == \"$receipt_name\") | .id" | head -n 1)"
            [ -n "$artifact_id" ] || {
              echo "::error::successful dev deployment has no matching receipt artifact."
              exit 1
            }
            echo "verified_dev_receipt_run=$receipt_run" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "source=$SOURCE"
            echo "target=$TARGET"
            echo "source_sha=$source_sha"
            echo "target_sha=$target_sha"
          } >> "$GITHUB_OUTPUT"

      - name: create or report the promotion pull request
        env:
          # A PR created with GITHUB_TOKEN does not trigger a second workflow
          # run. Use a narrowly scoped fine-grained token owned by the release
          # operator so the generated PR receives its normal checks.
          GH_TOKEN: ${{ secrets.VOGT_PROMOTION_TOKEN }}
          SOURCE: ${{ steps.refs.outputs.source }}
          TARGET: ${{ steps.refs.outputs.target }}
          SOURCE_SHA: ${{ steps.refs.outputs.source_sha }}
          TARGET_SHA: ${{ steps.refs.outputs.target_sha }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Configure VOGT_PROMOTION_TOKEN with pull-request write access}"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head "$SOURCE" --base "$TARGET" --state open \
            --json number,url --jq '.[0] // empty')"
          if [ -n "$existing" ]; then
            echo "An open promotion PR already exists: $existing"
            exit 0
          fi

          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          cat > "$body" <<EOF
          ## Promotion: $SOURCE → $TARGET

          This PR was opened by the **promote** workflow after its approval gate.

          - source: `$SOURCE@$SOURCE_SHA`
          - target before promotion: `$TARGET@$TARGET_SHA`
          - ancestry: fast-forward only
          - required source checks: `ci`, `runner-policy`
          - verified dev deployment receipt: `${{ steps.refs.outputs.verified_dev_receipt_run || 'not applicable' }}`

          Merge only after the target branch checks and normal review policy
          pass. The subsequent stage must be dispatched separately; no workflow
          in this repository pushes a protected branch or deploys production as
          a side effect of this PR.
          EOF
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$SOURCE" --base "$TARGET" \
            --title "Promote $SOURCE → $TARGET (${SOURCE_SHA:0:7})" \
            --body-file "$body"
