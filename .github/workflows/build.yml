name: build

# A *build*, which is not a release.
#
# `release.yml` owns releases: a `v*` tag, a semver-tagged image, `latest`, a
# wheel, an SBOM. This owns the other thing — an image for a commit on main,
# identified only by its sha, so deploying a fix does not require inventing a
# version number for it.
#
# NFR-C3 originally said a push to main shall never publish an image, and the
# effect was that every fix needed a version bump to become deployable: three
# of them in one afternoon, none marking a release. The requirement was
# revised (see `REQUIREMENTS.md`) once the two acts were told apart. What it
# was protecting is intact:
#
#   * merging still cannot cut a release — no semver tag, no `latest`, no
#     wheel, and nothing here writes a GitHub Release
#   * merging still cannot deploy anything (NFR-D10) — production moves when
#     the digest pinned in `indexarr/ops` changes and `DeployStack` runs
#
# Images are signed here as they are in a release. A build that reaches
# production unsigned would be a worse hole than the one this closes.
#
# Two branches build, and they build into two streams that cannot collide
# (NFR-D12, adopted from the engine's pre-merge dev/prod split):
#
#   main → `sha-<commit>`      the commit images a prod deploy pins
#   dev  → `dev` + `dev-<sha>` the images a dev stack runs, for the merge
#                              stages — mobile, voice, push — that are only
#                              verifiable against something live
#
# `dev` can never become `sha-<commit>` and never becomes `latest`, so
# "which build is that?" stays answerable and a dev image cannot be picked
# up by anything following the prod stream by accident.

on:
  push:
    branches:
      - main
      - dev
    # Documentation cannot change what an image contains.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/thedancingdeveloper-org/vogt
  # The merged product — the Python core *and* the session engine in one
  # container, which is what `deploy/vogt-stack.compose.yml` runs. A separate
  # repository rather than a tag on the one above, because they are different
  # artefacts for different deployments: `vogt` is the supported install of
  # Vogt alone (NFR-PO4), and this is the estate's own stack. One repository
  # with two kinds of tag in it is how somebody eventually pins the wrong one.
  STACK_IMAGE: ghcr.io/thedancingdeveloper-org/vogt-stack
  # Where BuildKit's layer cache lives (#184, superseding #55's GHCR backend).
  #
  # The estate's own `local-registry` container on Node B, not GHCR and not a
  # cache mount or a persistent named builder. The runners are a fleet on Node
  # B and a job lands on whichever worker is free, so anything held in a
  # builder's local state is cold on most runs by construction; a registry is
  # the only cache all the workers can see. This one is local — the cache never
  # leaves the host — while GHCR's `type=registry` (or `type=gha`) is a WAN
  # round-trip from the same runners. #129 established this backend on `main`;
  # `192.168.1.75:5500` is that container and `dind-daemon.json` on the workers
  # trusts it over HTTP.
  #
  # Its own repository rather than tags alongside the images, for the reason
  # `vogt` and `vogt-stack` are two repositories: one repository holding two
  # kinds of tag is how somebody eventually pins the wrong one. Cache tags are
  # keyed per image *and* per ref (`core-<ref>`, `stack-<ref>`) so the core and
  # stack streams, and the dev and main streams, never evict each other.
  CACHE_IMAGE: 192.168.1.75:5500/vogt-buildcache

concurrency:
  # Only the newest commit on a branch is worth an image; older ones in
  # flight are already superseded. Keyed by ref, so a dev build and a main
  # build never cancel each other.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docker Hub is not on the critical path any more (#33): both Dockerfiles
  # build `FROM` this organisation's GHCR mirror of the library images, and
  # this job makes sure the mirror holds what this commit's Dockerfiles ask
  # for before either image job starts.
  #
  # A prerequisite rather than a companion, and that is the whole point.
  # Renovate bumps a base digest; the merge is a push; the push builds. If
  # the mirror were a parallel job — or worse, only a scheduled one — the
  # build would reach a digest nobody had copied yet and fail at `FROM`,
  # which is precisely the failure this change exists to remove. Running it
  # first costs a few seconds: the copy is skipped entirely when the digest
  # is already in GHCR.
  base-images:
    name: the bases are in GHCR
    uses: ./.github/workflows/mirror-base-images.yml
    permissions:
      contents: read
      packages: write

  image:
    name: build and publish a commit image
    runs-on: [self-hosted, node-b, linux, x64, docker, publish]
    permissions:
      contents: read
      packages: write
      id-token: write
    # The merged image derives its core from this one by digest (#143), so the
    # digest has to leave this job rather than being re-derived from a tag.
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # The public core Dockerfile uses the upstream Python Official Image
      # directly. It does not require this repository's private base-image
      # mirror or any estate credentials. The merged/private stack below is
      # still built separately and retains its own mirror prerequisite.
      #
      # There used to be a login here, inert until `DOCKERHUB_USERNAME` was
      # set, offered as the remedy for builds failing at `FROM` with 429. The
      # secret was set, and the build 429'd anyway (#33):
      #
      #     AUTHENTICATED (sprooty):   HTTP 429  x-ratelimit-limit: 200;w=3600
      #     ANONYMOUS (runner egress): HTTP 200  x-ratelimit-limit: 100;w=3600
      #                                          x-ratelimit-remaining: 99
      #
      # The credential is estate-wide — the same one appears as
      # `HOMELAB_SECSCAN_DOCKERHUB_*` — so its 200/hour is shared with every
      # other project's CI and is empty exactly when the estate is busy,
      # which is when builds happen. Authenticating traded a bucket this
      # repository mostly controls for one it does not control at all. The
      # secrets were removed and the build succeeded anonymously.
      #
      # So this build does not reach Docker Hub at all. The bases are
      # `ghcr.io/thedancingdeveloper-org/vogt-base/*`, copied there by
      # `mirror-base-images.yml`, which the `base-images` job runs as a
      # prerequisite so a Renovate digest bump is mirrored before anything
      # builds from it. Adding a Docker Hub login back here would not help
      # anything and would put the estate's shared bucket back on this
      # repository's critical path.

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # A commit and nothing else. No semver, and explicitly no `latest`:
          # a moving alias is what makes "which build is that?" unanswerable,
          # and deployed references are digest-pinned anyway (NFR-PO4).
          #
          # `dev` is the one alias that does move, and it moves inside its own
          # stream: it names "whatever the dev stack should be running", which
          # is the whole point of having a dev stack. It is never `latest` and
          # never carries a version, so nothing following releases sees it.
          tags: |
            type=sha,enable=${{ github.ref != 'refs/heads/dev' }}
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
          flavor: |
            latest=false

      # Built and run before it is pushed. v0.1.0 shipped an image whose
      # entrypoint did not exist and v0.1.1 one that imported no application;
      # both builds were green and both artefacts had never been started.
      - uses: docker/build-push-action@v6
        id: candidate
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:smoke-test
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache on the estate's local-registry (#184). `cache-to` here
          # and `cache-from` on the push below share one ref, so the push
          # rebuilds nothing the smoke-tested candidate already produced.
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}:core-${{ github.ref_name }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }}:core-${{ github.ref_name }},mode=max

      - name: the image runs
        env:
          CANDIDATE: ${{ env.IMAGE }}:smoke-test
        run: |
          set -euo pipefail
          docker run --rm "$CANDIDATE" --version
          # v0.2.0 shipped without git. Nothing was red: `project.import`
          # shells out to it, and the `git-local` collector shells out to it,
          # so the loss showed up only in production, as an import that could
          # not run and a collector recording a checkout it had never read
          # (#19, #20, #21). Reading the Dockerfile cannot catch a build that
          # silently drops a package; running the binary can (NFR-Q7).
          docker run --rm --entrypoint git "$CANDIDATE" --version
          if docker run --rm "$CANDIDATE" serve 2>/dev/null; then
            echo "serve started without being told where to listen" >&2
            exit 1
          fi
          echo "image runs, has git, and still refuses to guess an address"

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          # Same cache ref as the candidate build above: every layer is a hit,
          # so the pushed image is the bytes the smoke test just ran rather
          # than a fresh recompile.
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}:core-${{ github.ref_name }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }}:core-${{ github.ref_name }},mode=max

      - uses: sigstore/cosign-installer@v3

      - name: sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # The digest, never a tag: a tag can be moved after signing, so a
          # signature over a tag says nothing about what gets pulled.
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: report what to pin
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = "refs/heads/dev" ]; then
            stack="the dev stack"
          else
            stack="production"
          fi
          {
            echo "### Built from \`${GITHUB_SHA:0:7}\`"
            echo
            echo "Nothing has been deployed. To move ${stack}, pin this in"
            echo "\`indexarr/ops\` and run \`DeployStack\`:"
            echo
            echo '```yaml'
            echo "    image: ${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "This is a build, not a release: no version was assigned, no"
            echo "semver tag was created, and \`latest\` did not move."
          } >> "$GITHUB_STEP_SUMMARY"

  # The dev-pod toolchain, built (or found already published) before anything
  # that consumes it (#184). Same prerequisite shape as `base-images` and for
  # the same reason: the common case is a lookup that costs seconds, and having
  # it as a companion job instead would mean the image build racing the thing it
  # is built on. `needs: base-images` because the pod base builds `FROM` a
  # mirrored Ubuntu, which the mirror job must have copied first.
  pod-base:
    name: the pod base is in GHCR
    needs: base-images
    uses: ./.github/workflows/pod-base.yml
    with:
      # Flutter and the dev/prod split used to be build args on the merged
      # image; they are the difference between the two published pod variants
      # now, so the split is made once, here.
      variant: ${{ github.ref == 'refs/heads/dev' && 'full' || 'lean' }}
    permissions:
      contents: read
      packages: write

  stack-image:
    name: build and publish the merged image
    # `needs: image` is not ordering for its own sake: the merged image copies
    # /opt/vogt out of the core image this run just published, by digest.
    # `needs: pod-base` supplies the toolchain base it now builds `FROM` (#184).
    needs: [base-images, pod-base, image]
    runs-on: [self-hosted, node-b, linux, x64, docker, publish]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # There is deliberately no runner-side `pnpm build` here any more (#184).
      #
      # There was one, and it never reached the image. `rust-embed` does read
      # `web/dist/` at compile time — that part was right — but the bundle it
      # reads is the one stage 1 of `engine/Dockerfile` builds inside the build
      # itself, and `engine/Dockerfile.dockerignore` lists `web/dist`, so the
      # runner's copy was excluded from the context it would have had to arrive
      # through. It was a step that looked load-bearing, cost a Node toolchain
      # and a pnpm install, and produced a directory nothing read. The PWA is
      # still built before the engine that embeds it — stage 1 before stage 2 —
      # which `tests/test_deploy.py` now asserts against `engine/Dockerfile`.

      # No Docker Hub login, deliberately — and this is a trap worth naming,
      # because the obvious "improvement" is to add one back.
      #
      # There used to be a login here, inert until `DOCKERHUB_USERNAME` was
      # set, offered as the remedy for builds failing at `FROM` with 429. The
      # secret was set, and the build 429'd anyway (#33):
      #
      #     AUTHENTICATED (sprooty):   HTTP 429  x-ratelimit-limit: 200;w=3600
      #     ANONYMOUS (runner egress): HTTP 200  x-ratelimit-limit: 100;w=3600
      #                                          x-ratelimit-remaining: 99
      #
      # The credential is estate-wide — the same one appears as
      # `HOMELAB_SECSCAN_DOCKERHUB_*` — so its 200/hour is shared with every
      # other project's CI and is empty exactly when the estate is busy,
      # which is when builds happen. Authenticating traded a bucket this
      # repository mostly controls for one it does not control at all. The
      # secrets were removed and the build succeeded anonymously.
      #
      # So this build does not reach Docker Hub at all. The bases are
      # `ghcr.io/thedancingdeveloper-org/vogt-base/*`, copied there by
      # `mirror-base-images.yml`, which the `base-images` job runs as a
      # prerequisite so a Renovate digest bump is mirrored before anything
      # builds from it. Adding a Docker Hub login back here would not help
      # anything and would put the estate's shared bucket back on this
      # repository's critical path.

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.STACK_IMAGE }}
          tags: |
            type=sha,enable=${{ github.ref != 'refs/heads/dev' }}
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
          flavor: |
            latest=false

      - uses: docker/build-push-action@v6
        id: candidate
        with:
          # The repository root, not `engine/`: the Dockerfile reaches for
          # `web/dist`, `pyproject.toml` and `src/` as well as the crates.
          context: .
          file: engine/Dockerfile
          load: true
          tags: ${{ env.STACK_IMAGE }}:smoke-test
          labels: ${{ steps.meta.outputs.labels }}
          # `#` inside a `|` block scalar is literal content, not a YAML
          # comment, and build-push-action parses the input without a comment
          # option — so a note in there reaches buildx as a build arg. It goes
          # here instead.
          #
          # INSTALL_CADASTRE_MCP / INSTALL_THECLAWBAY are private-stack
          # compatibility. Neither is part of the root/public image; the dev
          # pod opts in so its current configuration stays reproducible while
          # the generic distribution stays independent.
          #
          # POD_BASE_IMAGE is the digest `pod-base` just resolved. Flutter is no
          # longer a build arg here (#184): it is the `lean`/`full` pod variant
          # selected above, so `dev` builds on `:full-*` (with the mobile SDK)
          # and everything else on `:lean-*`.
          build-args: |
            POD_BASE_IMAGE=${{ needs.pod-base.outputs.image }}
            CORE_IMAGE=${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
            INSTALL_AI_CLIENTS=${{ github.ref == 'refs/heads/dev' }}
            INSTALL_CADASTRE_MCP=${{ github.ref == 'refs/heads/dev' }}
            INSTALL_THECLAWBAY=${{ github.ref == 'refs/heads/dev' }}
          # Layer cache on the estate's local-registry (#184), its own tag so
          # the stack and core streams cannot evict each other, and per-ref so
          # dev (INSTALL_AI_CLIENTS=true, the `full` pod base) and main do not.
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}:stack-${{ github.ref_name }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }}:stack-${{ github.ref_name }},mode=max

      - name: the merged image runs both halves
        env:
          CANDIDATE: ${{ env.STACK_IMAGE }}:smoke-test
          DEV_IMAGE: ${{ github.ref == 'refs/heads/dev' }}
        run: |
          set -euo pipefail
          # The same lesson the core-only smoke test records: two releases
          # shipped images that had never been started. This one has two
          # processes, so it is asked about both — and about the seam, which
          # is the part that cannot be checked by reading.
          docker run --rm --entrypoint vogt "$CANDIDATE" --version
          docker run --rm --entrypoint mydevenv2-server "$CANDIDATE" --help >/dev/null
          echo "both halves are present and start"

          # The dev image is a working pod, and a pod without the AI clients
          # is not the thing MyDevEnv2 shipped. `INSTALL_AI_CLIENTS` defaulted
          # to false and no build turned it on, so `vogt-dev` ran with neither
          # `claude` nor `codex` and nothing was red (#23). A build arg that
          # nothing asserts is a default waiting to be forgotten — NFR-Q7 is
          # the general form of that lesson.
          #
          # `theclawbay` joins the loop for the second half of that lesson
          # (WI-17): it was in nobody's image and only in a persisted home, so
          # replacing the home volume took it away and, again, nothing was red.
          # A tool nothing executes is a tool nothing knows it has lost.
          if [ "${DEV_IMAGE}" = "true" ]; then
            for tool in claude codex flutter theclawbay; do
              docker run --rm --entrypoint "$tool" "$CANDIDATE" --version >/dev/null \
                || { echo "the dev image is missing $tool" >&2; exit 1; }
            done
            echo "dev image carries the AI clients and the mobile SDK"
          fi

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          file: engine/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Identical to the candidate build's, so the pushed image is the
          # layers the smoke test just ran, not a rebuild that happens to
          # look similar. The `dev` branch is the dev image (`:dev`,
          # `dev-<sha>`) and is the only one that carries the AI clients and
          # the mobile SDK — the same split `.woodpecker/server.yml`'s
          # `build-and-push-dev` used to make, which the migration to Actions
          # dropped without replacing (#23). The mobile SDK half of it is now
          # the `full` pod variant chosen in `needs.pod-base`.
          build-args: |
            POD_BASE_IMAGE=${{ needs.pod-base.outputs.image }}
            CORE_IMAGE=${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
            INSTALL_AI_CLIENTS=${{ github.ref == 'refs/heads/dev' }}
            INSTALL_CADASTRE_MCP=${{ github.ref == 'refs/heads/dev' }}
            INSTALL_THECLAWBAY=${{ github.ref == 'refs/heads/dev' }}
          provenance: true
          sbom: true
          # Same cache ref as the candidate: every layer is a hit, so the push
          # is a re-tag of the smoke-tested bytes rather than a recompile.
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}:stack-${{ github.ref_name }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }}:stack-${{ github.ref_name }},mode=max

      - uses: sigstore/cosign-installer@v3

      - name: sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${STACK_IMAGE}@${DIGEST}"

      - name: report what to pin
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Merged stack image from \`${GITHUB_SHA:0:7}\`"
            echo
            echo "Nothing has been deployed. \`deploy/vogt-stack.compose.yml\`"
            echo "pins this line:"
            echo
            echo '```yaml'
            echo "    image: ${STACK_IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "See \`docs/DEPLOYMENT.md\` §9 before the first deploy: the"
            echo "smoke test above proves the halves start, not that the front"
            echo "door reaches a core."
          } >> "$GITHUB_STEP_SUMMARY"
