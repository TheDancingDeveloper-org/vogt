name: build

# A *build*, which is not a release.
#
# `release.yml` owns releases: a `v*` tag, a semver-tagged image, `latest`, a
# wheel, an SBOM. This owns the other thing — an image for a commit on main,
# identified only by its sha, so deploying a fix does not require inventing a
# version number for it.
#
# NFR-C3 originally said a push to main shall never publish an image, and the
# effect was that every fix needed a version bump to become deployable: three
# of them in one afternoon, none marking a release. The requirement was
# revised (see `REQUIREMENTS.md`) once the two acts were told apart. What it
# was protecting is intact:
#
#   * merging still cannot cut a release — no semver tag, no `latest`, no
#     wheel, and nothing here writes a GitHub Release
#   * merging still cannot deploy anything (NFR-D10) — production moves when
#     the digest pinned in `indexarr/ops` changes and `DeployStack` runs
#
# Images are signed here as they are in a release. A build that reaches
# production unsigned would be a worse hole than the one this closes.
#
# Two branches build, and they build into two streams that cannot collide
# (NFR-D12, adopted from `docs/engine/uplift.md`):
#
#   main → `sha-<commit>`      the commit images a prod deploy pins
#   dev  → `dev` + `dev-<sha>` the images a dev stack runs, for the merge
#                              stages — mobile, voice, push — that are only
#                              verifiable against something live
#
# `dev` can never become `sha-<commit>` and never becomes `latest`, so
# "which build is that?" stays answerable and a dev image cannot be picked
# up by anything following the prod stream by accident.

on:
  push:
    branches:
      - main
      - dev
    # Documentation cannot change what an image contains.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/thedancingdeveloper-org/vogt
  # The merged product — the Python core *and* the session engine in one
  # container, which is what `deploy/vogt-stack.compose.yml` runs. A separate
  # repository rather than a tag on the one above, because they are different
  # artefacts for different deployments: `vogt` is the supported install of
  # Vogt alone (NFR-PO4), and this is the estate's own stack. One repository
  # with two kinds of tag in it is how somebody eventually pins the wrong one.
  STACK_IMAGE: ghcr.io/thedancingdeveloper-org/vogt-stack

concurrency:
  # Only the newest commit on a branch is worth an image; older ones in
  # flight are already superseded. Keyed by ref, so a dev build and a main
  # build never cancel each other.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build and publish a commit image
    runs-on: [self-hosted, node-b, linux, x64, docker, publish]
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Docker Hub, when a credential is configured.
      #
      # Every base image in both Dockerfiles comes from Docker Hub, and an
      # anonymous pull is rate-limited per IP. A self-hosted runner is one IP
      # for every build this repository makes, so a busy afternoon exhausts
      # the allowance and the next build fails at `FROM` with 429 — which is
      # what happened on 2026-08-14, to both image jobs at once, with nothing
      # wrong in the repository.
      #
      # Inert until somebody sets the secret, and it says which way it went
      # rather than passing in silence: a step that quietly does nothing is
      # indistinguishable from a step that worked.
      - id: dockerhub
        name: is there a Docker Hub credential
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKERHUB_USERNAME:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No DOCKERHUB_USERNAME secret; base images are pulled anonymously and are subject to Docker Hub's per-IP rate limit. A 429 at FROM is that limit, not a fault in this repository."
          fi

      - name: log in to Docker Hub
        if: steps.dockerhub.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # A commit and nothing else. No semver, and explicitly no `latest`:
          # a moving alias is what makes "which build is that?" unanswerable,
          # and deployed references are digest-pinned anyway (NFR-PO4).
          #
          # `dev` is the one alias that does move, and it moves inside its own
          # stream: it names "whatever the dev stack should be running", which
          # is the whole point of having a dev stack. It is never `latest` and
          # never carries a version, so nothing following releases sees it.
          tags: |
            type=sha,enable=${{ github.ref != 'refs/heads/dev' }}
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
          flavor: |
            latest=false

      # Built and run before it is pushed. v0.1.0 shipped an image whose
      # entrypoint did not exist and v0.1.1 one that imported no application;
      # both builds were green and both artefacts had never been started.
      - uses: docker/build-push-action@v6
        id: candidate
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:smoke-test
          labels: ${{ steps.meta.outputs.labels }}

      - name: the image runs
        env:
          CANDIDATE: ${{ env.IMAGE }}:smoke-test
        run: |
          set -euo pipefail
          docker run --rm "$CANDIDATE" --version
          # v0.2.0 shipped without git. Nothing was red: `project.import`
          # shells out to it, and the `git-local` collector shells out to it,
          # so the loss showed up only in production, as an import that could
          # not run and a collector recording a checkout it had never read
          # (#19, #20, #21). Reading the Dockerfile cannot catch a build that
          # silently drops a package; running the binary can (NFR-Q7).
          docker run --rm --entrypoint git "$CANDIDATE" --version
          if docker run --rm "$CANDIDATE" serve 2>/dev/null; then
            echo "serve started without being told where to listen" >&2
            exit 1
          fi
          echo "image runs, has git, and still refuses to guess an address"

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - uses: sigstore/cosign-installer@v3

      - name: sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # The digest, never a tag: a tag can be moved after signing, so a
          # signature over a tag says nothing about what gets pulled.
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: report what to pin
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = "refs/heads/dev" ]; then
            stack="the dev stack"
          else
            stack="production"
          fi
          {
            echo "### Built from \`${GITHUB_SHA:0:7}\`"
            echo
            echo "Nothing has been deployed. To move ${stack}, pin this in"
            echo "\`indexarr/ops\` and run \`DeployStack\`:"
            echo
            echo '```yaml'
            echo "    image: ${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "This is a build, not a release: no version was assigned, no"
            echo "semver tag was created, and \`latest\` did not move."
          } >> "$GITHUB_STEP_SUMMARY"

  stack-image:
    name: build and publish the merged image
    runs-on: [self-hosted, node-b, linux, x64, docker, publish]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: build the PWA
        # `rust-embed` reads `web/dist/` at compile time, so the bundle is a
        # build input to the Rust half rather than a separate artefact. An
        # image built without this step compiles — and serves a placeholder
        # where the product's front end should be.
        run: |
          set -euo pipefail
          corepack enable
          cd web
          pnpm install --frozen-lockfile
          pnpm build

      # Docker Hub, when a credential is configured.
      #
      # Every base image in both Dockerfiles comes from Docker Hub, and an
      # anonymous pull is rate-limited per IP. A self-hosted runner is one IP
      # for every build this repository makes, so a busy afternoon exhausts
      # the allowance and the next build fails at `FROM` with 429 — which is
      # what happened on 2026-08-14, to both image jobs at once, with nothing
      # wrong in the repository.
      #
      # Inert until somebody sets the secret, and it says which way it went
      # rather than passing in silence: a step that quietly does nothing is
      # indistinguishable from a step that worked.
      - id: dockerhub
        name: is there a Docker Hub credential
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKERHUB_USERNAME:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No DOCKERHUB_USERNAME secret; base images are pulled anonymously and are subject to Docker Hub's per-IP rate limit. A 429 at FROM is that limit, not a fault in this repository."
          fi

      - name: log in to Docker Hub
        if: steps.dockerhub.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.STACK_IMAGE }}
          tags: |
            type=sha,enable=${{ github.ref != 'refs/heads/dev' }}
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
          flavor: |
            latest=false

      - uses: docker/build-push-action@v6
        id: candidate
        with:
          # The repository root, not `engine/`: the Dockerfile reaches for
          # `web/dist`, `pyproject.toml` and `src/` as well as the crates.
          context: .
          file: engine/Dockerfile
          load: true
          tags: ${{ env.STACK_IMAGE }}:smoke-test
          labels: ${{ steps.meta.outputs.labels }}

      - name: the merged image runs both halves
        env:
          CANDIDATE: ${{ env.STACK_IMAGE }}:smoke-test
        run: |
          set -euo pipefail
          # The same lesson the core-only smoke test records: two releases
          # shipped images that had never been started. This one has two
          # processes, so it is asked about both — and about the seam, which
          # is the part that cannot be checked by reading.
          docker run --rm --entrypoint vogt "$CANDIDATE" --version
          docker run --rm --entrypoint mydevenv2-server "$CANDIDATE" --help >/dev/null
          echo "both halves are present and start"

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          file: engine/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - uses: sigstore/cosign-installer@v3

      - name: sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${STACK_IMAGE}@${DIGEST}"

      - name: report what to pin
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Merged stack image from \`${GITHUB_SHA:0:7}\`"
            echo
            echo "Nothing has been deployed. \`deploy/vogt-stack.compose.yml\`"
            echo "pins this line:"
            echo
            echo '```yaml'
            echo "    image: ${STACK_IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "See \`docs/DEPLOYMENT.md\` §9 before the first deploy: the"
            echo "smoke test above proves the halves start, not that the front"
            echo "door reaches a core."
          } >> "$GITHUB_STEP_SUMMARY"
