name: deploy production

# Publishing a release never changes production. This separately dispatched
# workflow verifies the signed release and hands an immutable release receipt
# to the estate deployment repository. That repository owns desired state,
# deployment credentials, rollback, and the live smoke; Vogt has no broad
# long-lived Komodo credential.

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (for example v0.3.0)
        required: true
        type: string
      confirm:
        description: Type DEPLOY to confirm the live production change
        required: true
        type: string

permissions:
  contents: read
  packages: read

# The GitHub App token is scoped to the configured deployment repository, but
# the environment approval remains the human change-control gate.

jobs:
  deploy:
    name: verify and hand off the approved release
    runs-on: [self-hosted, tailnet]
    environment: vogt-prod
    steps:
      - name: confirm the live deployment
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = DEPLOY ] || {
            echo "::error::Type DEPLOY in the confirmation field to change vogt-prod."
            exit 1
          }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: validate the release tag ancestry
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags origin "$TAG"
          tag_sha="$(git rev-list -n1 "$TAG")"
          git fetch --no-tags origin "+refs/heads/prod:refs/remotes/origin/prod"
          git merge-base --is-ancestor "$tag_sha" origin/prod || {
            echo "::error::$TAG ($tag_sha) is not reachable from origin/prod"
            exit 1
          }
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"

      - name: authenticate to the release registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: resolve the signed merged-image digest
        id: image
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/thedancingdeveloper-org/vogt-stack:$TAG"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          case "$digest" in sha256:*) ;; *) echo "invalid digest: $digest" >&2; exit 1;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3

      - name: verify the signed merged-image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp "^https://github.com/TheDancingDeveloper-org/vogt/.github/workflows/release.yml@refs/tags/v[0-9].*$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/thedancingdeveloper-org/vogt-stack@${DIGEST}"

      - name: mint the scoped deployment-app token
        id: deployment-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VOGT_DEPLOYMENT_APP_ID }}
          private-key: ${{ secrets.VOGT_DEPLOYMENT_APP_PRIVATE_KEY }}
          owner: ${{ vars.VOGT_DEPLOYMENT_OWNER }}
          repositories: ${{ vars.VOGT_DEPLOYMENT_REPOSITORY_NAME }}
          permission-actions: write
          permission-contents: read

      - name: hand the signed release to the estate repository
        env:
          GH_TOKEN: ${{ steps.deployment-token.outputs.token }}
          DEPLOY_REPOSITORY: ${{ vars.VOGT_DEPLOYMENT_REPOSITORY }}
          DEPLOY_WORKFLOW: ${{ vars.VOGT_DEPLOYMENT_WORKFLOW }}
          DEPLOY_REF: ${{ vars.VOGT_DEPLOYMENT_REF }}
          DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          TAG: ${{ inputs.tag }}
          RECEIPT_RUN: "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        run: |
          set -euo pipefail
          : "${DEPLOY_REPOSITORY:?Configure VOGT_DEPLOYMENT_REPOSITORY in vogt-prod}"
          : "${DEPLOY_WORKFLOW:?Configure VOGT_DEPLOYMENT_WORKFLOW in vogt-prod}"
          : "${DEPLOY_REF:?Configure VOGT_DEPLOYMENT_REF in vogt-prod}"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg ref "$DEPLOY_REF" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$RELEASE_SHA" \
            --arg source_tag "$TAG" \
            --arg image_digest "$DIGEST" \
            --arg confirmation_run "$RECEIPT_RUN" \
            '{ref: $ref, inputs: {source_repository: $source_repository, source_sha: $source_sha, source_tag: $source_tag, image_digest: $image_digest, confirmation_run: $confirmation_run}}' \
            | gh api --method POST \
            "repos/${DEPLOY_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/dispatches" \
            --input -
          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh api "repos/${DEPLOY_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/runs?event=workflow_dispatch&per_page=20" --jq ".workflow_runs[] | select(.created_at >= \"$started_at\") | .id" | head -n 1 || true)"
            [ -n "$run_id" ] && break
            sleep 5
          done
          : "${run_id:?deployment repository did not create a workflow run}"
          for _ in $(seq 1 180); do
            state="$(gh api "repos/${DEPLOY_REPOSITORY}/actions/runs/${run_id}" --jq .status)"
            [ "$state" = completed ] && break
            sleep 10
          done
          conclusion="$(gh api "repos/${DEPLOY_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)"
          [ "$conclusion" = success ] || {
            echo "::error::estate deployment run ${run_id} concluded ${conclusion}" >&2
            exit 1
          }
          artifact_id="$(gh api "repos/${DEPLOY_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.artifacts[] | select(.name == "vogt-deployment-receipt") | .id' | head -n 1 || true)"
          : "${artifact_id:?estate deployment did not upload vogt-deployment-receipt}"
          mkdir -p "$RUNNER_TEMP/vogt-receipt"
          gh api "repos/${DEPLOY_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$RUNNER_TEMP/vogt-receipt/receipt.zip"
          python3 - "$RUNNER_TEMP/vogt-receipt/receipt.zip" "$RUNNER_TEMP/vogt-receipt" <<'PY'
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              archive.extractall(sys.argv[2])
          PY
          receipt_path="$RUNNER_TEMP/vogt-receipt/receipt.json"
          [ -f "$receipt_path" ] || {
            echo "::error::receipt archive did not contain receipt.json" >&2
            exit 1
          }
          python3 - "$receipt_path" "$RELEASE_SHA" "$TAG" "$DIGEST" <<'PY'
          import json
          import sys
          receipt = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {"source_sha": sys.argv[2], "source_tag": sys.argv[3], "image_digest": sys.argv[4]}
          for key, value in expected.items():
              if receipt.get(key) != value:
                  raise SystemExit(f"receipt {key} does not match the approved release")
          required = ("desired_state_commit", "deployment_id", "live_smoke", "rollback_plan", "migration_limits")
          missing = [key for key in required if not receipt.get(key)]
          if missing:
              raise SystemExit("receipt is missing: " + ", ".join(missing))
          if receipt["live_smoke"].get("status") != "passed":
              raise SystemExit("receipt live_smoke.status is not passed")
          print(json.dumps(receipt, sort_keys=True))
          PY
          echo "estate deployment ${run_id} verified; desired-state and live receipt accepted"

      - name: record the release receipt
        run: echo "release ${{ inputs.tag }} (${{ steps.image.outputs.digest }}) handed to the approved estate deployment workflow"
