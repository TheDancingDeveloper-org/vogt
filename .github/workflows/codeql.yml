name: codeql

# Repository-owned code scanning for all three implementation languages.
# Operator decision: CodeQL runs only when a release build is cut. A beta or
# prod tag push (the same trigger release.yml and release-mobile.yml use)
# starts it, and so does a manual dispatch. The dev deploy lane dispatches it
# with `ref` set to the commit it deploys. It does not run on pull_request,
# merge_group, push to main, or a schedule. The job names are unchanged.
# See docs/ci.md, "CodeQL".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA to analyse (default: the dispatched ref)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  changes:
    name: classify languages
    runs-on: [self-hosted]
    timeout-minutes: 10
    outputs:
      python: ${{ steps.classify.outputs.python }}
      javascript-typescript: ${{ steps.classify.outputs.javascript-typescript }}
      rust: ${{ steps.classify.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "$EVENT_NAME: analysing every language"
            printf 'python=true\njavascript-typescript=true\nrust=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          files="$(git diff --name-only "$(git merge-base "origin/$BASE_REF" HEAD)..HEAD")"
          matches() { printf '%s\n' "$files" | grep -Eq "$1"; }
          # A change to the scanning setup itself re-analyses everything.
          if matches '^\.github/(workflows/codeql\.yml|codeql/)'; then
            printf 'python=true\njavascript-typescript=true\nrust=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          py=false; js=false; rs=false
          matches '\.py$|^(pyproject\.toml|uv\.lock)$' && py=true
          matches '\.(js|jsx|mjs|cjs|ts|tsx)$|(^|/)package\.json$|pnpm-lock\.yaml$' && js=true
          matches '\.rs$|(^|/)Cargo\.(toml|lock)$' && rs=true
          printf 'python=%s\njavascript-typescript=%s\nrust=%s\n' "$py" "$js" "$rs" >> "$GITHUB_OUTPUT"

  analyze:
    name: analyze (${{ matrix.language }})
    # `bigmem` is node-b-gha-public-bigmem (ops personal/github-runner, 32 G
    # cap). Bare [self-hosted] let analysis land on node-f runners whose 8 G
    # caps oversubscribe a 15 G guest, and `codeql database finalize` was
    # killed with exit 137 there (main run 37603927375, WI-999). CodeQL sizes
    # --ram from the container's memory limit, so no threads/ram pin is set:
    # on this runner autodetect has room, and a pin only slows the analysis.
    # A label no online runner advertises queues forever, so this runner must
    # stay up; there is one bigmem slot, so the languages run one after another.
    needs: changes
    runs-on: [self-hosted, bigmem]
    timeout-minutes: 45
    concurrency:
      # Newest-wins: an analysis of a superseded commit is fully covered by
      # the analysis that replaces it — CodeQL scans the whole tree, so
      # cancelling loses nothing on any event.
      group: codeql-${{ github.ref }}-${{ matrix.language }}
      cancel-in-progress: true
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
          - rust
    steps:
      # Every release-triggered or dispatched run analyses every language, so
      # the change classifier above always reports true for these events.
      - name: nothing in this language changed
        if: needs.changes.outputs[matrix.language] != 'true'
        run: echo "no ${{ matrix.language }} change on this pull request; the merge queue analyses it"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.changes.outputs[matrix.language] == 'true'
        with:
          ref: ${{ inputs.ref }}

      # The Actions runtime bundles Node for action execution, but the
      # JavaScript/TypeScript extractor starts `node` from PATH. The
      # self-hosted base runner deliberately has no language runtimes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: matrix.language == 'javascript-typescript' && needs.changes.outputs[matrix.language] == 'true'
        with:
          node-version: "22"

      # Rust, Python, and JavaScript/TypeScript all support build-mode none in
      # the current CodeQL bundle. That keeps this security analysis separate
      # from the authoritative build/test jobs and avoids rebuilding the PWA
      # or engine only to extract source a second time.
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        if: needs.changes.outputs[matrix.language] == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Query suite and path scope (test exclusions) live in the config
          # file so they are described once, with rationale, rather than inline.
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        if: needs.changes.outputs[matrix.language] == 'true'
        with:
          category: /language:${{ matrix.language }}
