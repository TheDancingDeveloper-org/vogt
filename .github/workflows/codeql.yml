name: codeql

# Repository-owned code scanning for all three implementation languages.
# This starts as an independent check: once the self-hosted runner has
# produced a receipt for every matrix entry it can be added to branch
# protection without turning runner/tool-download uncertainty into a merge
# outage.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: [self-hosted]
    timeout-minutes: 45
    concurrency:
      # One analysis at a time, across every language. The self-hosted runner
      # has ~8 GB and each analysis needs about half of it (see the ram pin
      # below); letting rust and javascript-typescript run together is what
      # got both killed with exit 137 on main run 37603927375. Newest-wins
      # still holds within a ref, and CodeQL scans the whole tree, so
      # cancelling a superseded commit loses nothing.
      group: codeql-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
          - rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The Actions runtime bundles Node for action execution, but the
      # JavaScript/TypeScript extractor starts `node` from PATH. The
      # self-hosted base runner deliberately has no language runtimes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: matrix.language == 'javascript-typescript'
        with:
          node-version: "22"

      # Rust, Python, and JavaScript/TypeScript all support build-mode none in
      # the current CodeQL bundle. That keeps this security analysis separate
      # from the authoritative build/test jobs and avoids rebuilding the PWA
      # or engine only to extract source a second time.
      # The self-hosted runner has 12 CPUs and ~8 GB, and CodeQL's autodetect
      # took --threads=12 --ram=6270. With the languages running together that
      # was killed (exit 137) on main run 37603927375. They now run one at a
      # time (the concurrency group above), and each gets a fixed 4 GB and 4
      # threads: 2 GB is not enough for the javascript-typescript queries,
      # which exited 99 "out of memory" on PR #880.
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          threads: 4
          ram: 4096
          # Query suite and path scope (test exclusions) live in the config
          # file so they are described once, with rationale, rather than inline.
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: /language:${{ matrix.language }}
          threads: 4
          ram: 4096
