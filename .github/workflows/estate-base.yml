name: estate-base

on:
  workflow_call:
    inputs:
      pod_base_image:
        required: true
        type: string
    outputs:
      image:
        description: The estate base, by immutable digest
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

env:
  ESTATE_IMAGE: ghcr.io/thedancingdeveloper-org/vogt-estate

jobs:
  build:
    name: build estate base
    runs-on: [self-hosted, docker, publish]
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: name this estate build
        id: tag
        env:
          POD_BASE_IMAGE: ${{ inputs.pod_base_image }}
        run: |
          set -euo pipefail
          hash="$(cat engine/Dockerfile.estate engine/agent-versions.env; printf '%s' "$POD_BASE_IMAGE")"
          hash="$(printf '%s' "$hash" | sha256sum | cut -c1-16)"
          echo "ref=${ESTATE_IMAGE}:tools-${hash}" >> "$GITHUB_OUTPUT"
      - name: reuse or build estate base
        id: push
        env:
          REF: ${{ steps.tag.outputs.ref }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "estate base already published: $REF"
            exit 0
          fi
          docker buildx build \
            --file engine/Dockerfile.estate \
            --build-arg "POD_BASE_IMAGE=${{ inputs.pod_base_image }}" \
            --tag "$REF" --push --provenance=true --sbom=true .
      - name: resolve digest
        id: resolve
        env:
          REF: ${{ steps.tag.outputs.ref }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')"
          case "$digest" in sha256:*) ;; *) echo "no estate digest" >&2; exit 1;; esac
          echo "image=${ESTATE_IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
          echo "resolved $REF -> $digest"
