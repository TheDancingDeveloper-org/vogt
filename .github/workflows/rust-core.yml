name: rust-core

# Gate for the Rust core. It runs on the long-lived `rust-core` branch and on
# the WI-1076 integration (push to wi-1076-engine-core, pull requests into
# wi-1443-main-sync), because that is where the compose job — including the
# existing e2e and live Playwright — has to actually execute. It does not run
# on main. The parity job is a placeholder until the black-box harness (P0.3)
# exists.

on:
  push:
    branches: [rust-core, wi-1076-engine-core, wi-1443-main-sync]
  pull_request:
    branches: [rust-core, wi-1443-main-sync]
  workflow_dispatch:

concurrency:
  group: rust-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: fmt, clippy, test
    # `bigmem` is node-b-gha-public-bigmem, the same runner CodeQL uses for
    # the Rust analysis. A label no online runner advertises queues forever.
    runs-on: [self-hosted, bigmem]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # drift_ledger.py diffs against origin/main, which a shallow clone
          # does not contain.
          fetch-depth: 0

      # The bigmem runner is a bare self-hosted image; cargo arrives here, the
      # same way ci.yml's engine job gets it.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: engine

      - name: cargo fmt
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: engine
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (vogt-core)
        working-directory: engine
        run: cargo test -p vogt-core

      # engine/server/tests/rust_core.rs fails when this binary is absent, so
      # the build has to happen in this job. `cargo test -p vogt-core` above
      # does not leave the binary where that test looks.
      - name: cargo build (vogt-core) and front-door tests
        working-directory: engine
        run: |
          cargo build -p vogt-core
          cargo test -p vogt-engine-server --test rust_core

      # The stack image's server-build stage copies a subset of the tree and
      # then runs cargo. rust-core.yml never builds that image, so a workspace
      # member the stage does not copy fails ci.yml and build.yml on the swap
      # and nowhere else. This checks the stage's file set loads.
      - name: server-build stage loads
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          copy() { mkdir -p "$stage/engine/$(dirname "$2")" && cp -a "$1" "$stage/engine/$2"; }
          copy engine/Cargo.toml Cargo.toml
          copy engine/Cargo.lock Cargo.lock
          copy engine/contract/Cargo.toml contract/Cargo.toml
          copy engine/contract/src contract/src
          copy engine/server/Cargo.toml server/Cargo.toml
          copy engine/server/build.rs server/build.rs
          copy engine/server/src server/src
          copy engine/core/Cargo.toml core/Cargo.toml
          copy engine/core/src core/src
          mkdir -p "$stage/src/vogt/storage/sqlite" "$stage/web/dist"
          cp -a src/vogt/storage/sqlite/migrations "$stage/src/vogt/storage/sqlite/migrations"
          # metadata proves the workspace loads; cargo check proves the embedded SQL
          # resolves, which a missing COPY or a wrong include_str! depth would
          # not. --offline uses the cache the job already warmed.
          ( cd "$stage/engine" && cargo check --offline -p vogt-core )

  compose:
    name: compose smoke against the Rust core
    runs-on: [self-hosted, docker]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: build the Rust core image and walk the stack
        run: bash scripts/rust_core_compose_smoke.sh

      # The existing e2e, with the Rust core in the core slot. Same files as
      # .github/workflows/e2e.yml plus deploy/rust-core.overlay.yml, which
      # swaps the image and points the core at the engine. The Playwright
      # step is the same `live` project that workflow runs.
      - name: existing compose e2e and live Playwright against the Rust core
        env:
          COMPOSE_FILES: "-f deploy/vogt.compose.yml -f deploy/engine.overlay.yml -f deploy/e2e.overlay.yml -f deploy/rust-core.overlay.yml"
          COMPOSE_PROJECT_NAME: vogt-rust-core-e2e-${{ github.run_id }}
          VOGT_IMAGE: vogt-core:rust
          VOGT_BIND_IP: 127.0.0.1
          ENGINE_BIND: 127.0.0.1
        run: |
          export VOGT_PORT="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')"
          export ENGINE_PORT="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')"
          export VOGT_PUBLIC_URL="http://127.0.0.1:${VOGT_PORT}"
          export ENGINE_PUBLIC_URL="http://127.0.0.1:${ENGINE_PORT}"
          set -euo pipefail
          docker build -t vogt-core:rust -f deploy/rust-core.Dockerfile .
          docker build -t vogt-engine:local -f engine/Dockerfile .
          docker build -t vogt-engine-e2e:local -f deploy/e2e.engine.Dockerfile .
          docker build -t vogt-e2e-playwright:local -f deploy/e2e.playwright.Dockerfile .
          # Tokens go through the named volume (VOGT_CORE_TOKEN_VALUE,
          # ENGINE_TOKEN_VALUE), never a host file. A file secret's source
          # does not exist on the daemon.
          export VOGT_CORE_TOKEN_VALUE="$(openssl rand -hex 32)"
          export ENGINE_TOKEN_VALUE="$(openssl rand -hex 32)"
          export ENGINE_TOKEN="$ENGINE_TOKEN_VALUE"
          # shellcheck disable=SC2086
          docker compose $COMPOSE_FILES up -d
          trap 'docker compose $COMPOSE_FILES down -v || true' EXIT
          ok=""
          for _ in $(seq 1 60); do
            if docker compose $COMPOSE_FILES exec -T engine curl -fsS http://vogt:8000/health/ready >/dev/null 2>&1; then
              ok=yes; break
            fi
            sleep 5
          done
          test -n "$ok" || { docker compose $COMPOSE_FILES logs --tail=200; exit 1; }
          # The core being ready does not mean the engine is listening yet:
          # the entrypoint installs CLIs before it execs the server, and the
          # walk below runs inside the engine against its own port.
          front=""
          for _ in $(seq 1 60); do
            if docker compose $COMPOSE_FILES exec -T engine curl -fsS http://127.0.0.1:8910/healthz >/dev/null 2>&1; then
              front=yes; break
            fi
            sleep 5
          done
          test -n "$front" || { docker compose $COMPOSE_FILES logs --tail=200; exit 1; }
          docker compose $COMPOSE_FILES exec -T engine mkdir -p /tmp/e2e/scripts /tmp/e2e/tests/fixtures
          docker compose $COMPOSE_FILES cp scripts/e2e_stack_smoke.sh engine:/tmp/e2e/scripts/e2e_stack_smoke.sh
          # No VOGT_SMOKE_TOKEN: the smoke walks the stranger's path and mints
          # the first person's token. The break-glass ENGINE_TOKEN is agent-
          # bound and never closes first-run install mode (#903), so handing
          # it to the smoke left the live gate showing the wizard instead.
          docker compose $COMPOSE_FILES exec -T engine \
            bash /tmp/e2e/scripts/e2e_stack_smoke.sh http://localhost:8910
          # The live specs that exercise the Rust core's sign-in gate, the
          # demo provenance check and the terminal reattach. Gating.
          docker compose $COMPOSE_FILES --profile live run --rm -T \
            -e PLAYWRIGHT_LIVE_TOKEN="$ENGINE_TOKEN" playwright \
            -g "Login and authentication errors present|stale provenance cannot activate demo mode|terminal replay budget \(live acceptance\) symptom 1"
  # The live Playwright browser e2e against the Rust core. Required: the
  # specs that pass on the Rust core, which the job's first run gates. Operator
  # decision, 2026-10-17. Everything else in the live suite runs after it,
  # advisory. It is its own job so the check name is stable for branch
  # protection. Branch protection must list `live Playwright against the Rust
  # core (required)` only once this job is green on rust-core.
  playwright:
    name: live Playwright against the Rust core (required)
    runs-on: [self-hosted, docker]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # One step, one shell: the stack's teardown trap belongs to the shell
      # that brought it up, so the smoke and the live run cannot be split
      # across steps. The live run needs the first-person state the smoke
      # leaves behind, which is why this repeats the bring-up `compose` does
      # rather than sharing its stack.
      - name: build, walk the stack, then the whole live Playwright run
        # Own project name and host ports: this job and `compose` share the
        # runner's Docker daemon, and a fixed 18080 made one fail with "port
        # is already allocated" while the other held it.
        env:
          COMPOSE_FILES: "-f deploy/vogt.compose.yml -f deploy/engine.overlay.yml -f deploy/e2e.overlay.yml -f deploy/rust-core.overlay.yml"
          COMPOSE_PROJECT_NAME: vogt-rust-core-live-${{ github.run_id }}
          VOGT_IMAGE: vogt-core:rust
          VOGT_BIND_IP: 127.0.0.1
          ENGINE_BIND: 127.0.0.1
        run: |
          export VOGT_PORT="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')"
          export ENGINE_PORT="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')"
          export VOGT_PUBLIC_URL="http://127.0.0.1:${VOGT_PORT}"
          export ENGINE_PUBLIC_URL="http://127.0.0.1:${ENGINE_PORT}"
          set -euo pipefail
          docker build -t vogt-core:rust -f deploy/rust-core.Dockerfile .
          docker build -t vogt-engine:local -f engine/Dockerfile --build-arg CORE_IMAGE=vogt-core:rust .
          docker build -t vogt-engine-e2e:local -f deploy/e2e.engine.Dockerfile .
          docker build -t vogt-e2e-playwright:local -f deploy/e2e.playwright.Dockerfile .
          # Tokens go through the named volume, never a host file (see `compose`).
          export VOGT_CORE_TOKEN_VALUE="$(openssl rand -hex 32)"
          export ENGINE_TOKEN_VALUE="$(openssl rand -hex 32)"
          export ENGINE_TOKEN="$ENGINE_TOKEN_VALUE"
          # shellcheck disable=SC2086
          docker compose $COMPOSE_FILES up -d
          trap 'docker compose $COMPOSE_FILES down -v || true' EXIT
          ok=""
          for _ in $(seq 1 60); do
            if docker compose $COMPOSE_FILES exec -T engine curl -fsS http://vogt:8000/health/ready >/dev/null 2>&1; then
              ok=yes; break
            fi
            sleep 5
          done
          test -n "$ok" || { docker compose $COMPOSE_FILES logs --tail=200; exit 1; }
          front=""
          for _ in $(seq 1 60); do
            if docker compose $COMPOSE_FILES exec -T engine curl -fsS http://127.0.0.1:8910/healthz >/dev/null 2>&1; then
              front=yes; break
            fi
            sleep 5
          done
          test -n "$front" || { docker compose $COMPOSE_FILES logs --tail=200; exit 1; }
          docker compose $COMPOSE_FILES exec -T engine mkdir -p /tmp/e2e/scripts /tmp/e2e/tests/fixtures
          docker compose $COMPOSE_FILES cp scripts/e2e_stack_smoke.sh engine:/tmp/e2e/scripts/e2e_stack_smoke.sh
          # No VOGT_SMOKE_TOKEN, for the reason given in `compose`.
          docker compose $COMPOSE_FILES exec -T engine \
            bash /tmp/e2e/scripts/e2e_stack_smoke.sh http://localhost:8910
          # Required: the specs that pass on the Rust core today. Operator
          # decision, 2026-10-17: the rest of the live suite is advisory until
          # its fixtures are fixed. Those specs fail on main's Python core too.
          docker compose $COMPOSE_FILES --profile live run --rm -T \
            -e PLAYWRIGHT_LIVE_TOKEN="$ENGINE_TOKEN" playwright \
            -g "Login and authentication errors present|stale provenance cannot activate demo mode|terminal replay budget \(live acceptance\)"
          # Advisory: every other live spec. Printed, not fatal.
          docker compose $COMPOSE_FILES --profile live run --rm -T \
            -e PLAYWRIGHT_LIVE_TOKEN="$ENGINE_TOKEN" playwright \
            || echo "advisory: the rest of the live suite failed against the Rust core (tracked as a follow-up)"

  parity:
    name: parity
    # Proves the harness against both cores. The Rust binary is built in this
    # job, because the rust job runs on a different runner and its target
    # directory is not here.
    runs-on: [self-hosted]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.11.23"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: engine

      - name: build vogt-core
        working-directory: engine
        run: cargo build -p vogt-core

      - name: record then check the Python core
        run: |
          set -euo pipefail
          uv sync --locked --group dev
          export VOGT_PARITY_PYTHON_BIN="$PWD/.venv/bin/vogt"
          uv run python scripts/parity.py record --impl python --out "$RUNNER_TEMP/golden"
          uv run python scripts/parity.py record --impl python --out "$RUNNER_TEMP/again"
          diff -q "$RUNNER_TEMP/golden/cli.json" "$RUNNER_TEMP/again/cli.json"
          diff -q "$RUNNER_TEMP/golden/audit.cli.json" "$RUNNER_TEMP/again/audit.cli.json"
          uv run python scripts/parity.py record --impl python --transport http --out "$RUNNER_TEMP/http"
          uv run python scripts/parity.py record --impl python --transport http --out "$RUNNER_TEMP/http-again"
          diff -q "$RUNNER_TEMP/http/http.json" "$RUNNER_TEMP/http-again/http.json"
          uv run python scripts/parity.py record --impl python --transport mcp --out "$RUNNER_TEMP/mcp"
          uv run python scripts/parity.py record --impl python --transport mcp --out "$RUNNER_TEMP/mcp-again"
          diff -q "$RUNNER_TEMP/mcp/mcp.json" "$RUNNER_TEMP/mcp-again/mcp.json"
          # Against the committed golden, not the recording just made: a
          # recording that agrees with itself proves nothing about drift.
          # The golden is named for the main this branch was rebased onto, not
          # for whichever directory sorts last.
          base=$(git merge-base HEAD origin/main)
          golden="tests/parity/golden/${base:0:7}"
          test -d "$golden" || { echo "no golden for $base" >&2; exit 1; }
          uv run python scripts/parity.py check --impl python --golden "$golden"
          uv run python scripts/parity.py check --impl python --transport http --golden "$golden"
          uv run python scripts/parity.py check --impl python --transport mcp --golden "$golden"
          VOGT_PARITY_RUST_BIN="$GITHUB_WORKSPACE/engine/target/debug/vogt-core" \
            uv run python scripts/parity.py check --impl rust --transport http --golden "$golden"
          VOGT_PARITY_RUST_BIN="$GITHUB_WORKSPACE/engine/target/debug/vogt-core" \
            uv run python scripts/parity.py check --impl rust --transport mcp --golden "$golden"
          VOGT_PARITY_RUST_BIN="$GITHUB_WORKSPACE/engine/target/debug/vogt-core" \
            uv run python scripts/parity.py check --impl rust --golden "$golden" --only dump
          uv run python scripts/parity.py check --impl python --golden "$golden" --only actor
          uv run python scripts/parity.py selftest --golden "$golden"
          # The typed-error table is derived from the goldens, never edited.
          uv run python scripts/parity.py errors --golden "$golden" --check
          # The recursive --help tree, CONFIG.md and config.example.toml.
          uv run python scripts/parity.py contract --impl python
          VOGT_PARITY_RUST_BIN="$GITHUB_WORKSPACE/engine/target/debug/vogt-core" \
            uv run python scripts/parity.py contract --impl rust

      - name: registry matches the Python source
        # The Rust registry and its golden are generated. This fails the
        # moment operations.py changes without a regeneration, instead of
        # waiting for the next review to notice the drift.
        run: uv run python scripts/gen_registry.py --check

      - name: validator corpus matches pydantic
        # The corpus is pydantic's own verdict on every probe. This fails the
        # moment a model changes what pydantic accepts or how it refuses,
        # instead of the Rust test comparing against a stale recording.
        run: uv run python scripts/gen_validator_corpus.py --check

      - name: drift ledger (report only)
        run: uv run python scripts/drift_ledger.py

  coverage:
    name: line coverage >= 80%
    # The Python gate was pytest --cov-fail-under=80, and this floor matches
    # it. Measured line coverage of engine/core is 80.22% (the whole crate,
    # tests included, at rust-core a5ac4cba; WI-1080). It only moves up.
    # See docs/PYTHON_TEST_DISPOSITION.md.
    runs-on: [self-hosted, bigmem]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: engine

      - name: install cargo-llvm-cov
        # Pinned. A floating install would make the floor depend on whichever
        # release crates.io served that morning.
        run: cargo install cargo-llvm-cov --version 0.6.16 --locked

      - name: line coverage
        working-directory: engine
        run: cargo llvm-cov -p vogt-core --fail-under-lines 80
