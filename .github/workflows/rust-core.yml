name: rust-core

# Gate for the long-lived `rust-core` branch, where the Python core is being
# ported into engine/core. Main's CI does not run on this branch; this
# workflow does not run on main. The parity job is a placeholder until the
# black-box harness (P0.3) exists.

on:
  push:
    branches: [rust-core]
  pull_request:
    branches: [rust-core]
  workflow_dispatch:

concurrency:
  group: rust-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: fmt, clippy, test
    # `bigmem` is node-b-gha-public-bigmem, the same runner CodeQL uses for
    # the Rust analysis. A label no online runner advertises queues forever.
    runs-on: [self-hosted, bigmem]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The bigmem runner is a bare self-hosted image; cargo arrives here, the
      # same way ci.yml's engine job gets it.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: engine

      - name: cargo fmt
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: engine
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (vogt-core)
        working-directory: engine
        run: cargo test -p vogt-core

  parity:
    name: parity
    # Proves the harness against the Python core. The Rust side joins once
    # vogt-core can serve the script; until then a missing Rust binary is not
    # a failure of this job.
    runs-on: [self-hosted]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.11.23"

      - name: record then check the Python core
        run: |
          set -euo pipefail
          uv sync --locked --group dev
          export VOGT_PARITY_PYTHON_BIN="$PWD/.venv/bin/vogt"
          uv run python scripts/parity.py record --impl python --out "$RUNNER_TEMP/golden"
          uv run python scripts/parity.py record --impl python --out "$RUNNER_TEMP/again"
          diff -q "$RUNNER_TEMP/golden/cli.json" "$RUNNER_TEMP/again/cli.json"
          uv run python scripts/parity.py check --impl python --golden "$RUNNER_TEMP/golden"
          uv run python scripts/parity.py check --impl python --golden "$RUNNER_TEMP/golden" --only actor
