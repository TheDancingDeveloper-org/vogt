# Release dry run (WI-2073).
#
# `release.yml` only ever runs on a `v*` tag, so until this existed a tag was
# the first time the release path had ever been executed: a broken Dockerfile,
# a version gate that no longer matches the manifests, or a policy check that
# reads the wrong file would be discovered by cutting the release.
#
# This runs the same inputs without publishing anything: no registry login, no
# `packages: write`, no secrets, no `push`, no tag, no GitHub Release. It reads
# only the repository, so it is safe on a pull request and cheap enough to run
# nightly on `main`.
#
# What it proves, per job:
#   * `policy` — the version manifests agree, and the workflow rules the
#     release ships with (timeouts, pinned actions, required-check producers)
#     still hold.
#   * `build`  — the two images `build.yml` publishes can be built from this
#     tree: the core from the root `Dockerfile`, then the merged stack from
#     `engine/Dockerfile` on top of that local core. Both are tagged locally
#     and never pushed.
#
# Deliberately absent: `docker/login-action`, `docker/build-push-action`,
# `secrets.`, `id-token`, `cosign`, `imagetools create`, and `push: true`.
# `tests/test_release_workflow.py` pins that absence.

name: release dry run

on:
  pull_request:
    # A release is only as good as the files it is built from. These are the
    # ones a release run reads: the workflows around it, the Dockerfiles that
    # produce the images, the manifests that name the version, and the
    # deployment/bake inputs.
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-dry-run.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/pod-base.yml"
      - ".github/workflows/mirror-base-images.yml"
      - "Dockerfile"
      - "engine/Dockerfile"
      - "engine/Dockerfile.pod"
      - ".dockerignore"
      - "engine/Dockerfile.dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/check_product_version.py"
      - "scripts/check_workflow_policy.py"
      - "tests/test_release_workflow.py"
      - "tests/test_check_workflow_policy.py"
      - "deploy/stack.compose.yml"
      - ".github/stack-bake.hcl"
  # Nightly on the default branch: a change that lands without touching the
  # files above (a base image moving, a dependency of the Dockerfile) still
  # gets the release path exercised before the next tag.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: release policy and version gates
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked

      # The tests that pin the release's shape (build once, promote by digest)
      # and the workflow rules it depends on.
      - name: release and workflow-policy tests
        run: uv run --no-sync pytest tests/test_release_workflow.py tests/test_check_workflow_policy.py --no-cov

      - name: workflow policy holds
        run: python3 scripts/check_workflow_policy.py --root .

      # No tag is passed: this asserts the manifests agree with each other.
      # `release.yml` additionally passes the tag, which is the one thing a
      # dry run cannot know.
      - name: manifests carry one product version
        run: python3 scripts/check_product_version.py

  build:
    name: build the release images (no publish)
    runs-on: [self-hosted, docker]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Same core, same build arguments as `build.yml`; the only difference is
      # that the output stays in the runner's local image store.
      - name: build the core
        run: docker build -f Dockerfile -t vogt-dry-run-core .

      # The merged image is what `deploy/stack.compose.yml` runs. CORE_IMAGE
      # points at the image just built, so the stack is exercised against this
      # tree rather than a published core.
      - name: build the merged stack
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker build -f engine/Dockerfile \
            --build-arg CORE_IMAGE=vogt-dry-run-core \
            --build-arg VOGT_SOURCE_SHA="${GITHUB_SHA}" \
            --build-arg VOGT_SOURCE_REF="${GITHUB_REF_NAME}" \
            --build-arg VOGT_PRODUCT_VERSION=dry-run \
            -t vogt-dry-run-stack .

      # The same reason `build.yml` starts what it publishes: two releases
      # shipped images that had never been run. Both halves are asked here.
      - name: both halves start
        run: |
          set -euo pipefail
          docker run --rm --entrypoint vogt vogt-dry-run-stack --version
          docker run --rm --entrypoint vogt-engine vogt-dry-run-stack --help >/dev/null
          echo "core and engine start from the dry-run images"
