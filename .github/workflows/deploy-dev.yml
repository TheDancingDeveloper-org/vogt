name: deploy dev

# Dev deployment is deliberately separate from release generation. This job
# verifies the signed commit images, updates the existing Komodo GitOps stack,
# deploys it, and records live validation. No GitHub App, release tag, or
# GitHub Release is involved.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit currently at dev
        required: true
        type: string
      confirm:
        description: Type DEPLOY-DEV to confirm the dev deployment
        required: true
        type: string
      public_url:
        description: >-
          Optional override for the live-smoke base URL. Leave blank to use the
          VOGT_DEV_SMOKE_URL repository variable, which must name an address the
          self-hosted runner can reach (the dev front door resolves to a
          LAN-only IP, so a tailnet address is required here).
        required: false
        type: string

      expect_agent_clis:
        description: >-
          Optional acceptance: comma-separated tool=version pairs the live pod
          must report as active, e.g. codex=0.153.4,claude-code=2.1.261. The
          run fails when the pod reports anything else.
        required: false
        default: ""
      repair_environment:
        description: >-
          Diagnostics and repair, no deploy unless "apply". "inspect" prints
          what Komodo knows about the stack (info, environment keys, rendered
          compose keys and mounts, last update's stages, engine log tail) and
          exits. "dry-run" prints the keys-only shape a structural repair of a
          collapsed environment (the 2026-09-05 one-line .env) would write;
          "apply" writes it and then deploys. Leave blank for a normal deploy.
        required: false
        type: string

permissions:
  contents: read
  packages: read

env:
  # Estate addresses and stack identities are operator configuration, not
  # public workflow defaults. Configure these repository variables before
  # dispatching the workflow.
  KOMODO_URL: ${{ vars.VOGT_KOMODO_URL }}
  KOMODO_STACK: ${{ vars.VOGT_KOMODO_STACK }}

jobs:
  deploy:
    name: deploy and validate the signed dev image
    # The job builds and inspects images locally, so it must land on a
    # runner advertising the Docker capability as well as tailnet access.
    runs-on: [self-hosted, tailnet, docker]
    environment: vogt-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: validate the exact dev commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = DEPLOY-DEV ] || { echo "Type DEPLOY-DEV to continue" >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be a full commit SHA" >&2; exit 1; }
          git fetch --no-tags origin "+refs/heads/dev:refs/remotes/origin/dev"
          [ "$SOURCE_SHA" = "$(git rev-parse origin/dev)" ] || {
            echo "source_sha is not the current dev commit" >&2; exit 1;
          }

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac

      - name: resolve and verify both signed dev images
        id: images
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          resolve() {
            local image="$1"
            local digest
            digest="$(docker buildx imagetools inspect "${image}:dev-${SOURCE_SHA}" --format '{{.Manifest.Digest}}')"
            case "$digest" in sha256:*) ;; *) echo "invalid image digest: $digest" >&2; exit 1;; esac
            printf '%s\n' "$digest"
          }
          core_digest="$(resolve ghcr.io/thedancingdeveloper-org/vogt)"
          # `-estate`: the dev stack publishes to the private estate package,
          # not the public `vogt-stack`. The public one carries the generic AIO
          # and has no `dev-<sha>` tags at all, so resolving it here would fail
          # — or, worse, succeed against some unrelated tag and deploy the
          # wrong image to vogt-dev.
          stack_digest="$(resolve ghcr.io/thedancingdeveloper-org/vogt-stack-estate)"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/TheDancingDeveloper-org/vogt/.github/workflows/build.yml@refs/heads/dev$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/thedancingdeveloper-org/vogt@${core_digest}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/TheDancingDeveloper-org/vogt/.github/workflows/build.yml@refs/heads/dev$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/thedancingdeveloper-org/vogt-stack-estate@${stack_digest}"
          {
            echo "core_digest=$core_digest"
            echo "stack_digest=$stack_digest"
          } >> "$GITHUB_OUTPUT"

      - name: update desired state and deploy Komodo
        id: komodo
        # The Komodo deployment-controller credential is a plain pair of GitHub
        # Actions secrets — no secret broker, no CLI, and no GitHub App. Any
        # operator or fork configures KOMODO_API_KEY and KOMODO_API_SECRET
        # (repository or `vogt-dev` environment secrets); the generic pipeline
        # then runs on any self-hosted runner without an estate-specific tool.
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CORE_DIGEST: ${{ steps.images.outputs.core_digest }}
          STACK_DIGEST: ${{ steps.images.outputs.stack_digest }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          REPAIR_ENVIRONMENT: ${{ inputs.repair_environment }}
          # The dev stack stores its front-door token as an
          # `[[infisical://…]]` reference that Komodo resolves out of band;
          # GetStack returns the raw template, so deploy_dev.py resolves it
          # against Infisical to hand the smoke a real bearer token. The URL
          # must be reachable from the runner (like VOGT_KOMODO_URL); the
          # machine identity is a pair of repository secrets.
          INFISICAL_API_URL: ${{ vars.INFISICAL_API_URL }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          : "${KOMODO_API_KEY:?Set the KOMODO_API_KEY GitHub Actions secret}"
          : "${KOMODO_API_SECRET:?Set the KOMODO_API_SECRET GitHub Actions secret}"
          python3 scripts/deploy_dev.py

      - name: run the live dev smoke contract
        # The dev front door resolves to a LAN-only IP the tailnet runner cannot
        # route to, so the smoke base must be a runner-reachable address. It
        # comes from the VOGT_DEV_SMOKE_URL repository variable (operator
        # configuration, like VOGT_KOMODO_URL), overridable per-dispatch via the
        # public_url input.
        env:
          VOGT_SMOKE_BASE: ${{ inputs.public_url || vars.VOGT_DEV_SMOKE_URL }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECT_AGENT_CLIS: ${{ inputs.expect_agent_clis }}
        run: |
          set -euo pipefail
          : "${VOGT_SMOKE_BASE:?Set the VOGT_DEV_SMOKE_URL repository variable or pass public_url}"
          smoke_token="$(cat "$RUNNER_TEMP/vogt-dev-smoke-token")"
          test -n "$smoke_token"
          trap 'rm -f -- "$RUNNER_TEMP/vogt-dev-smoke-token"' EXIT
          # Komodo recreates the stack's containers on every deploy, so each
          # run pays the merged image's full cold start — a fresh pull of the
          # heavy core+engine+PWA+agent-CLI image plus its init. That was
          # observed to exceed the previous 300s window (the stack answered
          # /healthz only just after the loop gave up). The loop exits the
          # instant smoke passes, so a larger ceiling only bounds a genuinely
          # stuck deploy.
          smoke_deadline=$((SECONDS + 900))
          until VOGT_SMOKE_TOKEN="$smoke_token" bash scripts/smoke_merged_stack.sh; do
            if (( SECONDS >= smoke_deadline )); then
              echo "live dev stack did not become healthy within 900 seconds" >&2
              exit 1
            fi
            sleep 10
          done
          VOGT_SMOKE_TOKEN="$smoke_token" python3 - "$VOGT_SMOKE_BASE" "$SOURCE_SHA" <<'PY'
          from __future__ import annotations

          import json
          import os
          import sys
          import uuid
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base, source_sha = sys.argv[1].rstrip("/"), sys.argv[2]
          token = os.environ["VOGT_SMOKE_TOKEN"]

          def call(path: str, method: str = "GET", body: dict[str, object] | None = None) -> dict[str, object]:
              payload = None if body is None else json.dumps(body).encode("utf-8")
              request = Request(
                  f"{base}{path}",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
                  method=method,
              )
              try:
                  with urlopen(request, timeout=20) as response:  # noqa: S310
                      value = json.load(response)
              except (HTTPError, URLError, TimeoutError) as exc:
                  raise SystemExit(f"live smoke request failed: {path}: {exc}") from exc
              if not isinstance(value, dict):
                  raise SystemExit(f"live smoke response was not an object: {path}")
              return value

          config = call("/api/config")
          if config.get("source_sha") != source_sha:
              raise SystemExit("live source SHA does not match the deployed commit")
          if not config.get("product_version"):
              raise SystemExit("live deployment did not report product_version")
          # Which agent CLIs the pod actually runs (vogt #590): the pins are
          # applied at container start, so this is the only place they can be
          # accepted. Versions only — nothing here is a secret.
          clis = call("/api/agent-clis")
          tools = clis.get("tools")
          if not isinstance(tools, list) or not tools:
              raise SystemExit("live deployment did not report its agent CLIs")
          active: dict[str, object] = {}
          for tool in tools:
              if not isinstance(tool, dict) or not isinstance(tool.get("tool"), str):
                  raise SystemExit("live agent CLI report entry was malformed")
              active[tool["tool"]] = tool.get("active_version")
              print(
                  f"agent cli {tool['tool']}: active={tool.get('active_version')} "
                  f"baked={tool.get('baked_version')} source={tool.get('source')}"
              )
          expected = os.environ.get("EXPECT_AGENT_CLIS", "").strip()
          for pair in filter(None, (part.strip() for part in expected.split(","))):
              name, _, version = pair.partition("=")
              if not name or not version:
                  raise SystemExit(f"malformed expect_agent_clis entry: {pair!r}")
              if active.get(name) != version:
                  raise SystemExit(
                      f"live pod reports {name} {active.get(name)!r}; expected {version}"
                  )
          if expected:
              print(f"agent CLI acceptance passed: {expected}")
          status = call("/api/vogt/status")
          if not status:
              raise SystemExit("live status response was empty")
          marker = f"dev-deploy-smoke-{uuid.uuid4().hex[:12]}"
          work = call(
              "/api/vogt/work",
              "POST",
              {
                  "kind": "chore",
                  "title": f"{marker} live validation",
                  "priority": "p2",
                  "reason": "verified dev deployment",
              },
          )
          if not isinstance(work.get("item"), dict):
              raise SystemExit("live core write returned no work item")
          session = call(
              "/api/sessions",
              "POST",
              {"name": marker, "command": ["/bin/true"]},
          )
          if not session.get("id"):
              raise SystemExit("live engine front door returned no session id")
          print("live source SHA, product version, auth, core write, and engine front door verified")
          PY

      - name: write the verified dev deployment receipt
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CORE_DIGEST: ${{ steps.images.outputs.core_digest }}
          STACK_DIGEST: ${{ steps.images.outputs.stack_digest }}
          DEPLOYMENT_ID: ${{ steps.komodo.outputs.deployment_id }}
          DESIRED_STATE_COMMIT: ${{ steps.komodo.outputs.desired_state_commit }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vogt-dev-receipt"
          python3 - "$RUNNER_TEMP/vogt-dev-receipt/receipt.json" <<'PY'
          from __future__ import annotations

          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              "source_repository": "TheDancingDeveloper-org/vogt",
              "source_sha": os.environ["SOURCE_SHA"],
              "environment": "dev",
              "image_digest": os.environ["STACK_DIGEST"],
              "deployment_id": os.environ["DEPLOYMENT_ID"],
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "live_smoke": {
                  "status": "passed",
                  "readiness": "passed",
                  "authentication": "passed",
                  "core_write": "passed",
                  "engine_front_door": "passed",
                  "product_version": "passed",
              },
          }
          Path(sys.argv[1]).write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          PY
          cp "$RUNNER_TEMP/vogt-dev-receipt/receipt.json" "$RUNNER_TEMP/vogt-dev-receipt/receipt-${SOURCE_SHA}.json"
          {
            echo "### Verified dev deployment"
            echo
            echo "- source: \`$SOURCE_SHA\`"
            echo "- core image: \`ghcr.io/thedancingdeveloper-org/vogt@$CORE_DIGEST\`"
            echo "- merged image: \`ghcr.io/thedancingdeveloper-org/vogt-stack-estate@$STACK_DIGEST\`"
            echo "- desired-state commit: \`$DESIRED_STATE_COMMIT\`"
            echo "- Komodo update: \`$DEPLOYMENT_ID\`"
            echo "- no release tag or GitHub Release was created"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vogt-dev-deployment-receipt-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/vogt-dev-receipt/receipt-${{ inputs.source_sha }}.json
          retention-days: 400
