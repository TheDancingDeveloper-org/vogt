name: release

# Tag-triggered only: a push to main can never publish a release. And
# publishing is not deploying: this workflow promotes signed images; a
# deployment moves only when its operator pins the published digest
# (docs/DEPLOYMENT.md).
#
# ── Build once, promote by digest ─────────────────────────────────────────
#
# A release does NOT build images. `build.yml` builds, smoke-tests, signs and
# publishes `vogt`, `vogt-stack` and `vogt-voice` once, for the commit on
# `main`, tagged `sha-<7-char commit>`, with the product version already baked
# from the bump on `main`. The dev lane deploys and validates exactly those
# digests. Tagging `vX.Y.Z` on that commit then makes this workflow:
#
#   1. prove the tag is on main and names the version the source carries;
#   2. prove `build.yml` ran for this commit on main and its three image jobs
#      succeeded, resolve each `sha-<commit>` tag to its digest, and verify
#      the digest carries build.yml's own signature for this exact commit plus
#      its SBOM and provenance attestations — anything missing FAILS the
#      release; nothing is ever rebuilt as a fallback;
#   3. retag those digests `X.Y.Z`, `X.Y` and `latest` with
#      `docker buildx imagetools create --prefer-index=false` (a registry-side
#      copy of the original manifest bytes: no pull, no rebuild, no new index,
#      so the digest is unchanged — and every new tag is asserted to resolve
#      to it);
#   4. sign the same digests keylessly under THIS workflow's identity
#      (`release.yml@refs/tags/v*`), which is what deployments verify;
#   5. build and sign the Android shell (the app is not a container image, so
#      it is still built at tag time) and write the GitHub Release with a
#      machine-readable `vogt-release-manifest.json` naming the source sha and
#      every digest, so a deployment can match it against its dev receipt.
#
# There is no rebuild path, by design: a release that rebuilt would ship bytes
# the dev lane never ran. If build.yml did not publish the commit, re-run that
# build.yml run (or dispatch build.yml on main while the commit is its head)
# and re-run this workflow — see docs/DEPLOYMENT.md §9.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # The core alone — the verifiable build input of the product (the stack
  # image copies `/opt/vogt` out of it by digest), not the product. Promoted
  # and release-signed with the pair so the manifest records all three.
  # Nothing tells an operator to deploy it (DEPLOYMENT.md).
  IMAGE: ghcr.io/thedancingdeveloper-org/vogt
  # The product: core plus session engine, PWA and agent CLIs in one
  # container — the image `deploy/stack.compose.yml` runs. build.yml builds it
  # from the `lean` pod base with INSTALL_AI_CLIENTS=true and proves `claude`
  # and `codex` run, which is the shape every release has shipped since 0.5.0.
  STACK_IMAGE: ghcr.io/thedancingdeveloper-org/vogt-stack
  # The first-party voice sidecar, versioned in lockstep with the stack and
  # named by that version in `deploy/stack.compose.yml`.
  VOICE_IMAGE: ghcr.io/thedancingdeveloper-org/vogt-voice
  # build.yml's commit tag: docker/metadata-action `type=sha`, i.e. `sha-`
  # plus the first 7 characters of the commit. The digest is what is
  # promoted; this tag is only how it is found, and the build.yml signature
  # check below binds the digest to the full commit sha.
  BUILD_TAG_PREFIX: sha-
  BUILD_TAG_SHA_LENGTH: "7"

jobs:
  validate-release:
    name: the tag is on main
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The release tag and main can be far apart.  A shallow checkout
          # cannot prove ancestry and would turn this guard into a guess.
          fetch-depth: 0

      - name: the tagged commit is contained by main
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::Release tag $GITHUB_REF_NAME ($TAG_SHA) is not reachable from origin/main. Tag a commit that is on main."
            exit 1
          fi

  # The version gate: the tag, the package, the PWA and mobile manifests, and
  # the workflows all name one version. `check_product_version.py` also proves
  # build.yml at this commit baked this version (its VOGT_PRODUCT_VERSION) into
  # the images promoted below — the version is in the bytes, not in a tag.
  distribution:
    name: the version matches the tag
    needs: validate-release
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Exact pin: setup-uv stopped publishing major tags at v8, so
      # `@v9` does not resolve. Renovate bumps this line.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7

      - run: uv sync --locked

      - name: version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(uv run --no-sync python -c 'import vogt; print(vogt.__version__)')"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match vogt.__version__ ($version)"
            exit 1
          fi
          uv run --no-sync python scripts/check_product_version.py "${TAG#v}"

  # build.yml is the only thing that builds images, so a release starts by
  # proving it did so for this commit. Its run *conclusion* is deliberately not
  # the test: the run also builds the public demo image, whose Trivy scan can
  # fail on a stale base package without touching the three product images.
  # What must have succeeded is each job that publishes one of them, in the
  # latest attempt of some build.yml run for this exact commit on main.
  build-run:
    name: build.yml built this commit
    needs: validate-release
    runs-on: [self-hosted]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      run_url: ${{ steps.find.outputs.run_url }}
    steps:
      - id: find
        name: find a build.yml run whose image jobs all succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_SHA: ${{ github.sha }}
          # The `name:` of build.yml's three publishing jobs. tests/
          # test_release_workflow.py fails if build.yml renames one.
          REQUIRED_JOBS: |
            build and publish a commit image
            build and publish the voice sidecar
            build and publish the merged image
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          get() {
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$1"
          }
          runs="$(get "${api}/actions/workflows/build.yml/runs?head_sha=${TAG_SHA}&branch=main&per_page=50")"
          ids="$(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' <<<"$runs")"
          if [ -z "$ids" ]; then
            echo "::error::build.yml never ran for ${TAG_SHA} on main, so there are no images to promote and nothing is rebuilt. A docs-only commit is skipped by build.yml's paths-ignore, and a superseded push is cancelled before it starts. Tag the commit build.yml built (normally the version bump), or dispatch build.yml on main while ${TAG_SHA} is its head, then re-run this workflow."
            exit 1
          fi
          for id in $ids; do
            jobs="$(get "${api}/actions/runs/${id}/jobs?filter=latest&per_page=100")"
            missing=""
            while IFS= read -r job; do
              [ -n "$job" ] || continue
              conclusion="$(jq -r --arg n "$job" '[.jobs[] | select(.name == $n) | .conclusion][0] // "absent"' <<<"$jobs")"
              if [ "$conclusion" != "success" ]; then
                missing="${missing}  - ${job}: ${conclusion}"$'\n'
              fi
            done <<<"$REQUIRED_JOBS"
            url="$(jq -r --argjson id "$id" '.workflow_runs[] | select(.id == $id) | .html_url' <<<"$runs")"
            if [ -z "$missing" ]; then
              echo "build.yml run ${url} published all three images for ${TAG_SHA}"
              echo "run_id=${id}" >> "$GITHUB_OUTPUT"
              echo "run_url=${url}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf 'build.yml run %s did not publish every image:\n%s' "$url" "$missing"
          done
          echo "::error::No build.yml run for ${TAG_SHA} on main published all three images (see above). Nothing is rebuilt here: re-run the failed build.yml jobs (gh run rerun <id> --failed) and then re-run this workflow."
          exit 1

  # The promotion itself: resolve, verify, retag, release-sign. One job, so
  # the three digests leave it together and a partial promotion is visible as
  # one red job rather than three half-done ones.
  promote:
    name: promote the built images by digest
    needs: [distribution, build-run]
    # `publish` is advertised only by the Docker-in-Docker workers, which
    # carry the buildx CLI plugin `imagetools` needs.
    runs-on: [self-hosted, publish]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless signing: the workflow's own OIDC identity is the signer, so
      # there is no key to store or rotate and the signature binds to this
      # repository, this workflow and this tag.
      id-token: write
    outputs:
      core: ${{ steps.resolve.outputs.core }}
      stack: ${{ steps.resolve.outputs.stack }}
      voice: ${{ steps.resolve.outputs.voice }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - id: tags
        name: the semver tags this release moves
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx version
          version="${TAG#v}"
          # docker/metadata-action's semver rules, which the release followed
          # when it built: a pre-release gets only its exact version — no
          # `X.Y`, and `latest` does not move.
          if [[ "$version" == *-* ]]; then
            tags="$version"
          else
            tags="$version ${version%.*} latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "will tag: ${tags}"

      - id: resolve
        name: resolve and verify build.yml's digests for this commit
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          build_tag="${BUILD_TAG_PREFIX}${TAG_SHA:0:${BUILD_TAG_SHA_LENGTH}}"
          # Only build.yml, on main, at exactly this commit, may have signed
          # what is promoted. The workflow-sha extension in the Fulcio
          # certificate is what ties the digest to the full commit, not the
          # short tag it was found by.
          build_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@refs/heads/main"
          fail=""
          for pair in "core=${IMAGE}" "stack=${STACK_IMAGE}" "voice=${VOICE_IMAGE}"; do
            name="${pair%%=*}"; repo="${pair#*=}"
            ref="${repo}:${build_tag}"
            err="${RUNNER_TEMP}/inspect-${name}.err"
            if ! manifest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>"$err")"; then
              echo "::error::${name}: ${ref} is not in the registry — build.yml did not publish this commit. Nothing is rebuilt. ($(tr '\n' ' ' <"$err"))"
              fail=1; continue
            fi
            digest="$(jq -r '.digest // empty' <<<"$manifest")"
            case "$digest" in
              sha256:*) ;;
              *) echo "::error::${name}: could not read a digest for ${ref}"; fail=1; continue ;;
            esac
            if ! cosign verify \
                --certificate-identity "$build_identity" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-github-workflow-sha "$TAG_SHA" \
                "${repo}@${digest}" >/dev/null; then
              echo "::error::${name}: ${repo}@${digest} carries no build.yml signature for ${TAG_SHA}; refusing to promote it."
              fail=1; continue
            fi
            # build.yml pushes with `provenance: true` and `sbom: true`, so the
            # attestations live in the image index beside the image and travel
            # with the digest. A release has always carried both; a digest
            # without them is not promoted.
            for kind in SBOM Provenance; do
              att="$(docker buildx imagetools inspect "${repo}@${digest}" --format "{{json .${kind}}}" 2>/dev/null || true)"
              case "$att" in
                ""|null|"{}") echo "::error::${name}: ${repo}@${digest} has no ${kind} attestation"; fail=1 ;;
              esac
            done
            echo "${name}=${digest}" >> "$GITHUB_OUTPUT"
            echo "${name}: ${ref} -> ${repo}@${digest} (build.yml-signed for ${TAG_SHA})"
          done
          if [ -n "$fail" ]; then
            echo "the build for ${TAG_SHA} cannot be promoted — see the errors above" >&2
            exit 1
          fi

      - name: retag by digest
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          CORE_DIGEST: ${{ steps.resolve.outputs.core }}
          STACK_DIGEST: ${{ steps.resolve.outputs.stack }}
          VOICE_DIGEST: ${{ steps.resolve.outputs.voice }}
        run: |
          set -euo pipefail
          for pair in "${IMAGE}@${CORE_DIGEST}" "${STACK_IMAGE}@${STACK_DIGEST}" "${VOICE_IMAGE}@${VOICE_DIGEST}"; do
            repo="${pair%@*}"; digest="${pair#*@}"
            args=()
            for t in $TAGS; do args+=(-t "${repo}:${t}"); done
            # One source, no annotations and `--prefer-index=false`: buildx
            # pushes the source manifest's original bytes under the new tags,
            # registry side — it never wraps a single manifest in a new index
            # (which would be a new digest). No layer is pulled, nothing is
            # built.
            docker buildx imagetools create --prefer-index=false \
              "${args[@]}" "${repo}@${digest}"
            # Trust, but check: every new tag must name exactly the digest
            # build.yml published and the dev lane ran — the deployment's
            # promotion gate compares these digests exactly. Fail otherwise.
            for t in $TAGS; do
              got="$(docker buildx imagetools inspect "${repo}:${t}" --format '{{json .Manifest}}' | jq -r .digest)"
              if [ "$got" != "$digest" ]; then
                echo "::error::${repo}:${t} resolves to ${got}, not the promoted ${digest}"
                exit 1
              fi
            done
            echo "${repo}: ${TAGS} -> ${digest}"
          done

      - name: sign the same digests as the release
        env:
          CORE_DIGEST: ${{ steps.resolve.outputs.core }}
          STACK_DIGEST: ${{ steps.resolve.outputs.stack }}
          VOICE_DIGEST: ${{ steps.resolve.outputs.voice }}
        run: |
          set -euo pipefail
          # The digest, never a tag: a tag can be moved after signing, and a
          # signature over a movable reference proves nothing. This adds the
          # release.yml@refs/tags/v* signature beside build.yml's; deployments
          # verify the release identity (DEPLOYMENT.md §6).
          cosign sign --yes "${IMAGE}@${CORE_DIGEST}"
          cosign sign --yes "${STACK_IMAGE}@${STACK_DIGEST}"
          cosign sign --yes "${VOICE_IMAGE}@${VOICE_DIGEST}"

      - name: report what to pin
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          CORE_DIGEST: ${{ steps.resolve.outputs.core }}
          STACK_DIGEST: ${{ steps.resolve.outputs.stack }}
          VOICE_DIGEST: ${{ steps.resolve.outputs.voice }}
          BUILD_RUN: ${{ needs.build-run.outputs.run_url }}
        run: |
          {
            echo "## Promoted (built once by build.yml, not rebuilt)"
            echo
            echo "Built by ${BUILD_RUN}; tagged \`${TAGS}\` and release-signed:"
            echo
            echo '```'
            echo "VOGT_STACK_IMAGE=${STACK_IMAGE}@${STACK_DIGEST}"
            echo "VOGT_VOICE_IMAGE=${VOICE_IMAGE}@${VOICE_DIGEST}"
            echo "# build input, not a deployment target:"
            echo "${IMAGE}@${CORE_DIGEST}"
            echo '```'
            echo
            echo "Publishing is not deploying. See \`docs/DEPLOYMENT.md\` §2."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── The signed APK ───────────────────────────────────────────────
  #
  # A *release* job, not a per-push one, and that is the whole shape of the
  # decision: `ci.yml` builds a debug APK on every push to prove the shell
  # still assembles, and signing is what turns a build into something a person
  # installs. The two acts were conflated in the pipeline this replaced.
  #
  # **Inert until the keystore secrets exist.** A signing key is an app
  # identity: a new key is a different app, and Android refuses to upgrade an
  # installed one with it. Until the four `VOGT_ANDROID_KEY*` secrets are set
  # this job says which are missing and stops, rather than quietly shipping a
  # debug-signed artifact under a release tag.
  #
  # `mobile/android/app/build.gradle` reads all four from the environment and
  # only wires `signingConfigs.release` when every one is present, so nothing
  # here needs a Gradle change.
  #
  # The Firebase config and the keystore both arrive as plain GitHub Actions
  # secrets — no secret broker and no CLI — so the job runs on any self-hosted
  # runner and a fork can supply its own.
  android:
    name: build and sign the Android shell
    needs: distribution
    runs-on: [self-hosted]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - id: keystore
        name: is there a keystore
        env:
          KEYSTORE_B64: ${{ secrets.VOGT_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VOGT_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VOGT_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VOGT_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${KEYSTORE_B64:-}" ]      || missing="$missing VOGT_ANDROID_KEYSTORE_B64"
          [ -n "${KEYSTORE_PASSWORD:-}" ] || missing="$missing VOGT_ANDROID_KEYSTORE_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ]         || missing="$missing VOGT_ANDROID_KEY_ALIAS"
          [ -n "${KEY_PASSWORD:-}" ]      || missing="$missing VOGT_ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::No release keystore configured; missing:$missing. A new keystore is a different app identity and cannot upgrade an existing install."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: install the shell's dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: write the production Firebase config
        # The helper writes the secret without echoing it and verifies the
        # config carries the production Android client before Gradle trusts it.
        env:
          VOGT_FIREBASE_JSON: ${{ secrets.VOGT_FIREBASE_PROD_JSON }}
          VOGT_FIREBASE_OUTPUT: mobile/android/app/google-services.json
          VOGT_ANDROID_EXPECTED_PACKAGE: com.thedancingdeveloper.vogt
        run: bash scripts/write_firebase_config.sh

      - name: capacitor sync
        working-directory: mobile
        run: npx cap sync android

      - name: assemble and sign
        working-directory: mobile/android
        env:
          VOGT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VOGT_ANDROID_KEYSTORE_PASSWORD }}
          VOGT_ANDROID_KEY_ALIAS: ${{ secrets.VOGT_ANDROID_KEY_ALIAS }}
          VOGT_ANDROID_KEY_PASSWORD: ${{ secrets.VOGT_ANDROID_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.VOGT_ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          # Written under the runner's workspace and removed on the way out,
          # signed or not: a keystore left on a shared self-hosted runner is a
          # signing key anybody with a job on that runner can take.
          umask 077
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          trap 'rm -f "$keystore"' EXIT
          export VOGT_ANDROID_KEYSTORE_PATH="$keystore"
          ./gradlew assembleRelease --no-daemon

      - name: the artifact is actually signed
        working-directory: mobile/android
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$apk"
          # `apksigner` is in the SDK's build-tools. Verifying here rather than
          # trusting the build: Gradle silently produces an *unsigned* release
          # APK when the signing config is absent, which is the exact artefact
          # this job exists to stop being published under a release tag.
          verifier="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort | tail -1)"
          "$verifier" verify --print-certs "$apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vogt-android-release-${{ github.ref_name }}
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: remove Firebase config
        if: always()
        run: rm -f mobile/android/app/google-services.json


  # The stack and its voice sidecar are one release pair, with the core they
  # were built from. An independent read-back after promotion: every semver
  # tag of all three images resolves to the digest promoted (and therefore to
  # the one commit's build), so a deployment pinning `X.Y.Z` of each gets the
  # pair the dev lane ran together.
  release-pair:
    name: the stack and voice images are a matching pair
    needs: [validate-release, promote]
    runs-on: [self-hosted, publish]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: every release tag names the promoted digest
        env:
          TAG: ${{ github.ref_name }}
          TAGS: ${{ needs.promote.outputs.tags }}
          CORE_DIGEST: ${{ needs.promote.outputs.core }}
          STACK_DIGEST: ${{ needs.promote.outputs.stack }}
          VOICE_DIGEST: ${{ needs.promote.outputs.voice }}
        run: |
          set -euo pipefail
          case "$CORE_DIGEST:$STACK_DIGEST:$VOICE_DIGEST" in
            sha256:*:sha256:*:sha256:*) ;;
            *) echo "::error::release image digests are missing (core/stack/voice)" >&2; exit 1;;
          esac
          fail=""
          for pair in "core|${IMAGE}|${CORE_DIGEST}" "stack|${STACK_IMAGE}|${STACK_DIGEST}" "voice|${VOICE_IMAGE}|${VOICE_DIGEST}"; do
            IFS='|' read -r name repo digest <<<"$pair"
            for t in $TAGS; do
              got="$(docker buildx imagetools inspect "${repo}:${t}" --format '{{json .Manifest}}' | jq -r .digest)"
              if [ "$got" != "$digest" ]; then
                echo "::error::${name} ${repo}:${t} is ${got}, expected the promoted ${digest} (tag ${TAG})" >&2
                fail=1
              fi
            done
          done
          if [ -n "$fail" ]; then
            echo "the stack and voice images are not a matching release pair — see the errors above" >&2
            exit 1
          fi
          echo "core, stack and voice ${TAGS}: one commit's build, one release pair"

  github-release:
    name: create the durable GitHub Release
    needs: [validate-release, distribution, build-run, promote, android, release-pair]
    runs-on: [self-hosted]
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vogt-android-release-${{ github.ref_name }}
          path: release-assets/android

      - name: assemble release manifest and fail closed on missing assets
        env:
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          CORE_DIGEST: ${{ needs.promote.outputs.core }}
          STACK_DIGEST: ${{ needs.promote.outputs.stack }}
          VOICE_DIGEST: ${{ needs.promote.outputs.voice }}
          RELEASE_TAGS: ${{ needs.promote.outputs.tags }}
          BUILD_RUN_ID: ${{ needs.build-run.outputs.run_id }}
          BUILD_RUN_URL: ${{ needs.build-run.outputs.run_url }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          apk_count="$(find release-assets/android -type f -name '*.apk' | wc -l)"
          [ "$apk_count" -ge 1 ] || { echo "signed APK is required" >&2; exit 1; }
          # All three digests must be present: the stack and its voice sidecar
          # are one release pair, so a manifest missing the voice half
          # is not a complete release.
          case "$CORE_DIGEST:$STACK_DIGEST:$VOICE_DIGEST" in
            sha256:*:sha256:*:sha256:*) ;;
            *) echo "release image digests are missing (core/stack/voice)" >&2; exit 1;;
          esac
          [ -n "$BUILD_RUN_ID" ] || { echo "the build.yml run is unknown" >&2; exit 1; }
          build_tag="${BUILD_TAG_PREFIX}${SOURCE_SHA:0:${BUILD_TAG_SHA_LENGTH}}"
          mkdir -p release-assets/final
          find release-assets/android -type f -name '*.apk' -exec cp {} release-assets/final/ \;
          # Schema v1, extended additively: every v1 key keeps its meaning
          # (`images.*` is still `<repo>@<digest>`), so an existing consumer
          # reads it unchanged. The new keys say how the digests came to be —
          # built once by build.yml, promoted without a rebuild — so a
          # deployment can match `source_sha` and `image_digests` against the
          # receipt of the dev deploy that ran those exact digests.
          jq -n \
            --arg schema "vogt-release-manifest.v1" \
            --arg tag "$TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg core_repo "$IMAGE" \
            --arg stack_repo "$STACK_IMAGE" \
            --arg voice_repo "$VOICE_IMAGE" \
            --arg core_digest "$CORE_DIGEST" \
            --arg stack_digest "$STACK_DIGEST" \
            --arg voice_digest "$VOICE_DIGEST" \
            --arg tags "$RELEASE_TAGS" \
            --arg build_tag "$build_tag" \
            --arg build_run_id "$BUILD_RUN_ID" \
            --arg build_run_url "$BUILD_RUN_URL" \
            --arg release_run_url "$RELEASE_RUN_URL" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg guide "https://github.com/TheDancingDeveloper-org/vogt/blob/main/docs/DEPLOYMENT.md" \
            '{
              schema: $schema,
              product: "Vogt",
              product_version: ($tag | ltrimstr("v")),
              source_tag: $tag,
              source_sha: $source_sha,
              images: {
                core: "\($core_repo)@\($core_digest)",
                merged_stack: "\($stack_repo)@\($stack_digest)",
                voice: "\($voice_repo)@\($voice_digest)"
              },
              image_digests: {core: $core_digest, merged_stack: $stack_digest, voice: $voice_digest},
              image_repositories: {core: $core_repo, merged_stack: $stack_repo, voice: $voice_repo},
              release_tags: ($tags | split(" ") | map(select(length > 0))),
              promotion: {
                method: "build-once-promote-by-digest",
                rebuilt: false,
                build_workflow: ".github/workflows/build.yml",
                build_ref: "refs/heads/main",
                build_tag: $build_tag,
                build_run_id: ($build_run_id | tonumber),
                build_run_url: $build_run_url,
                release_run_url: $release_run_url
              },
              provenance: {
                cosign: "keyless signatures over the same digests from .github/workflows/release.yml (at release) and .github/workflows/build.yml (at build)",
                cosign_identities: {
                  release: "https://github.com/\($repository)/.github/workflows/release.yml@refs/tags/\($tag)",
                  build: "https://github.com/\($repository)/.github/workflows/build.yml@refs/heads/main"
                },
                cosign_issuer: "https://token.actions.githubusercontent.com",
                sbom: "BuildKit SBOM and provenance attestations recorded in each image index by build.yml, carried by the digest"
              },
              deployment_guide: $guide,
              assets: {android: "signed APK"}
            }' \
            > release-assets/final/vogt-release-manifest.json
          jq empty release-assets/final/vogt-release-manifest.json
          jq -r . release-assets/final/vogt-release-manifest.json > release-assets/release-notes.json

      - name: install GitHub CLI
        run: |
          set -euo pipefail
          command -v gh >/dev/null 2>&1 && exit 0
          if command -v apt-get >/dev/null 2>&1; then
            if [ "$(id -u)" -eq 0 ]; then
              apt-get update
              apt-get install -y --no-install-recommends gh
            else
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends gh
            fi
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache github-cli
          else
            echo "GitHub CLI is required on the release runner" >&2
            exit 1
          fi
          command -v gh >/dev/null 2>&1

      - name: create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          trap 'rm -f "$notes"' EXIT
          {
            echo 'Release metadata (machine-readable copy is attached as `vogt-release-manifest.json`):'
            echo
            echo '```json'
            cat release-assets/release-notes.json
            echo '```'
            echo
            echo "Publishing does not deploy production; deployment is a separate, operator-approved step."
          } > "$notes"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --notes-file "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "Vogt ${TAG#v}" --generate-notes --notes-file "$notes"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" release-assets/final/* --clobber
