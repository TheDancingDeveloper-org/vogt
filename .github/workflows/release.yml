name: release

# Tag-triggered only (NFR-C3): a push to main can never publish. And
# publishing is not deploying (NFR-D10): this workflow produces a signed
# image; production moves only when the pinned digest in `indexarr/ops`
# changes and `DeployStack` runs.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/thedancingdeveloper-org/vogt
  # The merged product — core plus session engine in one container. Released
  # alongside the core image because NFR-C6 says the build-vs-release
  # discipline governs *the merged image*, and a tag that produced only half
  # the product would leave the estate's own deployment with no versioned
  # artefact to roll back to.
  #
  # It is not the supported install of Vogt (NFR-PO4 — that is the image
  # above, and it is the one the wheel and the docs point at). This one
  # carries a development environment: agent CLIs, an Android SDK, Sway.
  # Published, versioned and signed; not recommended to anybody who wants
  # Vogt rather than this estate's pod.
  STACK_IMAGE: ghcr.io/thedancingdeveloper-org/vogt-stack
  # See `build.yml` for why the cache is a registry and not a builder-local
  # mount: `node-b` is a fleet, and a job lands on whichever worker is free.
  CACHE_IMAGE: ghcr.io/thedancingdeveloper-org/vogt-buildcache

jobs:
  # Docker Hub is not on the critical path (#33): both Dockerfiles build
  # `FROM` this organisation's GHCR mirror of the library images. This job
  # makes sure the mirror holds what this tag's Dockerfiles ask for before
  # either image job starts — a release is cut from whatever commit the tag
  # names, which may be older than the last scheduled mirror run and may
  # carry a base digest that was never copied.
  base-images:
    name: the bases are in GHCR
    uses: ./.github/workflows/mirror-base-images.yml
    permissions:
      contents: read
      packages: write

  distribution:
    name: build distribution
    runs-on: [self-hosted, node-b, linux, x64]
    steps:
      - uses: actions/checkout@v7

      # Exact pin: setup-uv stopped publishing major tags at v8, so
      # `@v9` does not resolve. Renovate bumps this line.
      - uses: astral-sh/setup-uv@v9.0.0

      - run: uv sync --locked

      - name: version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(uv run --no-sync python -c 'import vogt; print(vogt.__version__)')"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match vogt.__version__ ($version)"
            exit 1
          fi

      - run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: vogt-dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

  image:
    name: build, sign and publish the image
    needs: [distribution, base-images]
    # `docker`/`publish` is advertised only by the Docker-in-Docker workers.
    runs-on: [self-hosted, node-b, linux, x64, docker, publish]
    permissions:
      contents: read
      packages: write
      # Keyless signing: the workflow's own OIDC identity is the signer, so
      # there is no key to store or rotate and the signature binds to this
      # repository and this workflow (NFR-C5).
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # No Docker Hub login, deliberately — and this is a trap worth naming,
      # because the obvious "improvement" is to add one back.
      #
      # There used to be a login here, inert until `DOCKERHUB_USERNAME` was
      # set, offered as the remedy for builds failing at `FROM` with 429. The
      # secret was set, and the build 429'd anyway (#33):
      #
      #     AUTHENTICATED (sprooty):   HTTP 429  x-ratelimit-limit: 200;w=3600
      #     ANONYMOUS (runner egress): HTTP 200  x-ratelimit-limit: 100;w=3600
      #                                          x-ratelimit-remaining: 99
      #
      # The credential is estate-wide — the same one appears as
      # `HOMELAB_SECSCAN_DOCKERHUB_*` — so its 200/hour is shared with every
      # other project's CI and is empty exactly when the estate is busy,
      # which is when builds happen. Authenticating traded a bucket this
      # repository mostly controls for one it does not control at all. The
      # secrets were removed and the build succeeded anonymously.
      #
      # So this build does not reach Docker Hub at all. The bases are
      # `ghcr.io/thedancingdeveloper-org/vogt-base/*`, copied there by
      # `mirror-base-images.yml`, which the `base-images` job runs as a
      # prerequisite so a Renovate digest bump is mirrored before anything
      # builds from it. Adding a Docker Hub login back here would not help
      # anything and would put the estate's shared bucket back on this
      # repository's critical path.

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Built and *run* before it is pushed. v0.1.0 shipped an image whose
      # entrypoint did not exist — the venv was built at one path and copied
      # to another, so every container exited 255 in a restart loop. The
      # build was green, the signature was valid, and the artefact had never
      # been executed. A publish gate that only proves an image assembles
      # proves the wrong thing.
      # One build, pushed under a candidate tag and tested at its digest, then
      # promoted onto the release tags. See `build.yml` for the full note; the
      # property that matters more here than there is that what gets signed is
      # provably the bytes that were run, rather than a second build asserted
      # to be equivalent.
      #
      # `cache-from` only, and from `main`: a release is cut from a tag, it is
      # rare, and it has no later run to hand a cache to. It reads what main's
      # builds already deposited — the same `INSTALL_AI_CLIENTS=false` layer
      # graph — and writes nothing back.
      - uses: docker/build-push-action@v6
        id: candidate
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:candidate-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}:core-main

      - name: the image runs
        env:
          CANDIDATE: ${{ env.IMAGE }}@${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          # The entrypoint resolves and the interpreter behind it exists.
          docker run --rm "$CANDIDATE" --version
          # git is a runtime dependency: `project.import` and the `git-local`
          # collector both shell out to it. v0.2.0 released without it (#19).
          docker run --rm --entrypoint git "$CANDIDATE" --version
          # `serve` still refuses to invent a listen address (NFR-D2).
          if docker run --rm "$CANDIDATE" serve 2>/dev/null; then
            echo "serve started without being told where to listen" >&2
            exit 1
          fi
          echo "image runs, and still refuses to guess an address"

      # A manifest copy onto the tested digest — index, platform manifest and
      # both attestations — not a rebuild.
      - name: promote the tested image
        id: push
        env:
          TESTED: ${{ env.IMAGE }}@${{ steps.candidate.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            args+=(--tag "$tag")
          done <<< "$TAGS"
          # `imagetools create` with no --tag copies to a digest and publishes
          # nothing, so an empty tag list would leave a green job that shipped
          # no image. Fail where it is legible instead.
          [ "${#args[@]}" -gt 0 ] || {
            echo "metadata-action produced no tags; nothing to promote" >&2
            exit 1
          }
          docker buildx imagetools create "${args[@]}" "$TESTED"

          first="$(printf '%s\n' "$TAGS" | head -n1)"
          digest="$(docker buildx imagetools inspect "$first" \
            --format '{{.Manifest.Digest}}')"
          case "$digest" in
            sha256:*) ;;
            *) echo "could not resolve a digest for ${first}" >&2; exit 1 ;;
          esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3

      - name: sign the image and attest its SBOM
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # The digest, never a tag: a tag can be moved after signing, and a
          # signature over a movable reference proves nothing.
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: report what to pin
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Published"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Nothing has been deployed. Production moves when this digest"
            echo "is pinned in \`indexarr/ops\` at \`personal/vogt/docker-compose.yml\`"
            echo "and \`DeployStack\` runs for \`personal-vogt\` (NFR-D10)."
          } >> "$GITHUB_STEP_SUMMARY"

  # The dev-pod toolchain base, found already published in the ordinary case.
  # A release is `lean`: no Flutter, matching main and the `INSTALL_FLUTTER`
  # default this job has always built with.
  pod-base:
    name: the pod base is in GHCR
    needs: base-images
    uses: ./.github/workflows/pod-base.yml
    with:
      variant: lean
    permissions:
      contents: read
      packages: write

  stack-image:
    name: build, sign and publish the merged image
    needs: [distribution, base-images, pod-base]
    runs-on: [self-hosted, node-b, linux, x64, docker, publish]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # No `pnpm build` here any more. There was one, and its output never
      # reached the image: `engine/Dockerfile.dockerignore` lists `web/dist`,
      # so the runner's bundle was excluded from the build context, and the
      # one the image actually embeds is built by stage 1 of the Dockerfile.
      # See the same note in `build.yml`.

      # No Docker Hub login, deliberately — and this is a trap worth naming,
      # because the obvious "improvement" is to add one back.
      #
      # There used to be a login here, inert until `DOCKERHUB_USERNAME` was
      # set, offered as the remedy for builds failing at `FROM` with 429. The
      # secret was set, and the build 429'd anyway (#33):
      #
      #     AUTHENTICATED (sprooty):   HTTP 429  x-ratelimit-limit: 200;w=3600
      #     ANONYMOUS (runner egress): HTTP 200  x-ratelimit-limit: 100;w=3600
      #                                          x-ratelimit-remaining: 99
      #
      # The credential is estate-wide — the same one appears as
      # `HOMELAB_SECSCAN_DOCKERHUB_*` — so its 200/hour is shared with every
      # other project's CI and is empty exactly when the estate is busy,
      # which is when builds happen. Authenticating traded a bucket this
      # repository mostly controls for one it does not control at all. The
      # secrets were removed and the build succeeded anonymously.
      #
      # So this build does not reach Docker Hub at all. The bases are
      # `ghcr.io/thedancingdeveloper-org/vogt-base/*`, copied there by
      # `mirror-base-images.yml`, which the `base-images` job runs as a
      # prerequisite so a Renovate digest bump is mirrored before anything
      # builds from it. Adding a Docker Hub login back here would not help
      # anything and would put the estate's shared bucket back on this
      # repository's critical path.

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.STACK_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        id: candidate
        with:
          # The repository root: the Dockerfile reaches for `web/dist`,
          # `pyproject.toml` and `src/` as well as the crates.
          context: .
          file: engine/Dockerfile
          push: true
          tags: ${{ env.STACK_IMAGE }}:candidate-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            POD_BASE_IMAGE=${{ needs.pod-base.outputs.image }}
          # Reads main's cache, writes nothing back: see the core image above.
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}:stack-main

      - name: both halves run
        env:
          CANDIDATE: ${{ env.STACK_IMAGE }}@${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint vogt "$CANDIDATE" --version
          docker run --rm --entrypoint mydevenv2-server "$CANDIDATE" --help >/dev/null
          echo "both halves are present and start"

      # A manifest copy onto the tested digest, not a rebuild.
      - name: promote the tested image
        id: push
        env:
          TESTED: ${{ env.STACK_IMAGE }}@${{ steps.candidate.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            args+=(--tag "$tag")
          done <<< "$TAGS"
          # `imagetools create` with no --tag copies to a digest and publishes
          # nothing, so an empty tag list would leave a green job that shipped
          # no image. Fail where it is legible instead.
          [ "${#args[@]}" -gt 0 ] || {
            echo "metadata-action produced no tags; nothing to promote" >&2
            exit 1
          }
          docker buildx imagetools create "${args[@]}" "$TESTED"

          first="$(printf '%s\n' "$TAGS" | head -n1)"
          digest="$(docker buildx imagetools inspect "$first" \
            --format '{{.Manifest.Digest}}')"
          case "$digest" in
            sha256:*) ;;
            *) echo "could not resolve a digest for ${first}" >&2; exit 1 ;;
          esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3

      - name: sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${STACK_IMAGE}@${DIGEST}"

      - name: report what to pin
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Published (merged stack)"
            echo
            echo "\`deploy/vogt-stack.compose.yml\` pins:"
            echo
            echo '```yaml'
            echo "    image: ${STACK_IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Publishing is not deploying (NFR-D10). See"
            echo "\`docs/DEPLOYMENT.md\` §9 before the first one."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── The signed APK (NFR-C6) ───────────────────────────────────────────────
  #
  # A *release* job, not a per-push one, and that is the whole shape of the
  # decision: `ci.yml` builds a debug APK on every push to prove the shell
  # still assembles, and signing is what turns a build into something a person
  # installs. The two acts were conflated in the pipeline this replaced.
  #
  # **Inert until the keystore exists.** It lives in the forge the merge left
  # behind and recovering it is somebody's errand with a deadline attached —
  # when that forge goes, so does the ability to ship an upgrade to any device
  # already carrying this app, because a new key is a different app identity
  # and Android will refuse the upgrade. Until the four secrets are set this
  # job says which are missing and stops, rather than quietly shipping a
  # debug-signed artifact under a release tag.
  #
  # `mobile/android/app/build.gradle` already reads all four from the
  # environment and only wires `signingConfigs.release` when every one is
  # present, so nothing here needs a Gradle change.
  android:
    name: build and sign the Android shell
    needs: distribution
    runs-on: [self-hosted, node-b, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - id: keystore
        name: is there a keystore
        env:
          KEYSTORE_B64: ${{ secrets.MYDEVENV2_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MYDEVENV2_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MYDEVENV2_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MYDEVENV2_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${KEYSTORE_B64:-}" ]      || missing="$missing MYDEVENV2_ANDROID_KEYSTORE_B64"
          [ -n "${KEYSTORE_PASSWORD:-}" ] || missing="$missing MYDEVENV2_ANDROID_KEYSTORE_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ]         || missing="$missing MYDEVENV2_ANDROID_KEY_ALIAS"
          [ -n "${KEY_PASSWORD:-}" ]      || missing="$missing MYDEVENV2_ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::No release keystore configured; missing:$missing. The keystore is the one in the retired forge — a new one is a different app identity and cannot upgrade an existing install. See docs/DEPLOYMENT.md §9.6."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: the release URL is named
        env:
          SERVER_URL: ${{ secrets.VOGT_ANDROID_SERVER_URL }}
        run: |
          set -euo pipefail
          # FR-M1: the shell wraps a remote URL and has no default, on purpose
          # — an APK pointing at the wrong front door looks like a working app
          # whose Vogt tabs are all in their outage state.
          if [ -z "${SERVER_URL:-}" ]; then
            echo "::error::VOGT_ANDROID_SERVER_URL is not set. A release APK must name the front door it wraps; there is deliberately no default (FR-M1)."
            exit 1
          fi

      - name: install the shell's dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: capacitor sync
        working-directory: mobile
        env:
          VOGT_ANDROID_SERVER_URL: ${{ secrets.VOGT_ANDROID_SERVER_URL }}
        run: npx cap sync android

      - name: assemble and sign
        working-directory: mobile/android
        env:
          VOGT_ANDROID_SERVER_URL: ${{ secrets.VOGT_ANDROID_SERVER_URL }}
          MYDEVENV2_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MYDEVENV2_ANDROID_KEYSTORE_PASSWORD }}
          MYDEVENV2_ANDROID_KEY_ALIAS: ${{ secrets.MYDEVENV2_ANDROID_KEY_ALIAS }}
          MYDEVENV2_ANDROID_KEY_PASSWORD: ${{ secrets.MYDEVENV2_ANDROID_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.MYDEVENV2_ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          # Written under the runner's workspace and removed on the way out,
          # signed or not: a keystore left on a shared self-hosted runner is a
          # signing key anybody with a job on that runner can take.
          umask 077
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          trap 'rm -f "$keystore"' EXIT
          export MYDEVENV2_ANDROID_KEYSTORE_PATH="$keystore"
          ./gradlew assembleRelease --no-daemon

      - name: the artifact is actually signed
        working-directory: mobile/android
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$apk"
          # `apksigner` is in the SDK's build-tools. Verifying here rather than
          # trusting the build: Gradle silently produces an *unsigned* release
          # APK when the signing config is absent, which is the exact artefact
          # this job exists to stop being published under a release tag.
          verifier="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort | tail -1)"
          "$verifier" verify --print-certs "$apk"

      - uses: actions/upload-artifact@v7
        with:
          name: vogt-android-release-${{ github.ref_name }}
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
