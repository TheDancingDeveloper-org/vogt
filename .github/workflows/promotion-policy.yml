name: promotion policy

# main and prod are release branches. Feature work targets dev. Promotion is
# a fast-forward push performed by promote.yml under the
# `release-branch-promotion` ruleset — no pull request can update a release
# branch at all. This check remains so a stray PR opened against main or prod
# fails early with a clear reason instead of sitting unmergeable.

on:
  pull_request:
    branches: [main, prod]

permissions:
  contents: read

jobs:
  promotion-policy:
    name: promotion-policy
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: release branches accept only their promotion edge
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] || {
            echo "::error::Release branches accept promotion PRs from this repository only."
            exit 1
          }
          case "$BASE:$HEAD" in
            main:dev|prod:main) ;;
            *)
              echo "::error::Only dev → main and main → prod PRs may enter release branches."
              exit 1
              ;;
          esac

          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" \
            "+refs/heads/$HEAD:refs/remotes/origin/$HEAD"
          base_sha="$(git rev-parse "origin/$BASE")"
          head_sha="$(git rev-parse "origin/$HEAD")"
          git merge-base --is-ancestor "$base_sha" "$head_sha" || {
            echo "::error::The promotion is not fast-forwardable; update $HEAD first."
            exit 1
          }
          [ "$base_sha" != "$head_sha" ] || {
            echo "::error::The release branches already point at the same commit."
            exit 1
          }
