# Local runner-policy gate. It deliberately lives in this repository: a public
# repository cannot call the organisation's private reusable workflow.
#
# This checks the public/private runner split without importing private
# workflow code. Fork pull requests execute validation on isolated hosted
# workers; trusted image publication retains the labelled publisher pool.

name: Runner policy

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  runner-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Two rules, and the second is the one that matters. Exempting a
      # *file* would let a fork-triggered job be added to a publisher
      # workflow with the audit still green — so a workflow reachable from
      # `pull_request` has to guard its self-hosted jobs against fork events,
      # which is what `mirror-base-images.yml` already does.
      - name: every job uses a fixed approved runner
        run: |
          set -euo pipefail
          bad=0
          while IFS=: read -r file number line; do
            case "$line" in
              *ubuntu-latest*|*self-hosted*) ;;
              *)
                echo "::error file=$file,line=$number::workflow job does not name an approved runner"
                bad=1
                ;;
            esac
            case "$line" in
              *'${{'*)
                echo "::error file=$file,line=$number::dynamic runner selection is not allowed"
                bad=1
                ;;
            esac
            case "$file:$line" in
              .github/workflows/build.yml:*self-hosted*|\
              .github/workflows/release.yml:*self-hosted*|\
              .github/workflows/mirror-base-images.yml:*self-hosted*) ;;
              *:*)
                if [[ "$line" == *self-hosted* ]]; then
                  echo "::error file=$file,line=$number::validation workflow cannot use the private publisher pool"
                  bad=1
                fi
                ;;
            esac
          done < <(grep -RnE '^[[:space:]]*runs-on:' .github/workflows \
                     --include='*.yml' --include='*.yaml')

          # A publisher workflow that forks can trigger must guard the jobs
          # that reach the tailnet pool.
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$file" ] || continue
            # A `runs-on:` line, not prose: several workflows discuss the
            # self-hosted pool in comments without ever selecting it.
            grep -qE '^[[:space:]]*runs-on:.*self-hosted' "$file" || continue
            grep -qE '^[[:space:]]*pull_request:' "$file" || continue
            if ! grep -qF "github.event_name != 'pull_request'" "$file"; then
              echo "::error file=$file::workflow is reachable from a fork" \
                   "pull request and uses the self-hosted pool without" \
                   "guarding those jobs against fork events"
              bad=1
            fi
          done

          [ "$bad" -eq 0 ]
