name: docs

# The cheap path for documentation changes (NFR-C1): link checking and the
# config-docs drift check, and nothing else. A mixed code+docs commit runs
# this *and* the full pipeline in ci.yml — this is a subset, never a bypass
# (NFR-C2).

on:
  push:
    # `dev` is a real environment now (NFR-D12), so it is gated like main.
    branches: [main, dev]
    paths:
      - "docs/**"
      - "design/**"
      - "**/*.md"
  pull_request:
    paths:
      - "docs/**"
      - "design/**"
      - "**/*.md"

concurrency:
  group: docs-${{ github.ref }}
  # Safe to cancel, unlike `ci.yml`, and the difference is worth stating
  # because the two look identical: this workflow checks the *whole tree*
  # every time — every link in every markdown file, and the generated config
  # docs against the schema — so a later run covers everything a superseded
  # one would have. `ci.yml` classifies a push by `before..sha`, so each
  # commit is examined by exactly one run and a lost run is coverage lost for
  # good; it keys pushes by commit for that reason (§6.3 finding 19).
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: lint documentation
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Exact pin: setup-uv stopped publishing major tags at v8, so
      # `@v9` does not resolve. Renovate bumps this line.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - run: uv sync --locked

      - name: check markdown links
        run: uv run --no-sync python scripts/check_docs.py

      # NFR-Q4: the config schema is the single source of truth. Regenerating
      # must be a no-op; if it is not, the committed docs have drifted.
      - name: check generated config docs
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/gen_config_docs.py
          git diff --exit-code -- docs/CONFIG.md config.example.toml
