name: ci

# One pipeline for a product with five halves: the Python core, the
# Rust engine that fronts it, the Solid PWA the engine embeds, the
# first-party voice sidecar, and the Capacitor shell that points at it.
#
# Runs on every push and PR, but does the expensive work only when the tree
# it belongs to changed. A change to anything *shared* runs
# everything: path filters are a cost saving on isolated changes, never a way
# for a change that could affect any half to be checked by less than all of
# them.
#
# `ci` — the gate job at the bottom — is the single required status check: it
# succeeds trivially on a docs-only diff and fails whenever any half failed,
# so the docs path is never a bypass.

on:
  # Branch pushes gate `main` only. Without the filter, every pushed branch
  # that also has a PR open runs the matrix twice — once for `push`, once for
  # `pull_request` — which is what buries the small self-hosted pool.
  push:
    branches: [main]
  pull_request:
  # The merge queue (WI-1886). A queued entry is the exact tree `main` will
  # become, so it is classified as a change to everything: pull requests get
  # the fast, path-scoped subset below and the queue is where the full suite
  # runs before anything lands. See docs/ci.md.
  merge_group:
  # Manual runs.
  workflow_dispatch:

concurrency:
  # Newest-wins, by ref: a superseded run — pending or in progress — is
  # cancelled when a newer one joins its group, so a merge burst costs one
  # full run instead of a bank of queued ones.
  #
  # Cancelling is only safe because a run's coverage is fully contained in
  # the run that replaces it. A pull request classifies against the merge
  # base, so that is always true of PRs. A push is classified as a change to
  # *everything* (the classify step below), which gives the same property:
  # an incremental push classification plus cancellation would mean a
  # cancelled run's files are checked by nothing, ever. If push
  # classification ever becomes incremental again, this key must go back to
  # per-commit in the same change.
  #
  # The ref stays in the key: a PR groups by its own `refs/pull/N/merge`
  # ref, so PRs never evict each other or a branch, and a force-push cancels
  # the superseded PR run. A merge-queue entry runs on its own
  # `gh-readonly-queue/main/pr-N-<sha>` ref, so queue entries never cancel
  # each other either; the queue itself removes an entry it no longer needs.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: classify changes
    # Every job names a self-hosted runner. This project's CI runs on
    # the maintainer's self-hosted runners; if you fork this repo, change
    # `runs-on:` to a GitHub-hosted runner (e.g. `ubuntu-latest`) locally —
    # do NOT commit that change upstream. Dynamic `runs-on` expressions are
    # avoided the same way, everywhere in this workflow set.
    #
    # `self-hosted` alone: labels name capabilities only — `docker`,
    # `publish` — so a job asking for none of them runs anywhere in the pool.
    # The exposure a public repository creates is closed by requiring approval
    # for fork pull request workflows, not by where a job runs.
    runs-on: [self-hosted]
    timeout-minutes: 10
    outputs:
      python: ${{ steps.classify.outputs.python }}
      engine: ${{ steps.classify.outputs.engine }}
      rust: ${{ steps.classify.outputs.rust }}
      rust_full: ${{ steps.classify.outputs.rust_full }}
      rust_packages: ${{ steps.classify.outputs.rust_packages }}
      web: ${{ steps.classify.outputs.web }}
      full: ${{ steps.classify.outputs.full }}
      voice: ${{ steps.classify.outputs.voice }}
      voice_full: ${{ steps.classify.outputs.voice_full }}
      voice_packages: ${{ steps.classify.outputs.voice_packages }}
      mobile: ${{ steps.classify.outputs.mobile }}
      any: ${{ steps.classify.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - id: classify
        # Values from the event are passed through the environment rather
        # than interpolated into the script: a branch name is attacker-
        # controlled text on a PR.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          everything() {
            {
              echo "python=true"
              echo "engine=true"
              echo "rust=true"
              echo "rust_full=true"
              echo "rust_packages="
              echo "web=true"
              echo "voice=true"
              echo "voice_full=true"
              echo "voice_packages="
              echo "mobile=true"
              # A shared file is a change to every half, so the jobs that
              # narrow themselves on a PR (the Python matrix, the core-alone
              # job) run their full form too. This must be set here rather
              # than only on the non-PR path below: a PR touching a shared
              # file reaches this function having already written
              # `full=false`, and only the last write to an output wins.
              echo "full=true"
              echo "any=true"
            } >> "$GITHUB_OUTPUT"
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            # `full` widens the jobs that narrow themselves on a PR (the
            # Python matrix, the core-alone job). Only a PR is ever partial.
            echo "full=true" >> "$GITHUB_OUTPUT"
            # A push or merge-queue run checks everything, always. The concurrency group is
            # newest-wins per ref, so a superseded push run is cancelled —
            # which is only safe because the replacing run re-checks the
            # whole tree. Classifying a push by `before..sha` under that
            # policy would mean a cancelled run's files are checked by
            # nothing, ever; the two escapes that found that hole are
            # recorded in the concurrency comment at the top of this file.
            echo "$EVENT_NAME: every push and merge-queue entry checks everything"
            everything
            exit 0
          fi

          echo "full=false" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin "$BASE_REF"
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          range="$base..HEAD"

          files="$(git diff --name-only "$range")"
          echo "changed files:"
          echo "$files"

          matches() {
            printf '%s\n' "$files" | grep -Eq "$1"
          }

          # The workflows, the image, the stack and the ignore rules belong to
          # no single half; a change to any of them can change what every half
          # is built or checked with.
          if matches '^(\.github/workflows/|Dockerfile$|\.dockerignore$|deploy/|\.gitignore$)'; then
            echo "a shared file changed; running every half"
            everything
            exit 0
          fi

          python=false
          rust=false
          web=false
          voice=false
          mobile=false

          # `config.example.toml` is generated from the config schema and the
          # drift check asserts on it; editing it by hand was
          # previously classified as no change at all, and `docs.yml` does not
          # trigger on it either, so the one file whose whole purpose is to be
          # checked for staleness was the one nothing checked.
          matches '^(src/|tests/|scripts/|pyproject\.toml$|uv\.lock$|config\.example\.toml$)' && python=true
          # `engine/server/src/assets.rs` embeds `../../web/dist/` with
          # rust-embed, so the PWA is a *build input* to the Rust crate rather
          # than a neighbour of it: a web-only change changes what the engine
          # serves, and is checked by rebuilding the engine.
          #
          # On a PR the engine job still splits in two halves so a PR pays
          # only for the half it touched: `rust` (fmt, clippy, nextest, audit)
          # and `web` (typecheck, vitest, demo Playwright, bundle budget). A
          # web-only PR does not rebuild the crate against its new bundle;
          # that embed check runs in the merge queue, where both are true.
          matches '^engine/' && rust=true
          matches '^web/' && web=true
          # The engine compiles `docs/ENGINE.md` in with `include_str!` (its
          # voice-policy test reads the capability matrix), so the document is
          # an engine input too.
          matches '^docs/ENGINE\.md$' && rust=true

          # Which crates a PR has to check. A member directory scopes to that
          # package; anything else under `engine/` (the workspace manifest,
          # the lockfile, nextest config, Dockerfiles, workspace docs) or a
          # non-PR run checks the whole workspace. `docs/ENGINE.md` is
          # compiled into the server crate by `include_str!`. `engine/core/`
          # is its own member and is never folded into the server or contract
          # package.
          rust_full=false
          rust_packages=""
          if [ "$rust" = true ]; then
            if matches '^engine/server/'; then
              rust_packages="$rust_packages vogt-engine-server"
            fi
            if matches '^engine/contract/'; then
              rust_packages="$rust_packages vogt-engine-contract"
            fi
            if matches '^engine/core/'; then
              rust_packages="$rust_packages vogt-core"
            fi
            if matches '^docs/ENGINE\.md$'; then
              rust_packages="$rust_packages vogt-engine-server"
            fi
            while IFS= read -r path; do
              case "$path" in
                engine/server/*|engine/contract/*|engine/core/*) ;;
                engine/*) rust_full=true; break ;;
              esac
            done <<< "$files"
            if [ -n "$rust_packages" ]; then
              # shellcheck disable=SC2086  # deliberate word splitting
              rust_packages="$(printf '%s\n' $rust_packages | sort -u | tr '\n' ' ')"
              rust_packages="${rust_packages% }"
            fi
          fi
          engine=false
          if [ "$rust" = true ] || [ "$web" = true ]; then
            engine=true
          fi
          # The PWA contract check reads the Rust registry golden. This has to
          # follow the engine=false reset above, or a registry-only change is
          # classified as no engine work.
          matches '^tests/parity/golden/registry\.json$' && engine=true
          matches '^voice/' && voice=true
          # The voice workspace follows the same rule: a member directory
          # scopes to its package, and every other voice path (workspace
          # manifest, lockfile, docs, build tooling) checks the workspace.
          voice_full=false
          voice_packages=""
          if [ "$voice" = true ]; then
            for member in server stt tts models; do
              if matches "^voice/$member/"; then
                voice_packages="$voice_packages vogt-voice-$member"
              fi
            done
            while IFS= read -r path; do
              case "$path" in
                voice/server/*|voice/stt/*|voice/tts/*|voice/models/*) ;;
                voice/*) voice_full=true; break ;;
              esac
            done <<< "$files"
            if [ -n "$voice_packages" ]; then
              # shellcheck disable=SC2086  # the list is space-separated on purpose
              voice_packages="$(printf '%s\n' $voice_packages | sort -u | tr '\n' ' ')"
              voice_packages="${voice_packages% }"
            fi
          fi
          # The shell wraps a remote URL, not the PWA bundle — `webDir` is
          # `mobile/web/`, a one-file offline fallback — so a `web/` change
          # does not imply an APK rebuild.
          matches '^mobile/' && mobile=true

          {
            echo "python=$python"
            echo "engine=$engine"
            echo "rust=$rust"
            echo "rust_full=$rust_full"
            echo "rust_packages=$rust_packages"
            echo "web=$web"
            echo "voice=$voice"
            echo "voice_full=$voice_full"
            echo "voice_packages=$voice_packages"
            echo "mobile=$mobile"
          } >> "$GITHUB_OUTPUT"

          if [ "$python" = false ] && [ "$engine" = false ] && [ "$voice" = false ] && [ "$mobile" = false ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: lint, type-check, test (py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: [self-hosted]
    timeout-minutes: 30
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and a current release. A PR runs the current
        # release only; the floor runs in the merge queue and on `main`.
        python-version: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["3.11", "3.13"]' || '["3.13"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Pinned to an exact version, not `@v9`: from v8 onwards setup-uv stopped
      # publishing major and minor tags, so `@v9` does not resolve. Renovate
      # bumps this line.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        # `auto` caches only on GitHub-hosted runners; these are self-hosted,
        # so the cache is asked for explicitly and keyed on the lockfile.
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The self-hosted image preinstalls no language runtime.
      - name: install matrix Python
        run: uv python install ${{ matrix.python-version }}

      # The version and config-doc checks run from the Rust port (WI-1079).
      # The pin matches the engine job.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      # `--locked` fails on any manifest/lockfile mismatch.
      - run: uv sync --locked

      - name: canonical product version is aligned
        run: cargo run --quiet --manifest-path engine/core/Cargo.toml --bin vogt-core -- check-product-version 0.7.22

      - name: ruff (lint)
        run: uv run --no-sync ruff check .

      - name: ruff (format)
        run: uv run --no-sync ruff format --check .

      - name: mypy --strict
        run: uv run --no-sync mypy

      # Checked on the path that actually causes drift. The same check lives
      # in `docs.yml`, which triggers on `docs/**` and `**/*.md` — so a commit
      # that adds a field to `src/vogt/config.py` and nothing else ran this
      # job, where the check was absent, and landed with the generated files
      # stale. A recorded gate failure: CI is meant to fail on drift, and
      # for code-only changes it did not.
      - name: generated config docs are not stale
        run: |
          set -euo pipefail
          cargo run --quiet --manifest-path engine/core/Cargo.toml --bin vogt-core -- gen-config-docs
          git diff --exit-code -- docs/CONFIG.md config.example.toml

      # Includes the coverage gate, the transport-parity matrix
      # and the demo acceptance test. Forge-less by construction:
      # nothing here provisions a token or a network, which is the first of
      # the two absence-modes the core must survive.
      #
      # Deliberately serial: the suite is bound by SQLite file I/O, not CPU,
      # and its tests bind sockets and spawn subprocesses, so xdist would
      # trade a reliable run for a flaky one without buying wall clock.
      # See docs/ci.md.
      - name: pytest
        run: uv run --no-sync pytest

  core:
    name: the core alone, with no engine present
    needs: changes
    # The job deletes engine/, web/ and mobile/ before it tests, so on a PR
    # only a Python change can change its result; the queue runs it always.
    if: needs.changes.outputs.python == 'true'
    runs-on: [self-hosted]
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        # `auto` caches only on GitHub-hosted runners; these are self-hosted,
        # so the cache is asked for explicitly and keyed on the lockfile.
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: install Python
        run: uv python install 3.13

      # Second absence-mode: vogt-core remains fully testable alone.
      # Asserted by deletion rather than by inspection — a grep for `engine`
      # would have passed all along and would keep passing the day someone
      # adds a fixture that shells out to `cargo` or reads `web/dist`. This
      # runs on any code change, not just a Python one, because the coupling
      # that would break it gets introduced from the other side.
      - name: delete every tree the core is not allowed to need
        run: rm -rf engine web mobile

      - run: uv sync --locked

      - name: pytest, with three quarters of the repository missing
        run: uv run --no-sync pytest

  engine:
    name: fmt, clippy, test (engine) and the PWA it embeds
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    # `tailnet` is carried by the Node B runners (node-b-gha-public-*) and
    # not by the GCP rust-heavy pool, whose image has no ripgrep and whose
    # `runner` user has no passwordless sudo — so the install step below
    # fails there and the `/api/search` tests go red (WI-1887). Widen this
    # back to the whole pool once that image is rebaked.
    runs-on: [self-hosted, tailnet]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: needs.changes.outputs.rust == 'true'
        with:
          components: rustfmt, clippy

      # Caches where this CI already keeps state; a build cache that can take
      # CI down is a worse trade here, where runners are the scarce resource.
      # The post-job save is itself ~2 min (build-cycle review, 2026-10-15),
      # and a pull request's cache is never reused by another ref, so only
      # main writes it back. Every ref still restores the cache main saved.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: needs.changes.outputs.rust == 'true'
        with:
          workspaces: engine
          # A shared key is what makes a PR run restore the cache `main` (or
          # `merge_group`) saved; without it the key includes the ref and
          # every PR starts cold. Only `main` writes back, because a pull
          # request's cache is never reused by another ref and the post-job
          # save costs about two minutes.
          shared-key: engine-ci
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # First: it needs nothing built, so it is the cheapest failure to reach.
      - name: cargo fmt
        if: needs.changes.outputs.rust == 'true'
        working-directory: engine
        run: cargo fmt --all -- --check

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        # `auto` caches only on GitHub-hosted runners; these are self-hosted,
        # so the cache is asked for explicitly and keyed on the lockfile.
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled()

      # `rust-version` is a promise about the oldest toolchain that builds the
      # locked tree. CI builds with current stable, so nothing else would
      # notice a dependency bump that raised the real floor past the declared
      # one; this reads `cargo metadata` and fails when it does.
      - name: declared rust-version covers the lockfile
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.rust == 'true'
        run: uv run --no-project python scripts/check_rust_version.py engine

      # cargo-audit is a fixed version, and compiling it from crates.io is
      # most of the audit step (build-cycle review, 2026-10-15). The binary
      # is cached by that version, so a run installs it only on a cold cache.
      # The path is a literal, not `~` and not ${{ env.CARGO_HOME }}: the job's
      # CARGO_HOME (/root/.cargo, set by rust-toolchain) is not the home
      # actions/cache expands `~` against, and a step env var is invisible to
      # the workflow env context, so either form restores where cargo never
      # looks. /root/.cargo is where `cargo install` writes on these runners.
      - name: restore the cargo-audit binary
        id: cargo-audit
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.rust == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /root/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}

      - name: install cargo-audit
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && steps.cargo-audit.outputs.cache-hit != 'true' && needs.changes.outputs.rust == 'true'
        run: cargo install --locked cargo-audit --version 0.22.2 --force

      - name: audit Rust dependencies
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.rust == 'true'
        working-directory: engine
        run: |
          set -euo pipefail
          # cargo-audit 0.22 prints "cargo-audit-audit 0.22.2": its clap name
          # is "cargo-audit" and the cargo shim prepends "cargo-", so an exact
          # "cargo-audit 0.22.2" match never holds. Accept either form.
          got="$(cargo audit --version 2>&1 || true)"
          case "$got" in
            "cargo-audit 0.22.2"|"cargo-audit-audit 0.22.2") ;;
            *) echo "cargo audit --version returned: $got" >&2; exit 1 ;;
          esac

          # The self-hosted runner carries a global gitconfig that injects this
          # org's credentials for github.com. RustSec/advisory-db is a different
          # public repository, and those credentials are rejected (HTTP 401),
          # so cargo-audit's own git fetch cannot reach the database. Clone it
          # anonymously with a clean git configuration, then audit against that
          # local copy without letting cargo-audit re-fetch.
          advisory_db="${RUNNER_TEMP:-/tmp}/rustsec-advisory-db"
          rm -rf "$advisory_db"
          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null \
            GIT_TERMINAL_PROMPT=0 \
            git clone --quiet --depth 1 \
              https://github.com/RustSec/advisory-db.git "$advisory_db"

          # RUSTSEC-2023-0071 (Marvin Attack) has no fixed rsa release. The
          # advisory is about RSA decryption timing. Vogt never decrypts with
          # RSA: engine/core parses an unencrypted PKCS#1 or PKCS#8 private
          # key to decide whether a GitHub App credential is configured, and
          # the VAPID path (web-push -> jwt-simple -> superboring) signs
          # ES256 (P-256 ECDSA) only. See engine/server/src/push.rs.
          # RUSTSEC-2025-0134: rustls-pemfile is unmaintained and has no
          # successor release. It arrives through rustls-native-certs and
          # axum-server, which still depend on it, so dropping our direct use
          # does not remove it from the lock.
          #
          # RUSTSEC-2026-0387 (crypto-bigint 0.5.5 timing variability) has no
          # reachable fix: the latest jsonwebtoken and web-push both pin
          # elliptic-curve 0.13, which pins crypto-bigint 0.5. Unlike the rsa
          # one, this path is used (VAPID ES256 signing, JWTs); the risk is a
          # remote timing side channel. Accepted by the operator 2026-10-24;
          # WI-2373 removes it when those crates reach elliptic-curve 0.14.
          # These ignores stay explicit while the audit denies future
          # vulnerabilities, unsound advisories, and yanks.
          cargo audit --no-fetch --db "$advisory_db" \
            --deny warnings \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2025-0134 \
            --ignore RUSTSEC-2026-0387

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.web == 'true'
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.web == 'true'
        with:
          node-version: "22"
          # The pnpm store, keyed on web/pnpm-lock.yaml, so a warm run does
          # not re-download the PWA's dependencies.
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: install the PWA's dependencies
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.web == 'true'
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: audit the PWA's dependencies
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.web == 'true'
        working-directory: web
        # Fatal on advisories, resilient to registry timeouts.
        run: bash ../scripts/pnpm-audit.sh

      # `pnpm build` runs `tsc --noEmit` itself; this is kept as its own step
      # so a type error is reported as a type error rather than as a failed
      # bundle, which is how the engine's pipeline reported it.
      - name: typecheck the PWA
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.web == 'true'
        working-directory: web
        run: pnpm typecheck

      # The PWA contract with no Python in it (WI-1077): the route table
      # against the Rust registry golden, a reason on every write, and every
      # engine path served by the router and listed in docs/ENGINE.md.
      - name: PWA contract against the Rust registry
        if: always() && !cancelled()
        run: node web/scripts/check-route-map.mjs

      # The PWA's own tests (`docs/ENGINE.md` §3.4): the five Vogt surfaces
      # mounted in jsdom against a fake front door, asserting the interaction
      # contract that no amount of reading the source can see — an optimistic
      # move reconciling against the server's answer, a refusal rolling back
      # with Vogt's own reason, a form refusing to submit without one.
      #
      # In this job rather than its own, and gated by the same `engine` filter,
      # because the classifier already treats `web/` as a build input to the
      # Rust crate: `engine/server/src/assets.rs` embeds `web/dist/`, so a
      # web-only change is already an engine change here and a second job with
      # a second checkout and a second pnpm install would buy nothing on a
      # runner pool this small.
      #
      # Before the bundle is built, because a failing test is a cheaper
      # failure to reach than a bundle, and these need no `dist`.
      - name: test the PWA
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.web == 'true'
        working-directory: web
        run: pnpm test

      - name: install the demo browser
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.web == 'true'
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: demo routes, phone composition, split layouts, and screenshots
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.web == 'true'
        working-directory: web
        env:
          CI: "true"
          PLAYWRIGHT_PORT: "4175"
        # Safety net for #737: the real fix is the webServer `gracefulShutdown`
        # in playwright.config.ts, but keep a hard external cap so any future
        # native-layer wedge fails in minutes with a diagnosis instead of
        # hanging the runner for 90+ min. SIGINT lets Playwright name what it
        # was doing; the `list` reporter makes per-test progress legible.
        run: timeout --signal=SIGINT 420 pnpm exec playwright test tests/browser/demo.spec.ts --project=desktop --project=phone --reporter=list

      # A screenshot that disagrees with its baseline is undiagnosable from
      # the log alone, and a baseline can only be refreshed from the renderer
      # that took it — this one. Keep the actual/expected/diff images so the
      # disagreement can be read, and the baseline re-cut from CI's own
      # rendering when the change is the intended one.
      - name: keep the demo browser evidence when a screenshot disagrees
        if: failure() && needs.changes.outputs.web == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: demo-playwright-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Built *before* cargo, so the engine embeds the real bundle and the
      # compile is over what actually ships. The engine's pipeline built the
      # PWA only in its image stage and compiled Rust against a placeholder;
      # here the bundle is a few seconds of work, so there is no reason to
      # check the engine against assets it will never serve.
      - name: build the PWA
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.web == 'true'
        working-directory: web
        env:
          VOGT_SOURCE_REF: ${{ github.ref_name }}
          VOGT_SOURCE_SHA: ${{ github.sha }}
        run: pnpm build

      - name: normal and demo packaging share one PWA artifact
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.web == 'true'
        run: |
          set -euo pipefail
          cp -a web/dist web/dist-normal
          (
            cd web
            VOGT_SOURCE_REF="${GITHUB_REF_NAME}" VOGT_SOURCE_SHA="${GITHUB_SHA}" pnpm demo:augment
          )
          mv web/dist web/dist-demo
          cp -a web/dist-normal web/dist
          uv run --no-project python scripts/check_demo_assets.py \
            --normal web/dist-normal \
            --demo web/dist-demo \
            --source-sha "${GITHUB_SHA}"

      # What a cold visit costs, enforced rather than hoped for. The editor
      # and the terminal are behind their own routes; one careless
      # static import puts them back on the first screen, and nothing else in
      # this pipeline would say so.
      #
      # `--no-project`: the check reads the build manifest and the standard
      # library and nothing else, so it does not need this repo's Python
      # environment synced into a job that is otherwise Rust and Node.
      - name: the first screen stays inside its budget
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.web == 'true'
        run: uv run --no-project python scripts/check_bundle.py

      - name: web/dist exists even when the PWA was not built
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          # `engine/server/src/assets.rs` embeds `../../web/dist/`. That
          # file's own comment says a missing directory yields an empty asset
          # set; it does not. The derive fails to expand, `WebAssets` never
          # gets its `Embed` impl, and the crate dies on three E0599s about a
          # `get` that no trait in scope provides — so a fresh checkout cannot
          # compile the engine at all.
          # Nothing above should leave it missing; this is the guard for the
          # day someone makes the PWA build conditional.
          if [ ! -d web/dist ]; then
            echo "web/dist is missing; creating the rust-embed placeholder"
            mkdir -p web/dist
            touch web/dist/.placeholder
          fi

      - name: ripgrep and git are present
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.rust == 'true'
        run: |
          set -eu
          # `server/src/files.rs` shells out to `rg` and `server/src/git.rs`
          # to `git`, and the integration tests exercise both — so these are
          # *test* dependencies, not merely runtime ones. The engine's
          # pipeline apt-installed them into its Rust container for exactly
          # this reason; the self-hosted image makes no promise about either.
          missing=""
          command -v git >/dev/null || missing="$missing git"
          command -v rg >/dev/null || missing="$missing ripgrep"
          if [ -n "$missing" ]; then
            echo "installing:$missing"
            # Runners differ: some execute as root with no sudoers entry
            # (where `sudo apt-get` fails with "root is not in the sudoers
            # file"), others as an unprivileged user that may or may not
            # have passwordless sudo. Use apt-get directly as root, sudo
            # otherwise, and fail clearly when neither is available.
            if [ "$(id -u)" = "0" ]; then
              apt-get update
              apt-get install -y --no-install-recommends $missing
            elif command -v sudo >/dev/null; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends $missing
            else
              echo "cannot install$missing: not root and no sudo." >&2
              echo "The engine's tests shell out to both; a runner image" >&2
              echo "without them cannot run this job." >&2
              exit 1
            fi
          fi
          git --version
          rg --version

      # `-D warnings` because the engine's pipeline denied them, and a lint
      # that does not fail is a lint nobody reads.
      # On a pull request that touches only one member, check that member:
      # `--workspace` is the full form the queue and `main` use. A scope
      # that resolved to nothing falls back to the workspace rather than
      # silently checking whatever `cargo` considers the default members.
      - name: resolve the Rust scope
        id: scope
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.rust == 'true'
        env:
          FULL: ${{ needs.changes.outputs.rust_full }}
          PACKAGES: ${{ needs.changes.outputs.rust_packages }}
        run: |
          set -euo pipefail
          if [ "$FULL" = true ] || [ -z "$PACKAGES" ]; then
            echo "args=--workspace" >> "$GITHUB_OUTPUT"
          else
            args=""
            # shellcheck disable=SC2086  # the list is space-separated on purpose
            for package in $PACKAGES; do
              args="$args -p $package"
            done
            echo "args=$args" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo clippy
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.rust == 'true'
        working-directory: engine
        run: cargo clippy --locked ${{ steps.scope.outputs.args }} --all-targets -- -D warnings

      # cargo-nextest runs each test in its own process, so a test that hangs
      # is terminated by `engine/.config/nextest.toml` (terminate-after) and
      # reported as a failure, instead of holding the job until its timeout
      # (WI-1312). `--no-fail-fast` lists every failing test in one round.
      - name: cargo nextest
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.rust == 'true'
        working-directory: engine
        run: |
          set -euo pipefail
          if ! cargo nextest --version 2>/dev/null | grep -Fq 'cargo-nextest 0.9.103'; then
            cargo install --locked cargo-nextest --version 0.9.103 --force
          fi
          cargo nextest run --locked ${{ steps.scope.outputs.args }} --no-fail-fast

      # nextest does not run doctests, so they keep their own step.
      # vogt-core is a bin with no library target, and `cargo test --doc -p
      # vogt-core` errors ("no library targets found") rather than skipping.
      - name: cargo test (doctests)
        # Runs after a failed step too, so one round reports every failure.
        if: always() && !cancelled() && needs.changes.outputs.rust == 'true'
        working-directory: engine
        run: |
          set -euo pipefail
          args="${{ steps.scope.outputs.args }}"
          # Drop `-p vogt-core`: it has no library, so `--doc` cannot run.
          filtered="$(printf '%s\n' $args | awk 'BEGIN{skip=0} {if($0=="-p"){getline; if($0!="vogt-core") print "-p",$0} else print}')"
          if [ -z "$filtered" ]; then
            echo "no library targets in scope; skipping doctests"
            exit 0
          fi
          # shellcheck disable=SC2086  # filtered is cargo's own -p list
          cargo test --locked $filtered --doc

  voice:
    name: fmt, clippy, test (voice sidecar foundation)
    needs: changes
    if: needs.changes.outputs.voice == 'true'
    runs-on: [self-hosted]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      # Same as the engine job: only main writes the cache back. A pull
      # request still restores what main saved, and skips the post-job save.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: voice
          # Same shared-key rule as the engine cache, kept separate so the
          # two workspaces do not evict each other's dependency builds.
          shared-key: voice-ci
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: install native voice build dependencies
        run: |
          set -eu
          if command -v clang >/dev/null 2>&1 \
            && command -v cmake >/dev/null 2>&1 \
            && command -v pkg-config >/dev/null 2>&1 \
            && pkg-config --exists opus \
            && pkg-config --exists openssl \
            && ldconfig -p 2>/dev/null | grep -q libclang; then
            exit 0
          fi
          missing="clang cmake libclang-dev libopus-dev libssl-dev pkg-config"
          if [ "$(id -u)" = "0" ]; then
            apt-get update
            apt-get install -y --no-install-recommends $missing
          elif command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends $missing
          else
            echo "clang, cmake, libclang-dev, libopus-dev, libssl-dev, and pkg-config are required to build the voice sidecar" >&2
            exit 1
          fi

      - name: cargo fmt
        working-directory: voice
        run: cargo fmt --all -- --check

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        # `auto` caches only on GitHub-hosted runners; these are self-hosted,
        # so the cache is asked for explicitly and keyed on the lockfile.
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `rust-version` is a promise about the oldest toolchain that builds the
      # locked tree. CI builds with current stable, so nothing else would
      # notice a dependency bump that raised the real floor past the declared
      # one; this reads `cargo metadata` and fails when it does.
      - name: declared rust-version covers the lockfile
        run: uv run --no-project python scripts/check_rust_version.py voice

      # Member paths scope to their package; the workspace manifest, lockfile
      # and build tooling check the whole workspace, as do `merge_group` and
      # `main`. An empty scope falls back to the workspace.
      - name: resolve the voice scope
        id: scope
        env:
          FULL: ${{ needs.changes.outputs.voice_full }}
          PACKAGES: ${{ needs.changes.outputs.voice_packages }}
        run: |
          set -euo pipefail
          if [ "$FULL" = true ] || [ -z "$PACKAGES" ]; then
            echo "args=--workspace" >> "$GITHUB_OUTPUT"
          else
            args=""
            # shellcheck disable=SC2086  # the list is space-separated on purpose
            for package in $PACKAGES; do
              args="$args -p $package"
            done
            echo "args=$args" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo clippy
        working-directory: voice
        run: cargo clippy --locked ${{ steps.scope.outputs.args }} --all-targets --all-features -- -D warnings

      # Nextest for the same reason as the engine: a hanging test is killed by
      # the workspace's nextest config instead of holding the job to its
      # timeout, and every failure is listed in one round.
      - name: cargo nextest
        working-directory: voice
        run: |
          set -euo pipefail
          if ! cargo nextest --version 2>/dev/null | grep -Fq 'cargo-nextest 0.9.103'; then
            cargo install --locked cargo-nextest --version 0.9.103 --force
          fi
          cargo nextest run --locked ${{ steps.scope.outputs.args }} --no-fail-fast

      # nextest does not run doctests, so they keep their own step.
      - name: cargo test (doctests)
        working-directory: voice
        run: cargo test --locked ${{ steps.scope.outputs.args }} --doc

  android:
    name: the Android shell assembles
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: [self-hosted]
    timeout-minutes: 30
    # Pull requests, including fork pull requests, must not receive the dev
    # Firebase secret. They build against the sanitized example.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          # The pnpm store, keyed on mobile/pnpm-lock.yaml.
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: install the shell's dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: audit the shell's dependencies
        working-directory: mobile
        # Fatal on advisories, resilient to registry timeouts.
        run: bash ../scripts/pnpm-audit.sh

      - name: write the dev Firebase config
        if: github.event_name != 'pull_request'
        # The dev Firebase config is a plain GitHub Actions secret — no secret
        # broker and no CLI, so this runs on any self-hosted runner and any
        # fork can supply its own. The helper writes it without echoing and
        # verifies it carries the dev Android client.
        env:
          VOGT_FIREBASE_JSON: ${{ secrets.VOGT_FIREBASE_DEV_JSON }}
          VOGT_FIREBASE_OUTPUT: mobile/android/app/google-services.json
          VOGT_ANDROID_EXPECTED_PACKAGE: com.thedancingdeveloper.vogt.dev
        run: bash scripts/write_firebase_config.sh

      - name: verify the dev Firebase config is available
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test -f mobile/android/app/google-services.json.example
          echo "Pull request build: using sanitized Firebase placeholder"

      # `android/settings.gradle` includes `:capacitor-cordova-android-plugins`,
      # which `cap sync` generates — the Gradle build cannot configure without
      # this having run first.
      #
      # The server is selected on-device; builds carry no deployment URL.
      #
      # `VOGT_ANDROID_APP_ID` is the non-production identity. Without it every
      # APK the product builds would carry the production
      # application id. That is wrong twice over: this APK is debug-signed, so
      # Android refuses to install it over a real one anyway, and an id with
      # no build behind it is an id nobody notices going stale. Named on both
      # steps because the two toolchains read it at different moments —
      # Capacitor when it writes the native config, Gradle when it assembles —
      # and setting it on one is the exact divergence `tests/
      # test_mobile_identity.py` exists to catch.
      #
      # `com.thedancingdeveloper.vogt.dev` has its own client entry in the sanitized
      # placeholder `mobile/android/app/google-services.json.example` (copied to
      # `google-services.json` by build.gradle when no real, operator-supplied
      # file is present), so this build can register for push; that
      # agreement is asserted, not assumed. FCM only delivers once the operator
      # adds the id to a real Firebase project and drops in the real config.
      - name: capacitor sync
        working-directory: mobile
        env:
          VOGT_ANDROID_APP_ID: "com.thedancingdeveloper.vogt.dev"
        run: npx cap sync android

      # The `cap sync` above regenerates the uncommitted
      # `capacitor.settings.gradle`, so Gradle can configure the plugin
      # projects. Run the unit tests before assembling — they are the step a
      # stale committed settings file breaks at configuration time, so keeping
      # them in CI is what catches a regression.
      - name: unit test
        working-directory: mobile/android
        env:
          VOGT_ANDROID_APP_ID: "com.thedancingdeveloper.vogt.dev"
        run: ./gradlew test --no-daemon

      # A *debug* APK: it is signed with Gradle's generated debug key, so it
      # needs no secret and proves what CI is here to prove — that the shell
      # still assembles. The signed release build belongs to the separate
      # secret-gated job in `release.yml` (never on every push),
      # which builds the release variant from a clean checkout on a release
      # tag.
      - name: assemble
        working-directory: mobile/android
        env:
          VOGT_ANDROID_APP_ID: "com.thedancingdeveloper.vogt.dev"
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vogt-android-debug-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: remove Firebase config
        if: always()
        run: rm -f mobile/android/app/google-services.json

  security:
    name: tracked secret hygiene
    needs: changes
    runs-on: [self-hosted]
    timeout-minutes: 10
    # Check the reviewed tree, not full history: the known pre-#265 exposure
    # still needs an operator-coordinated rewrite decision.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: reject live Firebase config and API keys in tracked files
        run: |
          set -euo pipefail

          tracked_configs="$(git ls-files -- '*google-services.json')"
          if [ -n "$tracked_configs" ]; then
            echo "A live Firebase config must not be tracked:"
            echo "$tracked_configs"
            exit 1
          fi

          # The example is a structurally valid, non-live fixture. Print paths
          # only so a future failure cannot echo a credential into the log.
          key_paths="$(git grep -l -I -E 'AIzaSy[A-Za-z0-9_-]{20,}' -- ':!mobile/android/app/google-services.json.example' || true)"
          if [ -n "$key_paths" ]; then
            echo "Firebase-looking API keys found in tracked files:"
            echo "$key_paths"
            exit 1
          fi

          echo "No live Firebase config or Firebase-looking API key is tracked"

  ci:
    name: ci
    needs: [changes, build, core, engine, voice, android, security]
    if: always()
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - name: gate
        env:
          CHANGES: ${{ needs.changes.result }}
          PYTHON: ${{ needs.build.result }}
          CORE: ${{ needs.core.result }}
          ENGINE: ${{ needs.engine.result }}
          VOICE: ${{ needs.voice.result }}
          ANDROID: ${{ needs.android.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" != "success" ]; then
            echo "change classification did not succeed: $CHANGES"
            exit 1
          fi

          failed=0
          for half in \
            "python:$PYTHON" \
            "core-alone:$CORE" \
            "engine:$ENGINE" \
            "voice:$VOICE" \
            "android:$ANDROID" \
            "security:$SECURITY"
          do
            name="${half%%:*}"
            result="${half#*:}"
            case "$result" in
              success)
                echo "$name: passed"
                ;;
              skipped)
                echo "$name: nothing it owns changed, nothing to check"
                ;;
              *)
                echo "$name: $result"
                failed=1
                ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "every half that had something to check passed"

