name: ci

# Runs on every push and PR, but does the expensive work only when code
# changed (NFR-C1). `ci` — the gate job at the bottom — is the single
# required status check: it succeeds trivially on a docs-only diff and fails
# whenever the build failed, so the docs path is never a bypass (NFR-C2).

on:
  # Branch pushes gate main only. Without the filter, every pushed branch that
  # also has a PR open runs the matrix twice — once for `push`, once for
  # `pull_request` — which is what buries the small self-hosted pool.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: classify changes
    # NFR-C4: every job names a self-hosted runner. `runs-on: ubuntu-latest`
    # is prohibited estate-wide, and dynamic `runs-on` expressions with it.
    # These four labels match the three node-b workers; `proxmox-gha-public-*`
    # does not carry `node-b`.
    runs-on: [self-hosted, node-b, linux, x64]
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: classify
        # Values from the event are passed through the environment rather
        # than interpolated into the script: a branch name is attacker-
        # controlled text on a PR.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
            range="$base..HEAD"
          elif [ -z "$BEFORE" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no usable base commit; treating as a code change"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            range="$BEFORE..$SHA"
          fi

          files="$(git diff --name-only "$range")"
          echo "changed files:"
          echo "$files"

          if printf '%s\n' "$files" | grep -Eq \
            '^(src/|tests/|scripts/|\.github/workflows/|pyproject\.toml|uv\.lock)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: lint, type-check, test (py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, node-b, linux, x64]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and a current release.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact version, not `@v9`: from v8 onwards setup-uv stopped
      # publishing major and minor tags, so `@v9` does not resolve. Renovate
      # bumps this line.
      - uses: astral-sh/setup-uv@v9.0.0

      # The self-hosted image preinstalls no language runtime.
      - name: install matrix Python
        run: uv python install ${{ matrix.python-version }}

      # `--locked` fails on any manifest/lockfile mismatch (NFR-Q5).
      - run: uv sync --locked

      - name: ruff (lint)
        run: uv run --no-sync ruff check .

      - name: ruff (format)
        run: uv run --no-sync ruff format --check .

      - name: mypy --strict
        run: uv run --no-sync mypy

      # Includes the coverage gate (NFR-Q2), the transport-parity matrix
      # (FR-A3) and the M0 demo acceptance test.
      - name: pytest
        run: uv run --no-sync pytest

  ci:
    name: ci
    needs: [changes, build]
    if: always()
    runs-on: [self-hosted, node-b, linux, x64]
    steps:
      - name: gate
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" != "success" ]; then
            echo "change classification did not succeed: $CHANGES"
            exit 1
          fi
          case "$BUILD" in
            success)
              echo "build passed"
              ;;
            skipped)
              echo "docs-only change: no code paths touched, nothing to build"
              ;;
            *)
              echo "build result: $BUILD"
              exit 1
              ;;
          esac
