version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/mobile"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/engine"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/voice"
    schedule:
      interval: weekly
    # ort and ort-sys are a matched pair pinned at =2.0.0-rc.12 for
    # piper-rs 0.2.0 (voice/tts Cargo.toml), which requires exactly that
    # ort. A lone bump of either does not build (ort-sys fails its own build
    # script under an older ort), so they move together, by hand, with
    # piper-rs.
    ignore:
      - dependency-name: ort
      - dependency-name: ort-sys
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # init and analyze must run the same CodeQL bundle; split bumps fail
      # the analyze job on whichever PR lands first.
      codeql-action:
        patterns:
          - "github/codeql-action*"
