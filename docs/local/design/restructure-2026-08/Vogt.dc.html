<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><style>
body{margin:0;background:#0d1117;color:#c9d1d9;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}
*{box-sizing:border-box}
a{color:#58a6ff;text-decoration:none}a:hover{color:#79b8ff}
</style></helmet>

<div style="display:flex;height:100vh;min-height:0;background:#0d1117;overflow:hidden">

  <nav style="width:248px;flex:none;border-right:1px solid #30363d;background:#0d1117;display:flex;flex-direction:column;overflow:hidden">
    <div style="display:flex;align-items:center;gap:9px;height:53px;padding:0 14px;border-bottom:1px solid #30363d">
      <span style="font-size:14px;font-weight:600;letter-spacing:.02em;color:#c9d1d9">Vogt</span>
      <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:#8b949e">r4</span>
    </div>

    <div style="padding:14px 8px 6px 14px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6e7681">Work</div>
    <sc-for list="{{ work }}" as="link" hint-placeholder-count="3">
      <button type="button" onClick="{{ link.go }}" style="{{ link.style }}" style-hover="color:#c9d1d9;background:#161b22">
        <span style="{{ link.labelStyle }}">{{ link.label }}</span>
        <span style="{{ link.badgeStyle }}">{{ link.badge }}</span>
      </button>
    </sc-for>

    <div style="padding:16px 8px 6px 14px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6e7681">Estate</div>
    <sc-for list="{{ estate }}" as="link" hint-placeholder-count="2">
      <button type="button" onClick="{{ link.go }}" style="{{ link.style }}" style-hover="color:#c9d1d9;background:#161b22">
        <span style="{{ link.labelStyle }}">{{ link.label }}</span>
        <span style="{{ link.badgeStyle }}">{{ link.badge }}</span>
      </button>
    </sc-for>

    <div style="padding:16px 8px 6px 14px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6e7681">Machine</div>
    <sc-for list="{{ machine }}" as="link" hint-placeholder-count="1">
      <button type="button" onClick="{{ link.go }}" style="{{ link.style }}" style-hover="color:#c9d1d9;background:#161b22">
        <span style="{{ link.labelStyle }}">{{ link.label }}</span>
        <span style="{{ link.badgeStyle }}">{{ link.badge }}</span>
      </button>
    </sc-for>

    <div style="display:flex;align-items:center;gap:6px;padding:16px 10px 5px 14px">
      <span style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6e7681">Running</span>
      <span style="font-size:10.5px;color:#484f58">4</span>
      <div style="flex:1"></div>
      <button type="button" onClick="{{ noop }}" title="New session" style="font:inherit;font-size:11px;line-height:1;color:#8b949e;background:transparent;border:1px solid #30363d;border-radius:3px;padding:2px 6px;cursor:pointer" style-hover="color:#c9d1d9;background:#1c232c">+</button>
    </div>
    <div style="display:flex;flex-direction:column;max-height:164px;overflow-y:auto">
      <sc-for list="{{ sessions }}" as="s" hint-placeholder-count="4">
        <button type="button" onClick="{{ s.open }}" title="{{ s.title }}" style="{{ s.style }}" style-hover="background:#161b22">
          <span style="{{ s.dotStyle }}"></span>
          <span style="{{ s.contStyle }}">{{ s.continuity }}</span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:left">
            <span style="font-size:12.5px;color:#c9d1d9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ s.name }}</span>
            <span style="font-size:10.5px;color:#6e7681;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ s.cwd }}</span>
          </span>
        </button>
      </sc-for>
    </div>

    <div style="display:flex;align-items:center;gap:6px;padding:14px 10px 5px 14px;border-top:1px solid #21262d;margin-top:8px">
      <span style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6e7681">Files</span>
      <div style="flex:1"></div>
      <button type="button" onClick="{{ noop }}" title="New file" style="font:inherit;font-size:11px;line-height:1;color:#8b949e;background:transparent;border:1px solid #30363d;border-radius:3px;padding:2px 6px;cursor:pointer" style-hover="color:#c9d1d9;background:#1c232c">+</button>
      <button type="button" onClick="{{ noop }}" title="Refresh" style="font:inherit;font-size:11px;line-height:1;color:#8b949e;background:transparent;border:1px solid #30363d;border-radius:3px;padding:2px 6px;cursor:pointer" style-hover="color:#c9d1d9;background:#1c232c">⟳</button>
    </div>
    <div style="padding:0 10px 6px 12px">
      <input type="search" onInput="{{ searchInput }}" placeholder="Search files…" style="width:100%;font:inherit;font-size:12px;color:#c9d1d9;background:#0d1117;border:1px solid #30363d;border-radius:4px;padding:5px 8px" />
    </div>
    <div style="flex:1;min-height:70px;overflow-y:auto;padding-bottom:6px">
      <sc-for list="{{ tree }}" as="node" hint-placeholder-count="8">
        <button type="button" onClick="{{ node.click }}" title="{{ node.path }}" style="{{ node.style }}" style-hover="background:#161b22;color:#c9d1d9">
          <span style="width:12px;flex:none;color:#6e7681;font-size:10px">{{ node.caret }}</span>
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left">{{ node.name }}</span>
          <span style="{{ node.badgeStyle }}">{{ node.badge }}</span>
        </button>
      </sc-for>
      <sc-if value="{{ searchMeta }}" hint-placeholder-val="{{ false }}">
        <div style="padding:6px 12px;font-size:11px;color:#6e7681">{{ searchMeta }}</div>
      </sc-if>
    </div>

    <div style="border-top:1px solid #30363d;padding:11px 14px;display:flex;align-items:center;gap:8px">
      <span style="width:7px;height:7px;border-radius:50%;background:#3fb950"></span>
      <span style="font-size:11.5px;color:#8b949e">connected</span>
      <button type="button" onClick="{{ noop }}" style="margin-left:auto;font:inherit;font-size:11.5px;color:#8b949e;background:transparent;border:0;cursor:pointer;padding:2px 4px" style-hover="color:#c9d1d9">Settings</button>
    </div>
  </nav>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden">
    <sc-if value="{{ onBoard }}" hint-placeholder-val="{{ true }}">
      <dc-import name="BoardSurface" embedded="{{ true }}" hint-size="100%,100%" style="flex:1;min-height:0"></dc-import>
    </sc-if>
    <sc-if value="{{ onBacklog }}" hint-placeholder-val="{{ false }}">
      <dc-import name="BacklogSurface" embedded="{{ true }}" hint-size="100%,100%" style="flex:1;min-height:0"></dc-import>
    </sc-if>
    <sc-if value="{{ onInbox }}" hint-placeholder-val="{{ false }}">
      <dc-import name="InboxSurface" embedded="{{ true }}" hint-size="100%,100%" style="flex:1;min-height:0"></dc-import>
    </sc-if>
    <sc-if value="{{ onSessions }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SessionsSurface" embedded="{{ true }}" hint-size="100%,100%" style="flex:1;min-height:0"></dc-import>
    </sc-if>
    <sc-if value="{{ onPlaceholder }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1;display:grid;place-items:center;gap:8px;text-align:center;padding:40px">
        <div style="font-size:16px;color:#c9d1d9">{{ placeholderTitle }}</div>
        <div style="font-size:12.5px;color:#8b949e;max-width:44ch;line-height:1.55">{{ placeholderBody }}</div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const SESSIONS = [
  { name: "clip-fix-3", cwd: "/srv/vogt", activity: "waiting-for-input", continuity: "protected" },
  { name: "sweep-nightly", cwd: "/srv/vogt", activity: "running", continuity: "protected" },
  { name: "web-dev", cwd: "/srv/vogt/web", activity: "idle", continuity: "unprotected" },
  { name: "engine", cwd: "/srv/vogt/engine", activity: "done", continuity: "recovering" },
];

const ACTIVITY_COLOR = { idle: "#6e7681", running: "#d29922", "waiting-for-input": "#f85149", errored: "#ff7b72", done: "#3fb950" };
const CONTINUITY = {
  protected: { glyph: "\u25cf", color: "#3fb950", title: "Protected" },
  recovering: { glyph: "\u25c6", color: "#d29922", title: "Recovery available" },
  unprotected: { glyph: "\u25cb", color: "#6e7681", title: "Unprotected: no captured agent session is bound" },
};

const TREE = [
  { path: "docs", name: "docs", dir: true, depth: 0 },
  { path: "docs/DESIGN.md", name: "DESIGN.md", dir: false, depth: 1 },
  { path: "docs/REQUIREMENTS.md", name: "REQUIREMENTS.md", dir: false, depth: 1 },
  { path: "docs/ROADMAP.md", name: "ROADMAP.md", dir: false, depth: 1 },
  { path: "engine", name: "engine", dir: true, depth: 0 },
  { path: "engine/server", name: "server", dir: true, depth: 1 },
  { path: "engine/contract", name: "contract", dir: true, depth: 1 },
  { path: "src", name: "src", dir: true, depth: 0 },
  { path: "src/vogt", name: "vogt", dir: true, depth: 1 },
  { path: "web", name: "web", dir: true, depth: 0 },
  { path: "web/src", name: "src", dir: true, depth: 1 },
  { path: "web/src/App.tsx", name: "App.tsx", dir: false, depth: 2, badge: "M" },
  { path: "web/src/Board.tsx", name: "Board.tsx", dir: false, depth: 2 },
  { path: "web/src/Backlog.tsx", name: "Backlog.tsx", dir: false, depth: 2 },
  { path: "web/src/AuditBrowser.tsx", name: "AuditBrowser.tsx", dir: false, depth: 2, badge: "M" },
  { path: "web/src/styles.css", name: "styles.css", dir: false, depth: 2 },
  { path: "mobile", name: "mobile", dir: true, depth: 0 },
  { path: "README.md", name: "README.md", dir: false, depth: 0 },
  { path: "pyproject.toml", name: "pyproject.toml", dir: false, depth: 0 },
];

class Component extends DCLogic {
  state = {
    surface: "board",
    expanded: { docs: true, web: true, "web/src": true },
    query: "",
  };

  link(id, label, badge, badgeColor) {
    const active = this.state.surface === id;
    return {
      label,
      badge: badge ?? "",
      style: `display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;font:inherit;font-size:13px;color:${active ? "#c9d1d9" : "#8b949e"};background:${active ? "#161b22" : "transparent"};border:0;border-left:2px solid ${active ? "#58a6ff" : "transparent"};padding:8px 14px 8px 12px;cursor:pointer`,
      labelStyle: `font-weight:${active ? 600 : 400}`,
      badgeStyle: badgeColor
        ? `min-width:20px;padding:0 6px;border-radius:9px;background:${badgeColor};color:#0d1117;font-size:10.5px;font-weight:700;line-height:18px;text-align:center`
        : "font-size:11px;color:#6e7681",
      go: () => this.setState({ surface: id }),
    };
  }

  renderVals() {
    const query = this.state.query.trim().toLowerCase();
    const nodes = query
      ? TREE.filter((n) => !n.dir && n.path.toLowerCase().includes(query)).map((n) => ({ ...n, depth: 0, flat: true }))
      : TREE.filter((n) => {
          const parts = n.path.split("/");
          for (let i = 1; i < parts.length; i += 1) {
            if (!this.state.expanded[parts.slice(0, i).join("/")]) return false;
          }
          return true;
        });

    const surface = this.state.surface;
    const placeholders = {
      projects: ["Projects", "Per-project state, contract age and the drift inbox. Not rebuilt yet \u2014 drift proposals currently surface in the Inbox instead."],
      audit: ["Audit", "Who wrote what and the reason they gave. Unchanged from today, minus the notifications toggle that now has its own place."],
    };

    return {
      work: [
        this.link("board", "Board", "34"),
        this.link("backlog", "Backlog", "118"),
        this.link("inbox", "Inbox", "9", "#f85149"),
      ],
      estate: [this.link("projects", "Projects", "4"), this.link("audit", "Audit", null)],
      machine: [this.link("sessions", "Sessions", "1 waiting")],
      onBoard: surface === "board",
      onBacklog: surface === "backlog",
      onInbox: surface === "inbox",
      onSessions: surface === "sessions",
      onPlaceholder: surface === "projects" || surface === "audit",
      placeholderTitle: (placeholders[surface] || [""])[0],
      placeholderBody: (placeholders[surface] || ["", ""])[1],
      sessions: SESSIONS.map((s) => {
        const cont = CONTINUITY[s.continuity];
        return {
          name: s.name,
          cwd: s.cwd,
          title: `${s.name}\ncwd: ${s.cwd}\n${cont.title}`,
          style: `display:flex;align-items:center;gap:7px;width:100%;border:0;border-left:2px solid ${s.activity === "waiting-for-input" ? "#f85149" : "transparent"};background:transparent;cursor:pointer;font:inherit;padding:6px 12px`,
          dotStyle: `flex:none;width:7px;height:7px;border-radius:50%;background:${ACTIVITY_COLOR[s.activity]}`,
          contStyle: `flex:none;font-size:9px;line-height:1;color:${cont.color}`,
          continuity: cont.glyph,
          open: () => {},
        };
      }),
      tree: nodes.map((n) => ({
        name: n.flat ? n.path : n.name,
        path: n.path,
        caret: n.dir ? (this.state.expanded[n.path] ? "\u25be" : "\u25b8") : "",
        badge: n.badge ?? "",
        badgeStyle: `flex:none;font-size:10px;color:${n.badge === "M" ? "#d29922" : "transparent"}`,
        style: `display:flex;align-items:center;gap:5px;width:100%;border:0;background:transparent;cursor:pointer;font:inherit;font-size:12px;padding:3px 10px 3px ${(n.flat ? 0 : n.depth) * 12 + 12}px;color:${n.dir ? "#c9d1d9" : "#8b949e"};font-weight:${n.dir ? 500 : 400}`,
        click: () => {
          if (n.dir) this.setState((s) => ({ expanded: { ...s.expanded, [n.path]: !s.expanded[n.path] } }));
        },
      })),
      searchInput: (e) => this.setState({ query: e.currentTarget.value }),
      searchMeta: query ? `${nodes.length} file match(es)` : null,
      noop: () => {},
    };
  }
}
</script>
</body>
</html>
