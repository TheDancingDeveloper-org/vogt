include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

// `capacitor.settings.gradle` is generated by `cap sync` (run `pnpm sync`) and
// is not committed: it hardcodes pnpm store paths that embed each plugin's
// resolved peer versions, so a committed copy silently drifts from the
// lockfile on any Capacitor/core bump and points Gradle at directories that no
// longer exist (#623). Fail with an actionable message instead of the opaque
// "Configuring project ':capacitor-app' without an existing directory".
def capacitorSettings = new File(settingsDir, 'capacitor.settings.gradle')
if (!capacitorSettings.exists()) {
    throw new GradleException(
        "mobile/android/capacitor.settings.gradle is missing. It is generated, " +
        "not committed: run `pnpm install --frozen-lockfile && pnpm sync` in " +
        "mobile/ before invoking Gradle.")
}
apply from: capacitorSettings