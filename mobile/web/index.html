<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <title>Vogt (offline)</title>
    <style>
      html, body { margin:0; padding:0; height:100%; background:#0d1117; color:#c9d1d9; font-family:system-ui,sans-serif; }
      .center { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; padding:24px; gap:12px; }
      .muted { color:#8b949e; font-size:13px; line-height:1.5; max-width:34em; }
      button { background:#1f6feb; color:white; border:0; border-radius:6px; padding:10px 18px; font-size:14px; }
    </style>
  </head>
  <body>
    <!--
      The fallback Capacitor shows when the configured front door does not
      answer on first load. It deliberately names no host: the URL is a build
      input with no default (FR-M1), so a hardcoded name here would be wrong
      for every APK built against a different one — and telling someone to
      check a server they are not pointed at is worse than not naming it.
    -->
    <div class="center">
      <h1>Vogt unreachable</h1>
      <div class="muted">
        The app could not reach the Vogt front door it was built against.
        Check that you are on the tailnet — Tailscale's Android app has to be
        running — and that the stack is up.
      </div>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
