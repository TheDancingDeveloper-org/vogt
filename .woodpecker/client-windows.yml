# Native Windows build + publish for the MyDevEnv2 desktop client.
#
# Runs on the `arbit-win` agent (platform windows/amd64, local backend) — the
# same box that builds Zed, so it has the Rust MSVC toolchain, fxc.exe, NSIS and
# git. A Linux cross-compile cannot produce a runnable gpui binary (gpui only
# precompiles its HLSL shaders via fxc on a Windows host), so the Windows
# artefact is built here; the Linux workflow (client.yml) handles fmt/clippy/
# test + the Linux binary only.
#
# SETUP (one-time, on the arbit-win box):
#   1. Bring the Woodpecker agent online (it was last seen 2026-05-11).
#   2. Deploy this repo's client/ci/windows/build-and-publish.ps1 to
#      C:\ci\mydevenv2\build-and-publish.ps1 (the version-controlled source).
#   3. Ensure the `forgejo_token` secret is available to this repo.
#
# Trigger: client version tags (client-v*) and manual runs only.

when:
  - event: tag
    ref: refs/tags/client-v*
  - event: manual

labels:
  platform: windows/amd64

# The local backend cannot run the default (Docker-based) clone plugin; the
# build script does its own git checkout of MyDevEnv2 + fluent-gpui.
skip_clone: true

steps:
  - name: build-and-publish
    image: cmd
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - powershell -ExecutionPolicy Bypass -File C:\ci\mydevenv2\build-and-publish.ps1

  - name: discord-success
    image: cmd
    when:
      - status: success
    environment:
      DISCORD_WEBHOOK:
        from_secret: discord_webhook_url
    commands:
      - powershell -Command "Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType 'application/json' -Body '{\"content\":\"MyDevEnv2 **client** Windows build succeeded\"}'"

  - name: discord-failure
    image: cmd
    when:
      - status: failure
    environment:
      DISCORD_WEBHOOK:
        from_secret: discord_webhook_url
    commands:
      - powershell -Command "Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType 'application/json' -Body '{\"content\":\"MyDevEnv2 **client** Windows build FAILED\"}'"
