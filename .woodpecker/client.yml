# MyDevEnv2 desktop client — CI/CD (Woodpecker)
#
# The client (`client/`) is a native GPUI/FluentGUI app in its own Cargo
# workspace. This workflow:
#   core-check     fmt + clippy + test of the GPUI-free core (fast)
#   clippy-gui     full clippy incl. the GPUI UI (compiles the GPUI graph)
#   build-windows  cross-compile x86_64-pc-windows-gnu + NSIS installer
#   build-linux    release Linux binary (smoke / parity)
#   forgejo-release on tag: publish Setup.exe + binaries to the release page
#
# GPUI Windows note: unlike rdpapp's older gpui 0.2.2 (which needed fxc.exe and
# was best-effort), the FluentGUI gpui 0.2.5 fork cross-compiles cleanly to
# windows-gnu from Linux with just mingw-w64 — verified producing a PE32+ exe.

labels:
  backend: docker
  platform: linux/amd64

when:
  - event: push
    branch: main
    path:
      include:
        - client/**
        - .woodpecker/client.yml
  # Only client version tags — NOT the server's rolling `apk-latest` tag.
  - event: tag
    ref: refs/tags/client-v*
  - event: manual
  - event: pull_request
    path:
      include:
        - client/**
        - .woodpecker/client.yml

# Match the server workflow's authenticated clone (default OAuth clone 403s).
clone:
  git:
    image: alpine/git
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - git init
      - git remote add origin "https://git:$GIT_AUTH_TOKEN@repo.indexarr.net/indexarr/MyDevEnv2.git"
      - |
        if [ -n "$CI_COMMIT_TAG" ]; then
          git fetch --no-tags --depth=1 origin "refs/tags/$CI_COMMIT_TAG"
        else
          git fetch --no-tags --depth=1 origin "$CI_COMMIT_SHA"
        fi
      - git checkout FETCH_HEAD

variables:
  # The client depends on FluentGUI by relative path (`../../FluentGUI` from
  # client/ = a sibling of the repo checkout). Clone the gpui fork there.
  # TODO: pin FLUENTGUI_REF to the gpui-0.2.5 release commit for reproducibility.
  # NB: use brace-free $VARs only — Woodpecker template-substitutes ${VAR}
  # before the shell runs (see server.yml header).
  # Pinned to the gpui-0.2.5 commit on indexarr/fluent-gpui main the client was
  # built and verified against. Bump deliberately alongside a client API update.
  - &fluentgui_setup |
    FLUENTGUI_REF=f601e54b4e58e416bc7495a75468b82af9a10545
    if [ ! -d ../FluentGUI/.git ]; then
      git clone --no-checkout "https://git:$GIT_AUTH_TOKEN@repo.indexarr.net/indexarr/fluent-gpui.git" ../FluentGUI
    fi
    git -C ../FluentGUI fetch --depth=1 origin "$FLUENTGUI_REF"
    git -C ../FluentGUI checkout --detach FETCH_HEAD
  # GPUI's Linux backend + fontconfig need these dev headers.
  - &linux_build_deps |
    apt-get update >/dev/null
    apt-get install -y --no-install-recommends \
      pkg-config libfontconfig1-dev libxcb1-dev libxkbcommon-dev \
      libxkbcommon-x11-dev libssl-dev libdbus-1-dev libgtk-3-dev >/dev/null
  - &install_sccache |
    curl -sSfL "https://github.com/mozilla/sccache/releases/download/v0.10.0/sccache-v0.10.0-x86_64-unknown-linux-musl.tar.gz" \
      | tar -xz -C /tmp && mv /tmp/sccache-v0.10.0-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache

steps:
  # ── Core (GPUI-free) checks — fast feedback ─────────────────────────────
  - name: core-check
    image: rust:1.95-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: "redis://100.92.54.45:6380"
    commands:
      - *fluentgui_setup
      - *install_sccache
      - rustup component add rustfmt clippy
      - cd client
      - cargo fmt --all -- --check
      - cargo clippy --no-default-features --all-targets -- -D warnings
      - cargo test --no-default-features
      - sccache --show-stats

  # ── Full clippy incl. the GPUI UI ───────────────────────────────────────
  - name: clippy-gui
    image: rust:1.95-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: "redis://100.92.54.45:6380"
    commands:
      - *fluentgui_setup
      - *linux_build_deps
      - *install_sccache
      - rustup component add clippy
      - cd client
      - cargo clippy --all-targets -- -D warnings
      - sccache --show-stats

  # ── Windows cross-compile + NSIS installer ──────────────────────────────
  - name: build-windows
    image: rust:1.95-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: "redis://100.92.54.45:6380"
    commands:
      - *fluentgui_setup
      - apt-get update >/dev/null
      - apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 nasm nsis >/dev/null
      - *install_sccache
      - rustup target add x86_64-pc-windows-gnu
      - cd client
      # win-dist (debug-assertions on) avoids gpui's fxc-only release shader
      # precompile, which can't run when cross-compiling from Linux.
      - cargo build --profile win-dist --target x86_64-pc-windows-gnu
      # Absolute path: makensis resolves a relative File source against the .nsi
      # script's directory (installer/), not the shell cwd, so a relative
      # target/... path is not found. Pass absolute paths to be unambiguous.
      - EXE="$(pwd)/target/x86_64-pc-windows-gnu/win-dist/mydevenv2-client.exe"
      - x86_64-w64-mingw32-strip "$EXE" || true
      - ls -lh "$EXE"
      - VERSION=$(echo "$CI_COMMIT_TAG" | sed 's/^client-v//; s/^v//'); [ -n "$VERSION" ] || VERSION=0.0.0
      - OUT="$(pwd)/MyDevEnv2-Setup-$VERSION.exe"
      - makensis -DVERSION="$VERSION" -DSRCEXE="$EXE" -DOUTFILE="$OUT" installer/mydevenv2-client.nsi
      - ls -lh "$OUT"
      - sccache --show-stats

  # ── Linux release binary (parity / smoke) ───────────────────────────────
  - name: build-linux
    image: rust:1.95-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: "redis://100.92.54.45:6380"
    commands:
      - *fluentgui_setup
      - *linux_build_deps
      - *install_sccache
      - cd client
      - cargo build --release
      - ls -lh target/release/mydevenv2-client
      - sccache --show-stats

  # ── Publish to the Forgejo release page (tags only) ─────────────────────
  - name: forgejo-release
    image: alpine:3.23
    when:
      - event: tag
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - apk add --no-cache curl jq coreutils
      - cd client
      - TAG="$CI_COMMIT_TAG"
      - VERSION=$(echo "$TAG" | sed 's/^client-v//; s/^v//'); [ -n "$VERSION" ] || VERSION=0.0.0
      - cp "MyDevEnv2-Setup-$VERSION.exe" "MyDevEnv2-Client-$TAG-Setup.exe"
      - cp target/x86_64-pc-windows-gnu/win-dist/mydevenv2-client.exe "MyDevEnv2-Client-$TAG-windows-x86_64.exe" 2>/dev/null || true
      - cp target/release/mydevenv2-client "MyDevEnv2-Client-$TAG-linux-x86_64" 2>/dev/null || true
      - |
        API="https://repo.indexarr.net/api/v1"
        REPO="indexarr/MyDevEnv2"

        # Checksums over the artefacts that actually exist (kept in this block so
        # cwd/vars match the upload loop below). Visible in the step log.
        SUMS="SHA256SUMS-$TAG.txt"
        : > "$SUMS"
        for b in "MyDevEnv2-Client-$TAG-Setup.exe" "MyDevEnv2-Client-$TAG-windows-x86_64.exe" "MyDevEnv2-Client-$TAG-linux-x86_64"; do
          [ -f "$b" ] && sha256sum "$b" | tee -a "$SUMS"
        done
        BODY="## MyDevEnv2 desktop client $TAG\n\n"
        BODY="$BODY- **Windows installer**: \`MyDevEnv2-Client-$TAG-Setup.exe\`\n"
        BODY="$BODY- **Windows portable**: \`MyDevEnv2-Client-$TAG-windows-x86_64.exe\`\n"
        [ -f "MyDevEnv2-Client-$TAG-linux-x86_64" ] && BODY="$BODY- **Linux x86_64**: \`MyDevEnv2-Client-$TAG-linux-x86_64\`\n"
        BODY="$BODY\nSHA256 checksums in \`SHA256SUMS-$TAG.txt\`"

        EXISTING=$(curl -sf -H "Authorization: token $GIT_AUTH_TOKEN" "$API/repos/$REPO/releases/tags/$TAG" 2>/dev/null || true)
        RELEASE_ID=$(echo "$EXISTING" | jq -r '.id // empty' 2>/dev/null || true)
        if [ -z "$RELEASE_ID" ]; then
          RELEASE_ID=$(curl -sf -X POST \
            -H "Authorization: token $GIT_AUTH_TOKEN" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"MyDevEnv2 client $TAG\",\"body\":\"$BODY\",\"draft\":false,\"prerelease\":true}" \
            "$API/repos/$REPO/releases" | jq -r '.id')
        fi
        if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
          echo "ERROR: failed to resolve Forgejo release id"; exit 1
        fi
        for f in "MyDevEnv2-Client-$TAG-Setup.exe" "MyDevEnv2-Client-$TAG-windows-x86_64.exe" "MyDevEnv2-Client-$TAG-linux-x86_64" "SHA256SUMS-$TAG.txt"; do
          [ -f "$f" ] || continue
          curl -sf -X POST -H "Authorization: token $GIT_AUTH_TOKEN" \
            -F "attachment=@$f" "$API/repos/$REPO/releases/$RELEASE_ID/assets" > /dev/null \
            && echo "uploaded $f"
        done

  - name: discord-success
    image: alpine/curl
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        HASH=$(echo $CI_COMMIT_SHA | head -c 7)
        curl -sf -H "Content-Type: application/json" -d "{
          \"embeds\": [{
            \"title\": \"MyDevEnv2 client build successful\",
            \"description\": \"**${CI_REPO}** — [$HASH]($CI_REPO_URL/commit/$CI_COMMIT_SHA)\",
            \"color\": 5025616,
            \"footer\": {\"text\": \"$CI_REPO • $CI_COMMIT_AUTHOR\"},
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }]
        }" "$DISCORD_WEBHOOK_URL" || true
    when:
      - status: [success]

  - name: discord-failure
    image: alpine/curl
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        HASH=$(echo $CI_COMMIT_SHA | head -c 7)
        curl -sf -H "Content-Type: application/json" -d "{
          \"embeds\": [{
            \"title\": \"MyDevEnv2 client build failed\",
            \"description\": \"**${CI_REPO}** — [$HASH]($CI_REPO_URL/commit/$CI_COMMIT_SHA)\",
            \"color\": 15548997,
            \"footer\": {\"text\": \"$CI_REPO • $CI_COMMIT_AUTHOR\"},
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }]
        }" "$DISCORD_WEBHOOK_URL" || true
    when:
      - status: [failure]
