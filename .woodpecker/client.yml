# MyDevEnv2 desktop client — Linux CI/CD (Woodpecker)
#
# The client (`client/`) is a native fluent-gpui app in its own Cargo
# workspace. This (Linux) workflow:
#   core-check      fmt + clippy + test of the GPUI-free core (fast)
#   clippy-gui      full clippy incl. the GPUI UI (compiles the GPUI graph)
#   build-linux     release Linux binary
#   forgejo-release on tag: publish the Linux binary to the release page
#
# Windows is built NATIVELY on the arbit-win agent (see client-windows.yml):
# gpui precompiles its HLSL shaders via fxc only on a Windows host, so a Linux
# cross-compile can't produce a runnable Windows binary.

labels:
  backend: docker
  platform: linux/amd64

when:
  - event: push
    branch: main
    path:
      include:
        - client/**
        - .woodpecker/client.yml
  # Only client version tags — NOT the server's rolling `apk-latest` tag.
  - event: tag
    ref: refs/tags/client-v*
  - event: manual
  - event: pull_request
    path:
      include:
        - client/**
        - .woodpecker/client.yml

# Match the server workflow's authenticated clone (default OAuth clone 403s).
clone:
  git:
    image: alpine/git
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - git init
      - git remote add origin "https://git:$GIT_AUTH_TOKEN@repo.indexarr.net/indexarr/MyDevEnv2.git"
      - |
        if [ -n "$CI_COMMIT_TAG" ]; then
          git fetch --no-tags --depth=1 origin "refs/tags/$CI_COMMIT_TAG"
        else
          git fetch --no-tags --depth=1 origin "$CI_COMMIT_SHA"
        fi
      - git checkout FETCH_HEAD

variables:
  # fluent-gpui is consumed directly from
  # https://github.com/AusAgentSmith-org/fluent-gpui.git at the commit pinned in
  # client/Cargo.toml and Cargo.lock. Bump deliberately alongside a client API
  # update.
  # GPUI's Linux backend + fontconfig need these dev headers.
  - &linux_build_deps |
    apt-get update >/dev/null
    apt-get install -y --no-install-recommends \
      pkg-config libfontconfig1-dev libxcb1-dev libxkbcommon-dev \
      libxkbcommon-x11-dev libssl-dev libdbus-1-dev libgtk-3-dev >/dev/null
  - &install_sccache |
    curl -sSfL "https://github.com/mozilla/sccache/releases/download/v0.10.0/sccache-v0.10.0-x86_64-unknown-linux-musl.tar.gz" \
      | tar -xz -C /tmp && mv /tmp/sccache-v0.10.0-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache

steps:
  # ── Core (GPUI-free) checks — fast feedback ─────────────────────────────
  - name: core-check
    image: rust:1.95-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: "redis://100.92.54.45:6380"
    commands:
      - *install_sccache
      - rustup component add rustfmt clippy
      - cd client
      - cargo fmt --all -- --check
      - cargo clippy --no-default-features --all-targets -- -D warnings
      - cargo test --no-default-features
      - sccache --show-stats

  # ── Full clippy incl. the GPUI UI ───────────────────────────────────────
  - name: clippy-gui
    image: rust:1.95-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: "redis://100.92.54.45:6380"
    commands:
      - *linux_build_deps
      - *install_sccache
      - rustup component add clippy
      - cd client
      - cargo clippy --all-targets -- -D warnings
      - sccache --show-stats

  # NOTE: Windows is built natively on the arbit-win agent — see
  # `.woodpecker/client-windows.yml`. Cross-compiling gpui to Windows from Linux
  # cannot produce a runnable binary (gpui precompiles its HLSL shaders via fxc
  # only on a Windows host), so this workflow no longer builds/publishes Windows.

  # ── Linux release binary (parity / smoke) ───────────────────────────────
  - name: build-linux
    image: rust:1.95-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: "redis://100.92.54.45:6380"
    commands:
      - *linux_build_deps
      - *install_sccache
      - cd client
      - cargo build --release
      - ls -lh target/release/mydevenv2-client
      - sccache --show-stats

  # ── Publish to the Forgejo release page (tags only) ─────────────────────
  - name: forgejo-release
    image: alpine:3.23
    when:
      - event: tag
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - apk add --no-cache curl jq coreutils
      - cd client
      - TAG="$CI_COMMIT_TAG"
      - cp target/release/mydevenv2-client "MyDevEnv2-Client-$TAG-linux-x86_64"
      - |
        API="https://repo.indexarr.net/api/v1"
        REPO="indexarr/MyDevEnv2"

        # Linux-only assets here; Windows installer + portable exe are published
        # to the same release by the native Windows workflow (client-windows.yml).
        SUMS="SHA256SUMS-$TAG-linux.txt"
        sha256sum "MyDevEnv2-Client-$TAG-linux-x86_64" | tee "$SUMS"

        BODY="## MyDevEnv2 desktop client $TAG\n\n- **Linux x86_64**: \`MyDevEnv2-Client-$TAG-linux-x86_64\`\n\nWindows installer is attached by the native Windows build."

        EXISTING=$(curl -sf -H "Authorization: token $GIT_AUTH_TOKEN" "$API/repos/$REPO/releases/tags/$TAG" 2>/dev/null || true)
        RELEASE_ID=$(echo "$EXISTING" | jq -r '.id // empty' 2>/dev/null || true)
        if [ -z "$RELEASE_ID" ]; then
          RELEASE_ID=$(curl -sf -X POST \
            -H "Authorization: token $GIT_AUTH_TOKEN" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"MyDevEnv2 client $TAG\",\"body\":\"$BODY\",\"draft\":false,\"prerelease\":true}" \
            "$API/repos/$REPO/releases" | jq -r '.id')
        fi
        if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
          echo "ERROR: failed to resolve Forgejo release id"; exit 1
        fi
        for f in "MyDevEnv2-Client-$TAG-linux-x86_64" "$SUMS"; do
          [ -f "$f" ] || continue
          curl -sf -X POST -H "Authorization: token $GIT_AUTH_TOKEN" \
            -F "attachment=@$f" "$API/repos/$REPO/releases/$RELEASE_ID/assets" > /dev/null \
            && echo "uploaded $f"
        done

  - name: discord-success
    image: alpine/curl
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        HASH=$(echo $CI_COMMIT_SHA | head -c 7)
        curl -sf -H "Content-Type: application/json" -d "{
          \"embeds\": [{
            \"title\": \"MyDevEnv2 client build successful\",
            \"description\": \"**${CI_REPO}** — [$HASH]($CI_REPO_URL/commit/$CI_COMMIT_SHA)\",
            \"color\": 5025616,
            \"footer\": {\"text\": \"$CI_REPO • $CI_COMMIT_AUTHOR\"},
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }]
        }" "$DISCORD_WEBHOOK_URL" || true
    when:
      - status: [success]

  - name: discord-failure
    image: alpine/curl
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        HASH=$(echo $CI_COMMIT_SHA | head -c 7)
        curl -sf -H "Content-Type: application/json" -d "{
          \"embeds\": [{
            \"title\": \"MyDevEnv2 client build failed\",
            \"description\": \"**${CI_REPO}** — [$HASH]($CI_REPO_URL/commit/$CI_COMMIT_SHA)\",
            \"color\": 15548997,
            \"footer\": {\"text\": \"$CI_REPO • $CI_COMMIT_AUTHOR\"},
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }]
        }" "$DISCORD_WEBHOOK_URL" || true
    when:
      - status: [failure]
