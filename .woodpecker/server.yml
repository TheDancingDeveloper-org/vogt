# MyDevEnv2 — CI pipeline (Woodpecker)
#
# Steps:
#   fmt / clippy / test         Rust checks
#   web-typecheck               TS sanity on the PWA
#   build-and-push              Single Docker image tagged :latest + :<sha>
#   komodo-deploy               Pin the SHA in ops/personal/mydevenv2/ and
#                               trigger a Komodo redeploy on Node B
#   discord-success / -failure  Notifications

labels:
  backend: docker
  platform: linux/amd64

when:
  # Skip the server pipeline for edits isolated to the deprecated native
  # desktop client tree. The supported product surfaces are the server, PWA,
  # and Android wrap.
  - event: push
    branch: main
    path:
      exclude:
        - client/**
  - event: manual
  - event: pull_request
    path:
      exclude:
        - client/**

# Custom clone using org secret. The default OAuth-based clone started 403'ing
# (pipelines #17+), so we authenticate explicitly with git_auth_token.
#
# IMPORTANT: use $VAR (no braces) for env-var references in commands. Woodpecker
# template-substitutes ${VAR} before the container runs — unknown vars become
# empty strings. Use $$VAR or $${VAR} to escape Woodpecker's templating if you
# need braces. CI_* built-ins are fine either way.
clone:
  git:
    image: alpine/git
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - git init
      - git remote add origin "https://git:$GIT_AUTH_TOKEN@repo.indexarr.net/indexarr/MyDevEnv2.git"
      - git fetch --no-tags --depth=1 origin "$CI_COMMIT_SHA"
      - git checkout FETCH_HEAD

steps:
  - name: fmt
    image: rust:1.95-bookworm
    environment:
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: "redis://100.92.54.45:6380"
      SCCACHE_VERSION: "0.10.0"
      SCCACHE_SHA256: "1fbb35e135660d04a2d5e42b59c7874d39b3deb17de56330b25b713ec59f849b"
    commands:
      - bash .woodpecker/install-sccache.sh
      # sccache Redis is a best-effort shared cache. If it's unreachable, build
      # without it rather than failing CI — a down dev cache must never block a
      # production image build. Exports persist across commands in the step.
      - if ! timeout 3 bash -c 'exec 3<>/dev/tcp/100.92.54.45/6380' 2>/dev/null; then echo "WARN sccache Redis unreachable — building without cache"; export RUSTC_WRAPPER=""; fi
      - rustup component add rustfmt
      - cargo fmt --all -- --check

  - name: clippy
    image: rust:1.95-bookworm
    environment:
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: "redis://100.92.54.45:6380"
      SCCACHE_VERSION: "0.10.0"
      SCCACHE_SHA256: "1fbb35e135660d04a2d5e42b59c7874d39b3deb17de56330b25b713ec59f849b"
    commands:
      - bash .woodpecker/install-sccache.sh
      # See fmt step: fall back to no-cache if the sccache Redis is down.
      - if ! timeout 3 bash -c 'exec 3<>/dev/tcp/100.92.54.45/6380' 2>/dev/null; then echo "WARN sccache Redis unreachable — building without cache"; export RUSTC_WRAPPER=""; fi
      - rustup component add clippy
      # web/dist doesn't exist in CI yet; create an empty placeholder so
      # rust-embed compiles. The build-and-push stage produces the real one.
      - mkdir -p web/dist && touch web/dist/.placeholder
      - cargo clippy --all-targets -- -D warnings

  - name: test
    image: rust:1.95-bookworm
    environment:
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: "redis://100.92.54.45:6380"
      SCCACHE_VERSION: "0.10.0"
      SCCACHE_SHA256: "1fbb35e135660d04a2d5e42b59c7874d39b3deb17de56330b25b713ec59f849b"
    commands:
      - bash .woodpecker/install-sccache.sh
      # See fmt step: fall back to no-cache if the sccache Redis is down.
      - if ! timeout 3 bash -c 'exec 3<>/dev/tcp/100.92.54.45/6380' 2>/dev/null; then echo "WARN sccache Redis unreachable — building without cache"; export RUSTC_WRAPPER=""; fi
      - apt-get update >/dev/null && apt-get install -y --no-install-recommends git ripgrep >/dev/null
      - mkdir -p web/dist && touch web/dist/.placeholder
      - cargo test --all
      - if [ -n "$RUSTC_WRAPPER" ]; then sccache --show-stats; fi

  - name: web-typecheck
    image: node:22-bookworm
    commands:
      - npm install -g pnpm@10 >/dev/null
      - cd web && pnpm install --frozen-lockfile >/dev/null && pnpm typecheck

  - name: mobile-apk
    image: cimg/android:2025.04.1-node
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
      MYDEVENV2_ANDROID_KEYSTORE_BASE64:
        from_secret: mydevenv2_android_keystore_base64
      MYDEVENV2_ANDROID_KEYSTORE_PASSWORD:
        from_secret: mydevenv2_android_keystore_password
      MYDEVENV2_ANDROID_KEY_ALIAS:
        from_secret: mydevenv2_android_key_alias
      MYDEVENV2_ANDROID_KEY_PASSWORD:
        from_secret: mydevenv2_android_key_password
    commands:
      # cimg/android runs as circleci (UID 3434); the workspace was cloned by
      # alpine/git as root. Take ownership so pnpm can write node_modules.
      - sudo chown -R circleci:circleci .
      - |
        set -eu
        : "${MYDEVENV2_ANDROID_KEYSTORE_BASE64:?missing mydevenv2_android_keystore_base64 secret}"
        : "${MYDEVENV2_ANDROID_KEYSTORE_PASSWORD:?missing mydevenv2_android_keystore_password secret}"
        : "${MYDEVENV2_ANDROID_KEY_ALIAS:?missing mydevenv2_android_key_alias secret}"
        : "${MYDEVENV2_ANDROID_KEY_PASSWORD:?missing mydevenv2_android_key_password secret}"
        umask 077
        export MYDEVENV2_ANDROID_KEYSTORE_PATH=/tmp/mydevenv2-release.keystore
        printf '%s' "$MYDEVENV2_ANDROID_KEYSTORE_BASE64" | base64 -d > "$MYDEVENV2_ANDROID_KEYSTORE_PATH"
      - cd mobile
      - sudo npm install -g pnpm@10 >/dev/null
      - pnpm install --frozen-lockfile
      - |
        set -eu
        VERSION_NAME=$(node -p "const pkg = require('./package.json'); const sha = (process.env.CI_COMMIT_SHA || 'local').slice(0, 7); pkg.version + '+' + sha")
        VERSION_CODE=$(git show -s --format=%ct "$CI_COMMIT_SHA")
        export MYDEVENV2_ANDROID_VERSION_NAME="$VERSION_NAME"
        export MYDEVENV2_ANDROID_VERSION_CODE="$VERSION_CODE"
        echo "Android release version: $MYDEVENV2_ANDROID_VERSION_NAME ($MYDEVENV2_ANDROID_VERSION_CODE)"
        npx cap sync android
        cd android
        ./gradlew assembleRelease --no-daemon -q
        cd ..
      - ls -lh android/app/build/outputs/apk/release/app-release.apk
      - |
        set -eu
        BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
        "$BUILD_TOOLS_DIR/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
      - |
        # cimg/android runs commands with /bin/sh (dash), so no `set -o pipefail`.
        # The forgejo-api wrapper logs status before any pipe, so a failure
        # upstream of a `| python3` still has a clear pipeline-log error line.
        set -eu
        APK=android/app/build/outputs/apk/release/app-release.apk
        APK_VERSION_NAME=$(node -p "const pkg = require('./package.json'); const sha = (process.env.CI_COMMIT_SHA || 'local').slice(0, 7); pkg.version + '+' + sha")
        APK_ASSET_SUFFIX=$(printf '%s' "$APK_VERSION_NAME" | tr '+/' '--')
        APK_ASSET_NAME="mydevenv2-${APK_ASSET_SUFFIX}.apk"
        REPO=/api/v1/repos/indexarr/MyDevEnv2

        # Pull the shared Forgejo API wrapper from ops. Logs status + body on
        # errors instead of swallowing them — see scripts/forgejo-api.sh in
        # indexarr/ops for why this isn't inline curl.
        sudo curl -sSf -H "Authorization: token $GIT_AUTH_TOKEN" \
          -o /usr/local/bin/forgejo-api \
          https://repo.indexarr.net/indexarr/ops/raw/branch/main/scripts/forgejo-api.sh
        sudo chmod +x /usr/local/bin/forgejo-api
        export FORGEJO_TOKEN="$GIT_AUTH_TOKEN"

        # Clear any existing apk-latest release+tag so the create below can't
        # collide. --allow 404 = "fine if nothing was there".
        EXISTING_ID=$(forgejo-api GET "$REPO/releases/tags/apk-latest" --allow 404 \
          | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
        if [ -n "$EXISTING_ID" ]; then
          forgejo-api DELETE "$REPO/releases/$EXISTING_ID" --allow 404 >/dev/null
        fi
        forgejo-api DELETE "$REPO/tags/apk-latest" --allow 404 >/dev/null

        RELEASE_ID=$(forgejo-api POST "$REPO/releases" \
          --data "{\"tag_name\":\"apk-latest\",\"target_commitish\":\"$CI_COMMIT_SHA\",\"name\":\"Latest APK ($APK_VERSION_NAME)\",\"prerelease\":true,\"body\":\"Signed release APK — version $APK_VERSION_NAME, commit $CI_COMMIT_SHA\"}" \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

        forgejo-api POST "$REPO/releases/$RELEASE_ID/assets?name=$APK_ASSET_NAME" \
          --form "attachment=@$APK" >/dev/null
        rm -f "$MYDEVENV2_ANDROID_KEYSTORE_PATH"
        echo "uploaded $APK as $APK_ASSET_NAME to release $RELEASE_ID"
    when:
      - event: push
        branch: main

  - name: build-and-push
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: repo.indexarr.net/indexarr/mydevenv2
      registry: repo.indexarr.net
      username:
        from_secret: git_auth_token
      password:
        from_secret: git_auth_token
      dockerfile: Dockerfile
      tags:
        - latest
        - ${CI_COMMIT_SHA}
    when:
      - event: push
        branch: main

  - name: komodo-deploy
    image: alpine:3.23
    when:
      - event: push
        branch: main
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
      KOMODO_API_KEY:
        from_secret: komodo_api_key
      KOMODO_API_SECRET:
        from_secret: komodo_api_secret
    commands:
      - apk add --no-cache bash git curl python3 >/dev/null
      - 'curl -sSf -H "Authorization: token $GIT_AUTH_TOKEN" -o /tmp/komodo-deploy.sh https://repo.indexarr.net/indexarr/ops/raw/branch/main/scripts/komodo-deploy.sh'
      - chmod +x /tmp/komodo-deploy.sh
      - STACK_NAME=prod-mydevenv2 STACK_DIR=personal/mydevenv2 IMAGE_NAME=repo.indexarr.net/indexarr/mydevenv2 IMAGE_TAG=$CI_COMMIT_SHA bash /tmp/komodo-deploy.sh

  - name: discord-success
    image: alpine/curl
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        HASH=$(echo $CI_COMMIT_SHA | head -c 7)
        curl -sf -H "Content-Type: application/json" -d "{
          \"embeds\": [{
            \"title\": \"Build Successful\",
            \"description\": \"**${CI_REPO}** — [$HASH]($CI_REPO_URL/commit/$CI_COMMIT_SHA)\",
            \"color\": 5025616,
            \"footer\": {\"text\": \"$CI_REPO • $CI_COMMIT_AUTHOR\"},
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }]
        }" "$DISCORD_WEBHOOK_URL" || true
    when:
      - status: [success]

  - name: discord-failure
    image: alpine/curl
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        HASH=$(echo $CI_COMMIT_SHA | head -c 7)
        curl -sf -H "Content-Type: application/json" -d "{
          \"embeds\": [{
            \"title\": \"Build Failed\",
            \"description\": \"**${CI_REPO}** — [$HASH]($CI_REPO_URL/commit/$CI_COMMIT_SHA)\",
            \"color\": 15548997,
            \"footer\": {\"text\": \"$CI_REPO • $CI_COMMIT_AUTHOR\"},
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }]
        }" "$DISCORD_WEBHOOK_URL" || true
    when:
      - status: [failure]
