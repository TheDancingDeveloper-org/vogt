# Engine pod — single-container sample compose (a template, not a live stack).
#
# THE SUPPORTED PUBLIC PATH IS `deploy/engine.overlay.yml`. That overlay builds
# the engine from source in front of the public core image and carries no host
# paths, tailnet or secrets-manager assumptions — read `docs/DEPLOYMENT.md` §3.2.
# This file is only a minimal example of running a *prebuilt* merged image
# standalone; every deployment-specific value is a `${VAR}` placeholder with no
# baked address, so a reader must fill them in rather than inherit anyone's
# estate. The maintainer's own deployment lives in `deploy/estate.overlay.yml`.
#
# Bind-mount host paths are absolute by design — a stack manager that clones the
# stack to a fresh directory each deploy resolves `./relative` paths to nothing.

services:
  engine:
    # A prebuilt merged image. There is no published engine image, so either
    # point this at one you built (`docker build -f engine/Dockerfile .`) or use
    # `deploy/engine.overlay.yml`, which builds from source for you.
    image: "${ENGINE_IMAGE:?set ENGINE_IMAGE to a merged engine image you built, or use deploy/engine.overlay.yml}"
    container_name: "${ENGINE_CONTAINER_NAME:-vogt-engine}"
    restart: unless-stopped
    hostname: "${ENGINE_CONTAINER_NAME:-vogt-engine}"

    # `vogt-engine` execs as PID 1 (see entrypoint.sh). It only wait()s on the
    # children it spawns directly (one-shot `git` calls, PTY session children);
    # it has no SIGCHLD reaper for orphans reparented to PID 1. Terminal
    # sessions running agents fork short-lived subprocesses whose immediate
    # parent can exit first, leaving an orphan that reparents to PID 1 and is
    # never reaped. Docker's `init: true` inserts tini as the real PID 1, which
    # reaps all of these, so vogt-engine never needs to.
    init: true

    # The published port. Bind to a specific address (a tailnet/VPN address, or
    # 127.0.0.1 behind a reverse proxy) rather than the wildcard.
    ports:
      - "${ENGINE_BIND_IP:-127.0.0.1}:${ENGINE_PORT:-8910}:8910"

    # Kernel-mode Tailscale needs these; drop them if you do not run Tailscale
    # inside the container. Without them tailscaled falls back and any exit node
    # silently no-ops.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

    volumes:
      # The workspace. ALL development happens here. Left side is a host path
      # you choose; right side is the in-image home and must not change.
      - "${ENGINE_WORKSPACE_DIR:?set ENGINE_WORKSPACE_DIR to the host workspace directory}:/home/sprooty/Working"
      # Persist the pod's home (caches, history, agent state) across rebuilds.
      - "${ENGINE_HOME_DIR:?set ENGINE_HOME_DIR to the host home directory}:/home/sprooty"
      # Persist tailscaled state so the pod does not re-auth on every restart.
      - "${ENGINE_TAILSCALE_DIR:?set ENGINE_TAILSCALE_DIR to the host tailscale-state directory}:/var/lib/tailscale"

    environment:
      # Server. The engine bearer token, required (>=16 chars).
      ENGINE_TOKEN: "${ENGINE_TOKEN:?the engine's primary bearer token, at least 16 characters}"
      # Optional scoped tokens. JSON array of objects:
      # [{"name":"readonly","token":"...","capabilities":[]}]
      ENGINE_EXTRA_TOKENS_JSON: "${ENGINE_EXTRA_TOKENS_JSON:-}"
      ENGINE_MUTATING_REQUEST_LIMIT_PER_MINUTE: "${ENGINE_MUTATING_REQUEST_LIMIT_PER_MINUTE:-600}"
      ENGINE_BIND: 0.0.0.0:8910
      ENGINE_SCROLLBACK_BYTES: "${ENGINE_SCROLLBACK_BYTES:-4194304}"
      RUST_LOG: "${RUST_LOG:-info}"

      # ── Agent service auth (optional) ──────────────────────────────────────
      # Point ENGINE_AGENT_AUTH_HELPER at a helper that brokers service
      # credentials into sessions, or leave everything below unset and sessions
      # run as plain shells. The bundled Infisical example
      # (`mydevenv2-agent-auth`) is auto-selected when a machine identity is
      # present; it is driven entirely by ENGINE_AGENT_AUTH_SECRETS (see the
      # script header). No secrets-manager address is baked in.
      INFISICAL_API_URL: "${INFISICAL_API_URL:-}"
      INFISICAL_CLIENT_ID: "${INFISICAL_CLIENT_ID:-}"
      INFISICAL_CLIENT_SECRET: "${INFISICAL_CLIENT_SECRET:-}"
      ENGINE_AGENT_AUTH_REQUIRED: "${ENGINE_AGENT_AUTH_REQUIRED:-0}"
      ENGINE_AUTO_AGENT_AUTH: "${ENGINE_AUTO_AGENT_AUTH:-0}"

      # ── Cadastre (separate product, opt-in — NFR-O5) ───────────────────────
      # Off unless you run a Cadastre bridge and name its endpoint.
      CADASTRE_MCP_ENABLED: "${CADASTRE_MCP_ENABLED:-0}"
      CADASTRE_MCP_URL: "${CADASTRE_MCP_URL:-}"

      # ── Tailnet (optional) ─────────────────────────────────────────────────
      # Set an auth key to auto-join; leave empty to run without Tailscale.
      TAILSCALE_AUTH_KEY: "${TAILSCALE_AUTH_KEY:-}"
      TAILSCALE_HOSTNAME: "${TAILSCALE_HOSTNAME:-vogt-engine}"
      MYDEVENV2_TAILSCALE_ACCEPT_DNS: "${ENGINE_TAILSCALE_ACCEPT_DNS:-1}"
      # Route public egress via this exit node when explicitly set. Blank by
      # default: LAN + tailnet + accepted subnet routes stay direct.
      TAILSCALE_EXIT_NODE: "${ENGINE_TAILSCALE_EXIT_NODE:-}"

      # ── Optional surfaces, each of which degrades rather than fails ─────────
      START_SWAY: "${START_SWAY:-0}"
      GUI_STREAM_URL: "${GUI_STREAM_URL:-}"
      # FCM service-account JSON (single-line). Empty disables the FCM
      # transport; web-push still works for any browser subscription.
      ENGINE_FCM_SERVICE_ACCOUNT_JSON: "${ENGINE_FCM_SERVICE_ACCOUNT_JSON:-}"
      # Conversational assistant. Empty key disables it — routes 404 and the PWA
      # hides the tab. A key with no base URL is a startup error, not a silent
      # default provider.
      ENGINE_ASSISTANT_API_KEY: "${ENGINE_ASSISTANT_API_KEY:-}"
      ENGINE_ASSISTANT_MODEL: "${ENGINE_ASSISTANT_MODEL:-}"
      ENGINE_ASSISTANT_BASE_URL: "${ENGINE_ASSISTANT_BASE_URL:-}"
      # The cargo cache lives on the home bind mount; point sccache at a Redis
      # you run, or leave it unset — an absent sccache costs build speed only.
      SCCACHE_REDIS: "${SCCACHE_REDIS:-}"

    # Host Docker access is intentionally NOT enabled here. Add an explicit
    # docker-socket overlay when you want host-daemon access from a session.

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8910/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
