# MyDevEnv2 — Komodo stack
#
# Copy this file into the ops repo at `personal/mydevenv2/docker-compose.yml`,
# then create the Komodo stack (see deploy/KOMODO.md). The CI pipeline
# rewrites the image: line to pin the deployed SHA.
#
# Bind-mount paths are absolute by design — Komodo clones the stack to a
# fresh directory each deploy and `./relative` paths resolve to nothing.

services:
  mydevenv2:
    image: repo.indexarr.net/indexarr/mydevenv2:latest
    container_name: mydevenv2
    restart: unless-stopped
    hostname: mydevenv2

    # `mydevenv2-server` execs as PID 1 (see entrypoint.sh). It only wait()s
    # on the children it spawns directly (one-shot `git` calls, PTY session
    # children); it has no SIGCHLD reaper for orphans reparented to PID 1.
    # Terminal sessions running agents (Codex/Claude) fork lots of short-lived
    # subprocesses (git, etc.) whose immediate parent can exit first, leaving
    # an orphan that reparents to PID 1 and is never reaped — a permanent
    # zombie that holds a PID slot. Docker's `init: true` inserts tini as the
    # real PID 1, which reaps all of these, so mydevenv2-server never needs to.
    init: true

    # Bridge networking + an explicit port. Tailscale runs in KERNEL mode
    # inside the container (see entrypoint.sh) so an optional exit node can
    # transparently route egress; that needs the TUN device + NET_ADMIN below.
    # The pod becomes reachable at 100.x.x.x via Tailscale.
    ports:
      - "8910:8910"

    # Kernel-mode Tailscale requirements. Without these the daemon falls back
    # and the exit node silently no-ops. The host must expose /dev/net/tun
    # (Node B does). LAN + tailnet stay direct; only public egress uses the
    # exit node — so a down exit node degrades to direct, never a lockout.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

    volumes:
      # The workspace. ALL development happens here.
      - /mnt/2tnvme/docker/volumes/mydevenv2/workspace:/home/sprooty/Working
      # Persist sprooty's home (caches, history, etc.) across pod rebuilds.
      - /mnt/2tnvme/docker/volumes/mydevenv2/home:/home/sprooty
      # Persist tailscaled state so we don't re-auth on every restart.
      - /mnt/2tnvme/docker/volumes/mydevenv2/tailscale:/var/lib/tailscale

    environment:
      # Server
      MYDEVENV2_TOKEN: ${MYDEVENV2_TOKEN}
      # Optional scoped tokens. JSON array of objects:
      # [{"name":"readonly","token":"...","capabilities":[]}]
      MYDEVENV2_EXTRA_TOKENS_JSON: ${MYDEVENV2_EXTRA_TOKENS_JSON:-}
      # Per-token mutation rate limit for the primary token. Extra tokens can
      # override their own limit inside MYDEVENV2_EXTRA_TOKENS_JSON.
      MYDEVENV2_MUTATING_REQUEST_LIMIT_PER_MINUTE: ${MYDEVENV2_MUTATING_REQUEST_LIMIT_PER_MINUTE:-600}
      MYDEVENV2_BIND: 0.0.0.0:8910
      MYDEVENV2_SCROLLBACK_BYTES: ${MYDEVENV2_SCROLLBACK_BYTES:-4194304}
      RUST_LOG: info
      # Agent service auth. Default interactive sessions run through
      # mydevenv2-agent-auth so Forgejo/Woodpecker/GitHub/Komodo credentials
      # are available to shell-launched tools without persisting tokens.
      INFISICAL_API_URL: http://100.92.54.45:8400
      INFISICAL_CLIENT_ID: ${HOMELAB_MYDEVENV2_INFISICAL_CLIENT_ID:?HOMELAB_MYDEVENV2_INFISICAL_CLIENT_ID is required for prod-mydevenv2 agent auth}
      INFISICAL_CLIENT_SECRET: ${HOMELAB_MYDEVENV2_INFISICAL_CLIENT_SECRET:?HOMELAB_MYDEVENV2_INFISICAL_CLIENT_SECRET is required for prod-mydevenv2 agent auth}
      MYDEVENV2_AGENT_AUTH_REQUIRED: "1"
      MYDEVENV2_AUTO_AGENT_AUTH: "1"
      # Private compatibility only; Vogt and the engine do not require it.
      MYDEVENV2_CADASTRE_MCP_ENABLED: "1"
      # Tailscale auto-join. Issue a one-shot reusable key from the admin UI.
      TAILSCALE_AUTH_KEY: ${HOMELAB_MYDEVENV2_TAILSCALE_AUTH_KEY}
      TAILSCALE_HOSTNAME: mydevenv2
      # Keep tailnet DNS available for private service names used by native
      # MCP/API clients. Override only when an equivalent resolver is present.
      MYDEVENV2_TAILSCALE_ACCEPT_DNS: ${MYDEVENV2_TAILSCALE_ACCEPT_DNS:-1}
      # Route all public egress via this exit node when explicitly set
      # (kernel mode, see above). Blank by default: LAN + tailnet + accepted
      # subnet routes stay direct, and public egress does too until opted in.
      TAILSCALE_EXIT_NODE: ${MYDEVENV2_TAILSCALE_EXIT_NODE:-}
      # Phase 5: set the verification bit only after the first two are wired
      # and an operator has watched a launched process render in the stream.
      START_SWAY: "0"
      GUI_STREAM_URL: ""
      GUI_STREAM_VERIFIED: "0"
      # Phase 6: FCM service-account JSON (single-line). Empty disables FCM
      # transport; web-push still works for any browser subscription.
      MYDEVENV2_FCM_SERVICE_ACCOUNT_JSON: ${MYDEVENV2_FCM_SERVICE_ACCOUNT_JSON}
      # Conversational assistant (docs/ASSISTANT.md). Empty key disables the
      # feature entirely — routes 404 and the PWA hides the tab.
      MYDEVENV2_ASSISTANT_API_KEY: ${MYDEVENV2_ASSISTANT_API_KEY:-}
      MYDEVENV2_ASSISTANT_MODEL: ${MYDEVENV2_ASSISTANT_MODEL:-gpt-5.4-mini}
      MYDEVENV2_ASSISTANT_BASE_URL: ${MYDEVENV2_ASSISTANT_BASE_URL:-https://api.theclawbay.com/v1}
      # The cargo cache is on the host bind-mount; sccache hits Redis on Node B.
      SCCACHE_REDIS: redis://100.92.54.45:6380

    # Host Docker access is intentionally NOT enabled in the base stack.
    # Choose an explicit overlay in Komodo when you want host-daemon access.

    # Sway/Selkies (Phase 5) will benefit from /dev/dri pass-through for GPU
    # encode. Add it to the `devices:` list above when Phase 5 lands:
    #   - /dev/dri:/dev/dri

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8910/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
