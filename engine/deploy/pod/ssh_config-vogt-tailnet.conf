# Tailnet SSH for session pods (WI-4716, part of WI-4713).
#
# A session pod has no tailnet identity of its own. It reaches the tailnet
# through a SOCKS5 proxy: the engine's (vogt-dev-engine.vogt-dev.svc:1055, the
# default) or a per-pod sidecar's (127.0.0.1:1055, via VOGT_TAILNET_SOCKS5; see
# vogt-tailnet-connect). This file sends ssh to tailnet destinations through it. Nothing else is proxied: no
# global proxy environment, no tailscale CLI.
#
# Installed as /etc/ssh/ssh_config.d/50-vogt-tailnet.conf (Ubuntu's
# /etc/ssh/ssh_config includes that directory). Short names come first so their
# HostName is what the Match below sees. Addresses are from the estate-hosts
# skill; the policy (ops infra/tailscale/policy.hujson) decides who may log in.

Host edgerouter vultr
    HostName 100.92.4.57
    User root

Host hertzde3 hetzner3
    HostName 100.76.94.94
    User sprooty

Host node-e
    HostName 100.118.6.65
    User sprooty

Host node-f
    HostName 100.69.108.33
    User sprooty

Host winrarhost winrarhost1 node-b
    HostName 100.92.54.45
    User sprooty

Host graft-dev
    HostName 100.99.200.95
    User sprooty

Host upright
    HostName 100.87.55.125
    User upright

# 100.64.0.0/10 is 100.64.* to 100.127.*; ssh Match has no CIDR, so each second
# octet is listed.
Match host "100.64.*,100.65.*,100.66.*,100.67.*,100.68.*,100.69.*,100.70.*,100.71.*,100.72.*,100.73.*,100.74.*,100.75.*,100.76.*,100.77.*,100.78.*,100.79.*,100.80.*,100.81.*,100.82.*,100.83.*,100.84.*,100.85.*,100.86.*,100.87.*,100.88.*,100.89.*,100.90.*,100.91.*,100.92.*,100.93.*,100.94.*,100.95.*,100.96.*,100.97.*,100.98.*,100.99.*,100.100.*,100.101.*,100.102.*,100.103.*,100.104.*,100.105.*,100.106.*,100.107.*,100.108.*,100.109.*,100.110.*,100.111.*,100.112.*,100.113.*,100.114.*,100.115.*,100.116.*,100.117.*,100.118.*,100.119.*,100.120.*,100.121.*,100.122.*,100.123.*,100.124.*,100.125.*,100.126.*,100.127.*,*.ts.net"
    ProxyCommand /usr/local/bin/vogt-tailnet-connect %h %p
    ConnectTimeout 10
    BatchMode yes
    StrictHostKeyChecking accept-new
