[package]
name = "vogt-session-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Outbound PTY session agent for Vogt session pods"

[[bin]]
name = "vogt-session-agent"
path = "src/main.rs"

[lib]
name = "vogt_session_agent"
path = "src/lib.rs"

[dependencies]
base64 = "0.23"
futures-util = "0.3"
http = "1"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
sha2 = "0.11"
walkdir = "2"
vogt-engine-contract = { path = "../contract" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
tokio-rustls = "0.26"
