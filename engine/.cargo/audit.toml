# Keep local `cargo audit` consistent with deny.toml and rust-core.yml.
# Reviewed 2026-11-06 (WI-2674); dated rationale for each exception lives
# in ../deny.toml relative to the engine workspace, not duplicated here.
[advisories]
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2024-0449",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0387",
]

[output]
deny = ["warnings"]
quiet = false
