[package]
name = "vogt-engine-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "vogt-engine"
path = "src/main.rs"

[lib]
name = "vogt_engine_server"
path = "src/lib.rs"

[dependencies]
vogt-engine-contract = { path = "../contract" }
# The live call pipeline (WI-960), published as its own crate:
# https://github.com/TheDancingDeveloper-org/voicepipe
voicepipe = "0.1"
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip"] }
hyper = "1"

portable-pty = "0.9"
# Renders a session's scrollback into a screen grid for `/screen`.
vt100 = "0.16"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4.5", features = ["derive", "env"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

futures-util = "0.3"
bytes = "1"
dashmap = "6"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
subtle = "2"
time = { version = "0.3", features = ["serde", "formatting"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

# Session history
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }

# Phase 6 — push notifications
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
web-push = "0.11"
# jsonwebtoken 10.x defers RSA/ECDSA signing to a process-level rustls
# CryptoProvider unless a crypto backend feature is selected; with none, minting
# the FCM service-account JWT panics at runtime ("Could not automatically
# determine the process-level CryptoProvider"). `rust_crypto` links a
# self-contained pure-Rust backend (rsa + sha2 for RS256), so no provider needs
# installing. `use_pem` (default) stays on for EncodingKey::from_rsa_pem.
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
base64 = "0.23"
sha2 = "0.11"
ring = "0.17"

# The optional graft integration (WI-2227, graft D10): the gRPC messages and
# services of graft's wire protocol, from the graft repository at a pinned
# revision (graft is not published to crates.io).
graft-proto = { git = "https://github.com/TheDancingDeveloper-org/graft", rev = "2e97601603119b9c5b967dfd8b3565a9d8324633" }
tonic = { version = "0.14", features = ["gzip"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-tungstenite = "0.30"
tempfile = "3"
# The fake graft server in `graft`'s tests listens on a loopback port.
tokio-stream = { version = "0.1", features = ["net"] }
flate2 = "1"
