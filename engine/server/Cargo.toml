[package]
name = "vogt-engine-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "vogt-engine"
path = "src/main.rs"

[lib]
name = "vogt_engine_server"
path = "src/lib.rs"

[dependencies]
vogt-engine-contract = { path = "../contract", version = "0.1.0" }
vogt-session-agent = { path = "../session-agent", version = "0.1.0" }
# The live call pipeline (WI-960), published as its own crate:
# https://github.com/TheDancingDeveloper-org/voicepipe
voicepipe = "0.1"
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip"] }
hyper = "1"

portable-pty = "0.9"
# Renders a session's scrollback into a screen grid for `/screen`.
vt100 = "0.16"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
url = "2"
clap = { version = "4.5", features = ["derive", "env"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

futures-util = "0.3"
bytes = "1"
dashmap = "6"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
subtle = "2"
time = { version = "0.3", features = ["serde", "formatting"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

# Session history
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }

# Phase 6 — push notifications
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
web-push = "0.11"
# jsonwebtoken 10.x defers RSA/ECDSA signing to a process-level rustls
# CryptoProvider unless a crypto backend feature is selected; with none, minting
# the FCM service-account JWT panics at runtime ("Could not automatically
# determine the process-level CryptoProvider"). `rust_crypto` links a
# self-contained pure-Rust backend (rsa + sha2 for RS256), so no provider needs
# installing. `use_pem` (default) stays on for EncodingKey::from_rsa_pem.
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
base64 = "0.23"
sha2 = "0.11"
# Gzip for the workspace snapshot served to session pods (WI-4127).
flate2 = "1"
ring = "0.17"
kube = { version = "0.98", features = ["client", "rustls-tls", "config"] }
k8s-openapi = { version = "0.24", features = ["v1_30"] }
# gRPC client for graft's AdminService.MintToken (WI-3229): the per-session
# graft token. The two messages are hand-written prost structs (no protoc, and
# graft-proto is not published); `tls-ring` matches reqwest's rustls provider.
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
prost = "0.14"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# A fake graft AdminService for the MintToken client tests.
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "server", "router"] }
tokio-tungstenite = "0.30"
