[package]
name = "vogt-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Drop-in Rust replacement for the Vogt Python core process"

[[bin]]
name = "vogt-core"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1"
fancy-regex = "0.14"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
toml = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "=0.4.44", default-features = false, features = ["now", "std", "serde"] }
scrypt = "0.12.0"
# The OS entropy source for minted secrets. A hand-rolled read of /dev/urandom
# that swallowed its error minted a token from a buffer of zeroes.
getrandom = "0.2"
subtle = "2.6.1"
hex = "0.4.3"
base64 = "0.23.1"
unicode-general-category = "1.1.0"
# The adapter HTTP client. `http1` below handles plain http with the standard
# library; https (GitHub, an https peer) needs a TLS stack. native-certs trusts
# the platform store, so a private CA that Python trusts is trusted here too.
# No OpenSSL.
ureq = { version = "2", features = ["tls"], default-features = false }
# The same rustls ureq speaks, so the client can hand it a trust store built
# from the platform certificates instead of only the bundled Mozilla roots.
# ureq's own native-certs feature is not used. rustls-native-certs returns
# only the SSL_CERT_FILE bundle when that variable is set, so the store is
# assembled by hand: the env bundle, parsed with rustls-pemfile, plus the
# platform bundle openssl-probe finds.
rustls = { version = "0.23.19", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
rustls-pemfile = "2"
openssl-probe = "0.1.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
