[package]
name = "vogt-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Drop-in Rust replacement for the Vogt Python core process"

[[bin]]
name = "vogt-core"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
