[package]
name = "vogt-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Drop-in Rust replacement for the Vogt Python core process"

[[bin]]
name = "vogt-core"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1"
fancy-regex = "0.14"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "=0.4.44", default-features = false, features = ["now", "std", "serde"] }
scrypt = "0.12.0"
subtle = "2.6.1"
hex = "0.4.3"
base64 = "0.23.1"
# The adapter HTTP client. `http1` below handles plain http with the standard
# library; https (GitHub, an https peer) needs a TLS stack, and ureq on rustls
# is the smallest blocking one. No native-tls, so no system OpenSSL.
ureq = { version = "2", features = ["tls"], default-features = false }
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
