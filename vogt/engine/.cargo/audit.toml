# Single ignore list for cargo audit: ci.yml and rust-core.yml both read it (WI-4658).
# Reviewed 2026-11-06 (WI-2674); dated rationale for each exception lives
# in ../deny.toml relative to the engine workspace, not duplicated here.
[advisories]
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2024-0449",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0387",
    "RUSTSEC-2026-0459",
    "RUSTSEC-2026-0543",
]

[output]
deny = ["warnings"]
quiet = false
