[package]
name = "vogt-voice-tts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
bytes = "1"
hound = "3"
# piper-rs 0.2.0 requires exactly this ONNX Runtime binding (`=2.0.0-rc.12`).
# The session is built here (`Session::builder`), so ort is a direct dependency
# and must name the same release candidate.
ort = "=2.0.0-rc.12"
# Constrain the sys crate to the same release candidate; a lone ort-sys bump
# does not build against an older ort. Both move by hand with piper-rs.
ort-sys = "=2.0.0-rc.12"
piper-rs = "=0.2.0"
serde_json = "1"
# Version floors that steer the shared voice/Cargo.lock past the vulnerable
# transitive crates: ureq >=2.12 pulls rustls-webpki >=0.103.13
# (clears GHSA-82j2-j2ch-gfr8 et al.) and url >=2.5 pulls idna >=1.0
# (clears GHSA-h97m-ww89-6jmq). ureq is not referenced directly from tts/src;
# it is present only to float the shared lock past the vulnerable transitive
# crates, and 3.x keeps that floor.
ureq = "3.4"
url = "2.5"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }
thiserror = "2"

[dev-dependencies]
tempfile = "=3.27.0"
