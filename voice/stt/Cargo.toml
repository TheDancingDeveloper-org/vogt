[package]
name = "vogt-voice-stt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
bytes = "1"
hound = "3"
opus = "=0.3.0"
# MediaRecorder commonly emits WebM/Opus. Keep decoding in-process and
# Rust-only; the explicit feature set avoids unrelated media codecs.
symphonia = { version = "=0.5.5", default-features = false, features = ["mkv", "ogg", "pcm", "vorbis", "wav"] }
tempfile = "=3.23.0"
tokio = { version = "1", features = ["fs", "macros", "process", "rt", "time"] }
thiserror = "2"
whisper-rs = "=0.13.0"
