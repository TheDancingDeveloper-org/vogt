<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <!-- Set the shell theme BEFORE first paint so the app never flashes the
         wrong palette (#299). Mirrors the resolution in src/appThemes.ts: read
         the stored selection, and map "system"/unset to the OS preference.
         Kept tiny and dependency-free on purpose. -->
    <script>
      (function () {
        try {
          var THEMES = {
            dark: 1, dim: 1, "hc-dark": 1,
            light: 1, soft: 1, sepia: 1, rose: 1, "hc-light": 1,
          };
          var sel = null;
          try {
            sel = localStorage.getItem("vogt.appTheme.v1");
          } catch (e) { /* storage blocked */ }
          var theme;
          if (sel && THEMES[sel]) {
            theme = sel;
          } else {
            var dark = true;
            try {
              dark = !window.matchMedia
                || window.matchMedia("(prefers-color-scheme: dark)").matches;
            } catch (e) { /* matchMedia blocked */ }
            theme = dark ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <meta name="theme-color" content="#0d1117" />
    <meta name="description" content="AI-native product development environment for projects, work, and coding sessions." />
    <title>Vogt</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
